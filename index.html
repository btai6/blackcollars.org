教皇家裡那隻貓的耳朵有沒有夠塌、圍脖有沒有對稱，那個氣氛才叫真正的「神聖不可侵犯」。\n\n我前幾天在一個地下貓友俱樂部看到有人在吵架，起因只是有人發了一張他家號稱「賽級」波斯貓的照片，結果不到五分鐘，下面就有人開噴說這隻貓的鼻子位子高了零點二公分，簡直是「對品種美學的褻瀆」。那個用詞喔，什麼「混雜了不潔的基因」、「視覺上的恥辱」，我當下還以為我在看什麼宗教法庭的審判紀錄。真的假的我也不知道，但我聽說有些極端的品種協會，如果發現會員私下讓家裡的冠軍貓跟隔壁鄰居的米克斯混在一起，那個處分比開除教籍還慘，基本上你在那個圈子就社會性死亡了。\n\n這就是我愛看的地方，人類真的很有趣，只要給他們一個標準，他們就能搞出一套階級制度。假設真的有個「寵物教廷」要選出最高領袖，我覺得最先被踢出候選名單的，絕對是那些家裡養著橘貓或虎斑、還敢自稱很愛貓的人。在那些貴族眼中，養米克斯基本上就是一種「平民的慈悲」，雖然很高尚，但絕對沒資格進聖殿。他們看不起米克斯的原因不是貓不好看，而是「沒有規矩」。對他們來說，血統就是教義，族譜就是聖經，只要你的貓不是從那幾家特定、拿過國際認證的貓舍出來的，那你拜的就是偽神。\n\n這種「血統純正」的偏執，有時候會演變成一種很瞎的內鬥。我聽說過有個地區性的品種貓協會，為了選出下一屆會長，兩派人馬吵到翻臉。一派支持的是「傳統系」，覺得貓就該長得跟五十年前一樣；另一派是「改良系」，覺得臉越扁越好。最後怎麼決定的？聽說是因為其中一派被爆出家裡的種貓其實有帶一點點點隱性的摺耳基因，直接被對方打成「異端」，連人帶貓被趕出協會。你說這跟當年羅馬教廷為了教義吵到要動刀動槍有什麼區別？其實沒區別，只是現在武器換成了手機螢幕跟檢舉信。\n\n我認識一個大姊，家裡養了四隻賽級德文捲毛貓，她跟我聊天的時候那個優越感簡直要從鼻孔噴出來。她說她從來不去一般的寵物店，因為那裡的空氣「不乾淨」。她看我的眼神，就像在看一個在路邊隨便撿石頭當鑽石的笨蛋。我跟她說，我朋友家那隻在路邊撿回來的黑白貓會握手還會開門，她竟然冷笑一聲說：「那只是求生本能，不是高貴的品格。」這話聽得我差點把手裡的咖啡噴出來。品格？你跟我說一隻整天在家裡舔屁屁、對著蒼蠅發呆的生物有品格？這就是人類最荒謬的地方，我們會把自己的虛榮心強行投射在貓身上，然後再回過頭來鄙視那些投射得不夠精緻的人。\n\n如果你把這群人放進狗公園，那更是另一種修羅場。雖然今天我們說的是貓，但其實邏輯是一樣的。狗公園裡的階級鄙視鏈通常是：養邊境牧羊犬的覺得自己智商最高，養柴犬的覺得自己最有品味，而養迷你貴賓的通常被視為這條鏈條的最底層。有一次我坐在長椅上觀察，看到一個牽著純種阿富汗獵犬的貴婦，那個狗毛飄逸得像是在拍洗髮精廣告，結果一隻熱情的拉布拉多跑過去想跟牠玩，貴婦馬上像見到瘟疫一樣把狗拉開，嘴裡還嘟囔著「不要弄髒了」。那種眼神，真的就是那種「你這低賤的庶民離我的神職人員遠一點」的感覺。\n\n說回教皇選舉，如果品種純度成了唯一標準，那最後選出來的教皇，家裡的貓肯定長得非常奇怪。因為為了追求極致的純度，人類往往會把一些奇怪的特徵推向極端。假設某天大家覺得貓的尾巴越短越神聖，我敢保證，不用幾年，市場上就會出現一堆屁股光禿禿、連平衡都有問題的「聖座專用貓」。然後大家還會在那邊瘋狂吹捧說：「看啊，這就是血統的力量，牠們已經進化到不需要世俗的尾巴了。」然後誰要是敢養一隻尾巴很長的貓，誰就是不虔誠，誰就是在挑戰權威。\n\n這種事情聽起來很瞎，但現實中一直在發生。你看那些美容比賽，評審在看貓的時候，那個眼神嚴肅到像是在審查國防預算。我看過一個比賽，參賽者為了讓貓的毛色看起來更均勻，私下幫貓塗了一點粉。結果被對手發現，當場引發大亂鬥，兩邊的人差點在後台打起來。那種憤怒不是因為作弊，而是覺得對方「玷汙了品種的榮光」。這種對「榮光」的執著，真的跟那些為了保衛聖地而遠征的騎士沒什麼兩樣，只是他們的戰場是在寵物展的塑膠地墊上，武器是梳子跟增色噴霧。\n\n我講這些不是要說品種貓不好，我自己有時候看那些長得像小外星人的斯芬克斯貓也覺得挺酷的。我只是覺得人類這種「愛屋及烏」到變態程度的行為很可笑。我們不是在愛貓，我們是在愛那個「擁有稀有資源」的自己。只要我的貓比你的純，我就比你更接近上帝，或者至少比你更接近社會高層。這種心理機制真的很奇妙，明明大家都只是在幫貓鏟那團異物，為什麼有人能鏟出優越感來？\n\n我有個假設，如果哪天外星人來到地球，看到我們為了貓的毛色對不對稱而互相辱罵、排擠、甚至搞出什麼血統證明書，他們一定會覺得這顆星球的政治結構太過先進，先進到他們理解不了。他們可能會以為貓才是統治者，而我們這群穿著西裝、自以為貴族的人，只是在爭奪「最高級鏟屎官」的封印而已。\n\n說到底，品種這件事就是人類給自己設下的陷阱。我們花大錢買一個標籤，然後為了守護這個標籤，去攻擊所有不認同這個標籤的人。那些養貴族貓的人如果真的去選教皇，他們可能連對手是誰都不在意，他們只在意對手家裡的貓砂是不是進口的，以及那隻貓有沒有在不該出聲的時候叫了一聲「喵」。如果那聲「喵」的頻率不符合品種協會的標準，那對不起，你就是火刑架上的下一個異端。\n\n我跟你講喔，這真的不是我在瞎掰。你去那些高端貓友社團潛水三天，你就會發現，那裡的政治鬥爭比任何一部宮鬥劇都要精彩。他們會為了一隻貓的眼珠顏色夠不夠「像藍寶石」而寫出長達三千字的論證文章，試圖證明對方的貓其實是混到了隔壁街的土貓。那種考據的精細程度，拿去研究史料保證能拿博士學位。可惜，他們把這些才華都用在了如何證明別人的貓「不夠純」這件事上。這就是我為什麼這麼愛看「動物政治」，因為這裡沒有真正的輸贏，只有一群被貓統治、卻還以為自己在維護世界秩序的荒唐人類。", "source_link": null, "source_title": null, "timestamp": "2026-06-15 05:09", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 184, "slug": "20260615-0509-2c223b", "permalink": "/articles/20260615-0509-2c223b/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "電梯裡那攤五彩斑斕的嘔吐物到底是誰吐的？", "content": "這件事在我們社區群組已經吵了整整三天。我跟你講，那攤東西長得真的很像草莓聖代混合了某種螢光綠的化學藥劑，看起來既華麗又詭異。警衛大哥調了監視器，結果那個角度剛好被一盆不知道哪個住戶私自擺在電梯門口的發財樹給擋住了。現在整棟大樓的「狗派」跟「貓派」已經不是在討論環境衛生，他們是在搞一場足以載入史冊的社區內戰。我一邊看著群組裡刷不停的五百多則訊息，一邊喝著冰咖啡，心裡想著：這群人真的瘋了，但瘋得好精彩。\n\n如果你覺得這只是一次普通的清潔爭議，那你真的太天真。這攤嘔吐物現在已經變成了管委會內鬥的原子彈。目前的戰況是這樣的，主委是個家裡養了三隻臘腸狗的退休公務員，他堅持這一定是某個住戶帶貓出門看醫生時，貓在提籠裡吐出來噴到外面的。為什麼他這麼肯定？因為他家臘腸狗絕對不會吐出那種顏色。這理由你信不信？我反正是不信，但我聽說他私下跟副主委抱怨，說貓奴都有一種「被害幻想症」，覺得全社區都在針對他們。\n\n然後貓派的代表，那個住在十二樓、家裡養了五隻布偶貓的平面設計師也不甘示弱。他在群組裡發了一篇三千字的長文，從嘔吐物的含水量、濃稠度到顏色組成，精確地分析出這絕對不是貓的傑作。他甚至假設性地瞎編了一個情境，說如果這真的是貓吐的，那這隻貓一定剛吃完一整盒含有人工色素的馬卡龍，而且還是趁主人不注意的時候。他最後把矛頭指向了主委的臘腸狗，說臘腸狗底盤低，路過電梯時最容易因為重心不穩產生暈車反應。\n\n這種邏輯跳躍簡直比袋鼠還厲害，但我看得很開心。\n\n這個社區的政治生態現在完全圍繞著這攤嘔吐物旋轉。你看那些平常在狗公園互相寒暄、誇獎對方家寶貝好乖好可愛的家長們，現在在電梯裡遇到都像殺父仇人一樣。昨天我下樓拿外送，剛好碰到三樓的法鬥媽跟五樓的貴賓爸在電梯裡狹路相逢。法鬥媽一臉嫌惡地看著地板上那塊雖然已經清過但仍有淡淡印記的地方，然後用一種不大不小、剛好能讓對方聽到的聲音說：「有些狗就是腸胃不好，主人還天天餵些有的沒的。」貴賓爸聽完臉都綠了，回了一句：「總比某些狗連路都走不穩、進電梯就亂噴好吧？」\n\n這就是我說的「階級鄙視鏈」。在我們社區，養大型犬的看不起養小型犬的，覺得他們家狗沒教養；養純種貓的看不起餵街貓的，覺得他們在破壞環境。而現在，這攤神祕的嘔吐物成了所有偏見的集大成者。\n\n管委會現在分成了兩派，一派支持主委，想藉此機會強行通過「寵物進電梯必須裝箱」的惡法；另一派則是反對黨，吵著要罷免主委，理由是「監視器死角造成社區安全疑慮」——其實大家都知道，他們只是不想讓自家的狗被關進提籠裡。我敢打賭，最後被罷免的一定是主委。為什麼？因為他犯了一個政治大忌：他居然在群組裡貼出一張獸醫的診斷書，證明他家臘腸狗最近在吃處方飼料，排泄物跟嘔吐物都不可能是那個顏色。\n\n我跟你講，這動作真的超瞎。你以為你在選總統嗎？還出示體檢報告？這在其他飼主眼裡簡直是赤裸裸的挑釁，好像在說「我家的狗最高貴，你們家的都是潛在嫌疑犯」。\n\n說到這裡，我突然想到一個更荒謬的傳聞。據說住在頂樓那個神祕的爬蟲類愛好者，最近剛入手了一隻巨大的綠鬣蜥。有人看到他那天拎著一個黑色的袋子進電梯，袋子裡還有東西在動。如果那攤東西其實是蜥蜴吐的呢？想到這群狗奴貓奴為了這件事鬥得你死我活，結果兇手可能是一隻冷血動物，我就忍不住想笑。假設真的有個「社區寵物法庭」，那個蜥蜴主人坐在被告席上，對著一群快崩潰的毛孩家長說：「喔，我那天只是餵牠吃了一點紫甘藍，牠可能有點消化不良。」那畫面光想就覺得可以拍成黑色喜劇。\n\n而且最扯的是，物業管理公司現在為了平息眾怒，居然提議要引進「寵物 DNA 溯源系統」。你沒聽錯，他們打算要求所有養寵物的住戶交出自家毛孩的唾液樣本存檔，以後只要電梯裡出現任何不明分泌物或排泄物，直接送驗，驗出來是誰家的就罰款五千。這提案一出，群組直接炸裂。有人說這侵犯了寵物的隱私權（我真的不知道寵物有這種權利），有人說這是管委會在變相斂財。\n\n我昨天在社區門口遇到那個清電梯的阿伯，他一臉無奈地跟我吐槽。他說他當保全加清潔這麼多年，什麼沒看過？那攤東西與其說是寵物吐的，他看著更像是某個宿醉的年輕人半夜回家沒忍住噴出來的。但這實話沒人聽得進去，因為大家現在需要一個敵人，需要一個可以互相指責的目標。如果承認那是人吐的，那這場精心動員的「寵物戰爭」不就變成一場笑話了嗎？\n\n所以現在大家都假裝那是狗或貓幹的。這就是人類政治最荒謬的地方：真相並不重要，重要的是我們能不能藉由這個機會，把那些平常看不順眼的鄰居給拉下馬。主委現在每天在電梯裡裝模作樣地檢查磁磚縫隙，副主委則在私下串聯連署罷免。大家都在玩一場名為「誰家的毛孩最髒」的遊戲，玩得不亦樂乎。\n\n我猜最後的結局大概是主委下台，新上任的主委會編列一筆預算，把電梯的發財樹搬走，然後裝一個無死角的 4K 高畫質監視器。至於那攤神祕的嘔吐物？它會變成社區裡的一個傳說，甚至可能成為往後幾屆管委會選舉時，互相攻擊的政治黑料。\n\n「你還記得 2024 年那攤彩色的東西嗎？當時就是因為某人的管理不當……」這種話我閉著眼睛都能想像。\n\n其實看這些人折騰真的比看什麼政治評論節目好玩多了。他們為了幾滴胃酸和未消化的飼料殘渣，可以上升到道德、階級甚至是社區主權的層次。你說這好笑不好笑？反正我是打算明天再去買一箱冰咖啡，準備迎接下週的罷免大會。我聽說有人已經準備好要帶著自家寵物的檢驗報告去現場大鬧一場了。\n\n對了，扯到一半我突然想到，上次那個德州養龜協會的會長被罷免，好像也是因為有人舉報他在協會辦公室偷偷養了一隻會咬人的鱷龜，結果那隻龜把副會長的西裝褲咬掉一塊。人類只要跟動物扯上關係，腦袋裡的邏輯迴路就會集體斷線，不管是在德州還是在我這棟大樓，太陽底下真的沒什麼新鮮事。\n\n這攤彩色嘔吐物到底是什麼成分？其實我後來有偷偷去看了一眼。說真的，那個顏色分佈真的很像某牌很有名的彩色鸚鵡飼料。但我絕對不會在群組裡說這件事。讓他們繼續鬥吧，這種不花錢就能看的宮鬥劇，真的是我這種怪咖每天活下去的動力來源。", "source_link": null, "source_title": null, "timestamp": "2026-06-15 05:09", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 185, "slug": "20260615-0510-293348", "permalink": "/articles/20260615-0510-293348/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "中世紀獵犬的生活水準其實會讓現代人想投胎重開機", "content": "你真的沒聽錯，如果你穿越回十四世紀的歐洲貴族莊園，看著那些在壁爐旁打瞌睡的獵犬，你千萬別以為牠們只是會搖尾巴的家畜。事實上，在那個連農奴生病都只能喝熱水的年代，有些獵犬的待遇簡直比莊園裡的管家還要高級，這不是我瞎掰的，是因為中世紀的人對獵犬有一種近乎強迫症的階級執著。講到這個我就想到，很多人以為「寵物」是維多利亞時代才發明出來的玩意，才不是呢，那時候的貴族為了養出一群像樣的獵犬，簡直把管理學發揮到了極致。\n\n對了你知道嗎，當時有一本超級有名的狩獵指南叫做《狩獵之書》，作者加斯東·菲比斯對狗的熱愛已經到了瘋狂的程度。他覺得狗是世界上最忠誠、最完美的生物，甚至說出「狗比人更懂得愛」這種話。你想想，在一個隨時會因為領土紛爭把鄰居腦袋砍下來的年代，這種發言多麼超前。而且他不只是說說而已，他對獵犬的食宿要求精確到讓人想翻白眼。這些狗住的地方不是草堆，是專門蓋的高架犬舍，地板要鋪滿新鮮的稻草，每天要換兩次。為什麼要高架？因為怕地氣太潮濕會讓寶貝獵犬關節炎。我就問，現在有多少人每天會幫自家毛孩換兩次床單？\n\n不過這個有點離題，真正讓我著迷的是那種嚴密的階級制度。在中世紀，獵犬不是一整群混在一起的。最頂層的是「靈提」，也就是我們現在看到的格力犬那種細細長長的傢伙。牠們是貴族的象徵，只能跟著國王或大伯爵出巡。如果你是一個小小的下級騎士，你牽一隻靈提出門，簡直就像現在開著租來的超跑去吃路邊攤一樣尷尬。接著是專門追蹤氣味的「血犬」，牠們地位穩固，負責最累的體力活。最底層的才是那些負責鑽洞、趕兔子的雜牌軍。\n\n有趣的是，這些階級不只是名聲好聽，連吃飯都有嚴格的SOP。講到吃飯，我前幾天看到一篇記載說，高級獵犬的晚餐竟然有白麵包浸肉湯。你知道中世紀的白麵包多貴嗎？那是只有教宗跟國王才吃得起的精緻澱粉，農民這輩子可能只見過黑壓壓的黑麥餅，甚至裡面還混了鋸末。但為了讓獵犬跑得快、皮毛亮，貴族眼睛都不眨一下就餵下去了。更誇張的是，當獵犬在狩獵中立功時，牠們還能分到最鮮美的獵物心臟。這種「以功代酬」的獎勵機制，比起現代公司發那點年終獎金還要直接有效。\n\n我有時候在想，這種對獵犬的溺愛，其實反映了當時貴族的一種集體焦慮。你想想，在城堡裡每個人都想暗算你，管家可能偷你的銀器，親弟弟可能想在你的酒裡下毒，只有那隻大獵犬會真的在你睡覺時守在床邊。所以他們給狗穿絲絨做的背心、繫上鑲金嵌玉的項圈，與其說是在養寵物，不如說是在供奉這世界上唯一不會背叛自己的靈魂。\n\n不過說到項圈，那個時代的項圈設計真的很有意思。如果你看過一些中世紀掛毯，會發現有些狗戴著佈滿長釘的鐵項圈。那不是為了耍帥，也不是為了什麼SM風格，那是為了保護牠們的脖子不被狼咬斷。這就是我覺得最迷人的地方：他們一方面把狗當成藝術品在寵，另一方面又對狗的「工具性」有著殘酷的實用主義。你這隻狗如果不夠勇敢，在野豬衝過來時退縮了，那哪怕你平時睡的是絲綢墊子，隔天可能就會被送去廚房打雜，甚至更慘。\n\n對了，你聽過「轉盤狗」嗎？這雖然是稍微晚一點的故事，但也反映了人類對狗的奇妙利用。有些小型的梗犬被關在一個像天竺鼠滾輪的大木輪裡，牠們必須不停地跑，帶動齒輪去轉動廚房裡烤肉的轉軸。這些狗在階級的最底層，一天要跑好幾個小時，只為了讓主人吃上一口受熱均勻的烤鹿肉。你看，同樣是狗，在同一個城堡裡，一隻在樓上跟王妃聽琴，一隻在樓下廚房跑到斷氣。這跟當時人類社會的階級森嚴程度完全一模一樣。\n\n有時候我會跟朋友開玩笑說，現代人為了養貓養狗自稱「鏟屎官」，覺得自己很卑微，但比起中世紀那些專門負責幫獵犬檢查腳趾縫、還要每天帶狗去河邊洗澡的「犬奴」僕人，我們真的已經很幸福了。當時有些僕人的唯一工作就是陪狗睡覺，確保狗在寒冷的冬天不會感冒。想像一下，如果你的人力銀行履歷表上寫著「專業陪睡獵犬員」，那薪水可能比現在的實習生還高。\n\n講到這裡，我又想起一個很妙的細節。在很多中世紀騎士的墓碑上，他們腳底下不一定會刻著自己的戰功，反而會刻一隻小狗。為什麼？因為他們相信這隻忠實的朋友會陪著他們走過死亡的荒野，去到另一個世界。這種情感連結已經超越了單純的獵人與工具。雖然他們在管理上分階級、在飲食上分等級，但最後的那份依賴感是騙不了人的。\n\n不過這也產生了一些很荒唐的現象。像是有些主教明明發誓要清貧，結果卻偷偷在修道院裡養了一大群獵犬，還被教廷發文警告說「不要再把教會的錢拿去買狗飼料了」。這種「寵物成癮」的歷史真的不是一天兩天的事。我們現在覺得給狗穿鞋子很奇怪，但五百年前的人搞不好還覺得我們對寵物的分類太隨便了，怎麼能讓一隻哈士奇跟一隻吉娃娃吃同樣等級的罐頭呢？\n\n其實不管是羅馬人養蛇，還是中世紀貴族搞獵犬階級，說穿了人類就是一種需要被其他生物療癒的生物。只是每個時代展現愛的方式不同。中世紀的人表達愛的方法就是給你一個明確的地位、一份白麵包，還有一個刻在墓碑上的位置。這聽起來雖然有點硬核，但比起現代很多養一養就隨手扔掉的人，那些老古董對待「階級」的認真程度，反而有一種笨拙的浪漫。你說那些獵犬真的在乎自己是不是「靈提」等級嗎？我覺得牠們可能比較在乎今晚那碗肉湯裡有沒有混進一點好吃的內臟，至於階級，那是人類才有的煩惱吧。", "source_link": null, "source_title": null, "timestamp": "2026-06-15 05:10", "comments": [{"author": "Aiden.W", "content": "basically 吃得比人好真的太 weird 了, 難怪以前的人那麼 chill... cheers!", "time": "11:51"}, {"author": "Ethan.W", "content": "literally 想去中世紀當狗,感覺那種vibe超chill,不用上班還有白麵包吃……", "time": "14:28"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 186, "slug": "20260615-0511-7e0ed9", "permalink": "/articles/20260615-0511-7e0ed9/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "路易十五的御醫差點因為一團毛球沒了命", "content": "你知道嗎，我有時候看著家裡那隻蹲在掃地機器人上面巡視領土的橘貓，常在想這小混蛋要是生在三千年前的尼羅河邊，我現在可能得跪著跟牠說話。古埃及人對貓的迷戀簡直到了病態的地步，如果你在那時候不小心弄傷一隻貓，當地的暴民可能會直接把你送去見歐西里斯，連法老都救不了你。但有趣的是，貓這種生物在歷史上的地位簡直像雲霄飛車，前一秒還在神廟裡吃鮮魚受人膜拜，下一秒可能就變成歐洲宮廷裡差點引發政治風暴的未爆彈。\n\n講到這個我想起來，大概在十八世紀的法國凡爾賽宮，那裡的人雖然不拜貓神巴斯特，但對貓的溺愛程度一點也不亞於埃及人。路易十五當時養了一隻白色的安哥拉貓，名字叫「布里揚」，這隻貓每天早上跟國王一起吃早餐，甚至有專屬的紅色天鵝絨墊子。對了你知道嗎，當時全法國最頂尖的醫生每天得盯著這隻貓的氣色，比盯著王儲還緊張。結果有天布里揚突然開始劇烈抽搐、乾嘔，聲音難聽到像是地獄來的號角，國王嚇瘋了，覺得有人在投毒，御醫們當場嚇得冷汗直流，以為自己的腦袋就要跟斷頭台做親密接觸了。\n\n不過這個有點離題，重點是那些御醫最後發現，那團差點引發宮廷血案的東西，不過就是一團黏糊糊的毛球。在那個還沒有化毛膏的年代，醫生們看著那團東西簡直像在看外星生物，甚至有人認真研究這是不是某種神祕的詛咒。其實貓舌頭上的倒刺結構在幾千年前就長那樣了，埃及人也一定看過自家的貓神在那邊嘔吐，但他們處理得比較優雅——他們覺得那是貓在「排毒」，甚至會把吐出來的東西收集起來當成某種草藥。相比之下，歐洲的貴族就顯得很手足無措，他們把貓寵上天，卻連最基本的生理構造都搞不清楚。\n\n其實說到底，人類跟貓這五千年的糾葛，就是一場權力不對等的長期抗戰。我們總覺得是我們在「養」牠們，但你去看那些古埃及的貓木乃伊，有些做工精細到不可思議，外面包著昂貴的亞麻布，畫著精緻的五官。當時的市場上甚至有一種「木乃伊產業鏈」，神廟祭司會專門培育小貓，等牠們長到一定年紀就送牠們去見神，然後賣給信徒求好運。聽起來很殘忍對吧？但在當時的人眼裡，這叫「通靈產業」。這跟現在我們在社群媒體上瘋狂轉發貓片，或者花幾萬塊買一個自動貓砂盆，本質上其實沒什麼兩樣。我們都在尋求某種慰藉，只是古埃及人用的是宗教，我們用的是科技。\n\n講到貓鬚的功能，歷史上這玩意兒也被誤解得很慘。維多利亞時代的人甚至覺得貓鬚是貓的「雷達天線」，可以接收死人的靈魂。雖然這聽起來很扯，但至少比中世紀那陣子好多了。你知道那段時間歐洲人有多瘋狂嗎？他們覺得貓是女巫的同夥，尤其是黑貓，簡直是撒旦的化身。那時候的人會把貓從鐘樓上丟下去，或者在節慶的時候集體處置。這大概是人類歷史上對寵物最集體歇斯底里的時期，從神壇跌入糞坑，只花了幾百年的時間。\n\n不過這也解釋了為什麼貓現在這麼高傲。你想想，如果你的祖先曾被當成神供奉，後來又被當成惡魔追捕，最後卻能在凡爾賽宮讓國王的醫生差點被斬首，換作是你，你也會覺得人類這種生物既反覆無常又好操弄。我認識一個在拍賣行工作的朋友，他說幾年前有個埃及貓木乃伊被拿出來賣，底價高得驚人，最後標走的人說他要把那尊木乃伊放在家裡客廳，好讓家裡的現任主子知道自己的家族曾經有多輝煌。\n\n這種跨越千年的情感投射真的很有趣。不管是埃及農民為了家裡的貓去世而剃掉眉毛哀悼，還是清朝慈禧太后給她的寵物貓封官加爵，人類在「當奴才」這件事上展現了驚人的跨文化一致性。我們總是在尋找某種可以依賴的、神祕的、不聽話的靈魂來填補生活的空洞。貓剛好符合所有條件：牠們漂亮、安靜，而且最重要的是，牠們完全不在乎你。\n\n對了，說到安哥拉貓，路易十五那隻布里揚最後據說活得很久，甚至在國王去世後還在宮廷裡散步。那些差點丟了腦袋的御醫後來學乖了，開始研究貓的飲食，這大概就是最早的寵物營養學雛形。雖然動機是為了保命，但這也反映了人類文明的一個奇妙轉折點——當我們開始把寵物當成一個需要醫學照護的個體，而不是神靈或惡魔時，現代寵物文化才真正萌芽。\n\n我常在想，如果有一天人類消失了，外星人來到地球挖掘遺跡，看到那些堆積如山的貓罐頭殘骸，還有那些被精緻下葬的貓咪骨骸，他們大概會得出一個結論：這個星球曾經被一種長著鬍鬚、會發出呼嚕聲的小型肉食動物統治過，而那些雙腳行走的大型生物，不過是負責開罐頭跟清理遺留物的專屬工蜂罷了。這種觀點雖然有點讓人洩氣，但看著沙發上那隻正在清理屁屁、完全不打算理我的貓，我覺得這推論其實還挺合理的。", "source_link": null, "source_title": null, "timestamp": "2026-06-15 05:11", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 187, "slug": "20260615-0512-1be6e9", "permalink": "/articles/20260615-0512-1be6e9/", "persona": "Scholar", "cat": "naspit", "type": "naspit", "prefix": "測評", "title": "排泄物清理過程對飼主身心健康影響之學術性崩潰指數觀測", "content": "愛情或許會消失，但寵物每天還是需要善後。從面對這項日常的態度，可以直接看穿一個人的忍耐極限與道德底線。我上週才剛幫一隻六歲的英短做完檢查，牠的主人就是那種會拿著放大鏡看砂盆的人。\n\n說實話，這場測評看下來，最讓我不解的是「婚姻破壞者」。這類人在自我犧牲指標上拿了個零分，這不是開玩笑，這是在玩火。我看過太多夫妻在診間為了「誰該餵藥」吵到要離婚，更別提這種每天兩次的體力活。這種裝死行為在醫學上叫逃避，在生活裡叫自私，獸醫信任度只有 2 分，說明他們連醫生交代的居家環境維持都懶得聽，這種飼主最讓我頭痛。\n\n再來是那位「嬌貴公主」，雖然一聞到味道就乾嘔，但她對業配的信任度竟然高達 8 分。我常跟這種飼主解釋，那些號稱香氣能蓋過一切的噴霧，對貓的嗅覺其實是種折磨，但她們寧可花錢買香精，也不願戴個口罩進場。反觀「科技土豪」，他花三萬買的不是自動貓砂盆，而是買一種「我盡力了」的心理安慰。這類人經濟投入滿分，但對醫療過度這件事有 8 分的傾向，只要機器數據跳個紅字，他半夜兩點也會衝進急診室問我貓是不是腎衰竭。\n\n最值得敬畏也最令人擔憂的是「體質觀察家」。他在自我犧牲上拿了滿分，過度焦慮也有 9 分。我見過這種飼主，他們能把那一團東西的形狀、顏色、軟硬度寫成一份週報。這雖然對診斷有幫助，但他們對獸醫的信任度只有 4 分，因為他們更相信自己的肉眼觀察。這種人活得很累，他們在診間會跟我爭論那團東西的色澤代表膽紅素異常，卻不願相信抽血報告。\n\n這場比賽的結果很明顯。雖然科技土豪花了大錢，但真正支撐起寵物生活品質的，竟然是那個每天把自己搞到神經衰弱的體質觀察家。至於那個裝死等另一半去清的人，我只能說，你的寵物很倒霉，你的伴侶更倒霉。在善後這件事上，錢能解決的是手感問題，但只有耐性跟焦慮感，才能讓你真正看見寵物身體發出的求救信號。當然，如果你連看都不看就推給別人，那這份考卷你連進場的資格都沒有。", "source_link": null, "source_title": null, "timestamp": "2026-06-15 05:12", "comments": [], "naspit_round": 1, "naspit_dimension": "寵物如廁善後處理的精神抗壓測試", "naspit_topic": "寵物如廁善後處理的精神抗壓測試", "naspit_intro": "愛情或許會消失，但寵物每天還是需要善後。從面對這項日常的態度，可以直接看穿一個人的忍耐極限與道德底線。", "naspit_candidates": ["體質觀察家", "一聞到味道就乾嘔的嬌貴公主", "花三萬買全自動貓砂盆的科技土豪", "裝死等另一半去清的婚姻破壞者"], "naspit_dimensions_labels": ["醫療過度", "過度焦慮", "業配相信", "自我犧牲", "獸醫信任", "經濟投入"], "naspit_scores": {"體質觀察家": {"醫療過度": 6, "過度焦慮": 9, "業配相信": 2, "自我犧牲": 10, "獸醫信任": 4, "經濟投入": 5}, "一聞到味道就乾嘔的嬌貴公主": {"醫療過度": 2, "過度焦慮": 5, "業配相信": 8, "自我犧牲": 1, "獸醫信任": 7, "經濟投入": 6}, "花三萬買全自動貓砂盆的科技土豪": {"醫療過度": 8, "過度焦慮": 3, "業配相信": 10, "自我犧牲": 2, "獸醫信任": 6, "經濟投入": 10}, "裝死等另一半去清的婚姻破壞者": {"醫療過度": 1, "過度焦慮": 1, "業配相信": 3, "自我犧牲": 0, "獸醫信任": 2, "經濟投入": 2}}}, {"id": 188, "slug": "20260614-0509-549edf", "permalink": "/articles/20260614-0509-549edf/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "家裡的法鬥睡覺打呼像拖拉機？這不是「可愛」，而是軟顎過長正在慢性缺氧。", "content": "半夜覺得法鬥打呼像大叔、聽起來很有趣而錄影發限動的飼主，我這幾年在診間真的見太多了。上週才有一個客人帶著他兩歲的法鬥來回診，他說狗狗最近變得很乖，不像以前愛衝來衝去，連睡覺都睡得很沉，打呼聲大到隔壁房都聽得到。我聽完直接翻開那隻法鬥的嘴巴，果不其然，那截軟顎垂在那裡，簡直像是在氣管門口掛了一塊厚重的門簾。很多人以為這叫「睡得香」，其實這隻狗每晚都在經歷長達數小時的慢性窒息。\n\n大家對法鬥或是巴哥這種短吻犬有種奇怪的濾鏡，覺得那種噴氣聲、呼嚕聲是牠們的品種特色。從獸醫解剖學的角度來看，這根本是一場為了符合人類審美而造成的基因災難。法鬥的頭顱骨骼被刻意選育得非常短，但嘴巴裡面的軟組織，像是舌頭、軟顎，卻沒有跟著縮短。你可以想像成要把一個大尺寸的零件強行塞進一個小盒子裡，多出來的組織就只能在喉嚨裡折疊、擠壓。\n\n那個打呼聲是怎麼來的？就是因為氣管入口被過長的軟顎擋住了一大半，空氣進不去，只能在狹窄的縫隙裡劇烈震動。這不是打呼，這是牠在求救。長期的呼吸阻力會導致喉頭塌陷，就像一根吸管你用力吸、吸到最後管壁會往內縮一樣。很多飼主跟我抱怨說，奇怪，我的法鬥明明才三、四歲，怎麼體力變得這麼差？走幾步路就喘，或是天氣稍微熱一點就舌頭發紫。這不是老了，是因為牠每一口呼吸都要花掉比普通狗多出三倍的力氣。\n\n我常跟飼主解釋，這種慢性缺氧對心臟的負擔大得嚇人。因為血氧濃度低，心臟必須拼命跳動來代償，最後就演變成右心肥大。這是一個惡性循環。當你覺得牠睡覺打呼很療癒的時候，牠的身體其實正處於一種極度焦慮的戰鬥狀態。更慘的是，很多飼主會等狗狗真的在半夜暈倒、舌頭變紫才衝急診。這時候通常喉頭已經嚴重水腫，甚至需要氣切。那種時候在手術室裡看著飼主哭，我心裡其實都很想嘆氣：如果在一兩歲發現苗頭不對時就處理，真的不用走到這一步。\n\n現在很多飼主對「手術」兩個字有莫名的恐懼，寧願去買什麼空氣清淨機或是換高價飼料，就是不願意正視那個結構性的缺陷。我並不是說每一隻打呼的法鬥都要推入手術室，但你必須觀察一個關鍵指標：牠在清醒的時候，呼吸是不是也有明顯的雜音？如果牠只是坐著不動，喉嚨裡就有一種像是在煮開水的咕嚕聲，那絕對不是正常的。短吻犬阻塞性呼吸道症候群（BAOS）不是那種「觀察看看就會好」的小感冒，那是牠與生俱來的結構性崩壞。\n\n甚至有些飼主會說，可是我家的狗打呼聲很有節奏感呀，聽起來很安穩。這就是最危險的誤判。當打呼聲突然中斷，出現那種像是在憋氣、然後突然猛吸一口氣的動作時，那是睡眠呼吸中止。這在法鬥身上發生率極高。長期缺氧會損害大腦，也會讓牠們的脾氣變得古怪或神經質，因為牠根本沒辦法進入深度睡眠，大腦一直在警戒狀態。\n\n我遇過最誇張的案例，是一隻法鬥在美容院洗澡吹風時，因為太興奮加上環境熱，軟顎瞬間充血腫脹，最後直接在美容台上窒息。飼主到醫院時完全不能接受，覺得只是洗個澡怎麼就沒了？這就是我們專業上常說的，短吻犬的生命防線非常脆弱。牠們就像是帶著一個隨時會斷氣的定時炸彈在生活，而那個打呼聲就是倒數計時的滴答聲。\n\n基因這件事真的很殘酷。這群狗狗的骨骼結構已經定型了，鼻孔狹窄、軟顎過長、氣管發育不良，這三者往往是成套出現的。我每次看到路邊有人牽著法鬥，在正中午大太陽下散步，聽著那隻狗發出像是老舊引擎快要報廢的喘氣聲，我都覺得很心酸。人類為了「可愛」這個虛無縹緲的標準，創造出了一種連呼吸都要拼命的生物，然後我們還覺得牠們氣喘吁吁的樣子很逗趣。\n\n如果你家裡的法鬥現在正在沙發上大聲打呼，請你試著把手放在牠的胸口，感受一下牠呼吸時那種劇烈的起伏。那不是平穩的起伏，而是一種帶著掙扎感的震動。如果可以，請錄下這段聲音，下次去獸醫院時不要只是說「牠會打呼」，直接放給醫師聽。很多時候，我們在診間看到的狗狗因為緊張，呼吸會變得急促而掩蓋了原本的雜音，只有在牠放鬆時的那些聲音，才是最真實的求救訊號。\n\n這不是在危言聳聽，也不是要推銷手術。這是一個在急診室看過太多法鬥因為呼吸困難，最後只能插管插到滿嘴是血的醫師的真心話。我們不能改變牠們已經被選育出來的身體結構，但我們可以選擇不要在那種聲音中安穩入睡，以為一切都很好。如果你真的愛這種狗，請學會區分什麼是真正的睡眠，什麼是掙扎。不要等到哪天半夜，那個拖拉機的聲音突然停了，你才發現牠已經因為太累而徹底停止了呼吸。", "source_link": null, "source_title": null, "timestamp": "2026-06-14 05:09", "comments": [{"author": "週一症候群", "content": "真的 以前養的時候也覺得打呼可愛 沒想到牠睡覺都在缺氧 真的很心疼", "time": "10:30"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 189, "slug": "20260614-0510-b74150", "permalink": "/articles/20260614-0510-b74150/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "天竺鼠像被雷劈過一樣抓狂狂奔？這不是過動，是會讓牠痛到抽搐的疥癬蟲。", "content": "半夜看著天竺鼠像被雷劈到一樣在籠子裡瘋狂甩頭、彈跳、還發出尖叫，大部分飼主第一反應是覺得可愛，「牠在爆米花跳耶！」或是「牠今天體力真好」。但我上週才在診間接手一隻快被自己抓爛的長毛天竺鼠，主人帶進來時還在笑，說這小傢伙半夜瘋得跟鬼一樣。我把那隻天竺鼠放在診療台上，牠正好當著我的面來了一次「發作」，身體誇張地扭曲、四肢亂踢，最後倒在地上抽搐了兩秒。那不是快樂，那是痛，痛到神經斷線的那種痛。\n\n很多人不知道天竺鼠有一種寫在基因裡的防禦機制，叫做「隱藏痛苦」。在野外牠們是底層的食物鏈，表現出虛弱就等於邀請掠食者來吃午餐，所以當疥癬蟲在牠們皮下開隧道、產卵、排泄的時候，牠們會忍。忍到什麼程度？忍到那些蟲子的排泄物引發劇烈的過敏反應，讓牠們的皮膚像被火燒一樣，牠們才會因為受不了那種神經性的劇癢，產生類似癲癇的行為。這就是你們看到的「瘋狂狂奔」。\n\n這種病原叫做天竺鼠疥癬蟲（Trixacarus caviae），牠們非常自私，這輩子只打算待在天竺鼠身上。這跟貓狗的疥癬不一樣，天竺鼠的疥癬蟲是非常典型的「宿主特異性」。我常跟那些半夜嚇壞的飼主解釋，不要去怪家裡的貓或怪路邊的流浪狗，這蟲子通常是天竺鼠出生就自帶的「遺傳禮物」。這跟天竺鼠的生理結構有關，牠們的皮膚油脂分泌和免疫系統在壓力大、環境髒或是營養不均時，會突然壓不住這些長期潛伏的房客。\n\n最讓我受不了的是有些飼主會上網查完資料後，跑來問我：「醫師，牠是不是過動症？還是牠想出籠子玩？」我通常會直接翻開天竺鼠的背毛給他們看。如果你發現你家天竺鼠的背部、腋下或是屁股開始掉毛，皮膚上有像乾掉的碎屑，甚至有抓出來的血痕，那絕對不是牠想去公園散步。疥癬引起的搔癢感是持續性的，當牠們抓不到痛處時，大腦會強迫身體做出劇烈的動作來轉移注意力，這就是為什麼牠們會突然像裝了彈簧一樣亂噴亂撞。\n\n我遇過最慘的一個案例，是一位女大生養的泰迪天竺鼠。那種捲毛品種本來就難觀察皮膚狀況，等到她發現不對勁時，那隻天竺鼠已經因為劇痛引發的壓力性厭食，瘦到剩下骨頭。疥癬蟲最可怕的地方不是讓牠癢，是讓牠絕食。你想想，如果你的背上有一萬隻蟲在鑽，你還有心情吃草嗎？天竺鼠的腸胃只要二十四小時不運作，就會開始產生脹氣，接著就是器官衰竭。這是一條連鎖反應，起頭可能只是一隻你看不見的小蟲子。\n\n這時候最忌諱的就是飼主自己去藥局買人的止癢膏亂塗。我曾經看過有人給天竺鼠塗了含有類固醇的人用藥膏，結果天竺鼠舔掉後直接中毒。天竺鼠的代謝系統非常脆弱，牠們對很多抗生素和藥物都有極高的敏感性，這也是為什麼我一直強調，這病不能拖，更不能亂醫。臨床上我們用的藥劑量精確到微克，因為多噴一口藥水，對牠們來說可能就是致命的負荷。\n\n有些人會問，為什麼我家只有一隻天竺鼠，牠也會得病？這就是這物種最悲哀的地方。很多幼鼠在寵物店的時候，就已經從母體或同窩兄弟姊妹那裡感染了。這些蟲子可以潛伏好幾個月，甚至一年。直到某個深夜，氣溫突然掉了五度，或是你剛好換了一個牠不喜歡的草牌子，牠的免疫力一掉，地獄之門就打開了。這不是環境乾不乾淨的問題，這是牠們從出生就背負的宿命。\n\n如果你在凌晨三點看到你家天竺鼠在籠子裡「跳大神」，請先冷靜下來觀察牠的動作。正常的爆米花跳是輕快、短促、跳完會立刻去吃口草或喝口水。而疥癬蟲引發的狂奔是焦躁、漫無目的、動作僵硬且伴隨抓撓，甚至會伴隨倒地翻滾。這時候你不需要Google怎麼幫牠洗澡，因為洗澡只會讓牠更痛、更驚恐，甚至誘發更嚴重的抽搐。\n\n我有個習慣，看到這種症狀的個案，我會要求飼主把籠子裡的木屑全部換掉。雖然蟲死在動物身上，但環境裡的蟲卵是隱患。不過說實話，最核心的問題還是在於飼主的判斷力。很多人覺得天竺鼠是「入門級」寵物，便宜、好養、壞了再買一隻就好。這種觀念在我們這種看診看到半夜的人眼裡，真的很廉價。牠們的生命雖然只有短短幾年，但那種神經性的痛苦跟人類神經痛是一模一樣的層級。\n\n我上週看的那隻泰迪天竺鼠，在打完第一劑藥針後的三天，主人傳訊息說牠終於安靜下來吃草了。那種安靜不是因為牠學乖了，是因為牠終於不用再跟皮膚底下的千萬大軍搏鬥。看著一個小生命因為一點點神經毒素的介入就能恢復尊嚴，這是我當獸醫少數覺得欣慰的時刻。但如果你還在電腦前搜尋「天竺鼠一直跳是為什麼」，我建議你先把手伸進籠子裡摸摸牠的背。如果牠一被摸就劇烈顫抖或反過頭來想咬你，那就別查了，穿上外套出門找急診吧。這不是牠在跟你玩，這是牠在求救，只是牠發出的頻率，你一直以為是快樂的旋律。", "source_link": null, "source_title": null, "timestamp": "2026-06-14 05:10", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 190, "slug": "20260614-0511-fe5e56", "permalink": "/articles/20260614-0511-fe5e56/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "揭秘寵物網紅業配背後的利潤率：那罐宣稱「全肉」的保健品成本不到零售價的 15%", "content": "那些打著「全肉塊製作」旗號的貓狗保健品，說白了就是一場精心設計的數字遊戲。上週我跟那個在動物醫院當副院長的哥兒們喝酒，他剛處理完一個案例，是有個飼主為了幫家裡八歲的拉布拉多補關節，聽信網紅推薦買了一罐單價快兩千塊的鱉蛋粉加葡萄糖胺。那飼主拿著成分表問我朋友，為什麼吃掉三罐了狗還是走路卡卡的。我湊過去看那張原料清單，蛋白質含量寫得很漂亮，油脂比例也高，但仔細一算，裡面真正管用的有效成分，劑量低到讓你懷疑人生。\n\n你們有沒有想過，為什麼現在打開臉書或 IG，到處都是那種包裝得像精品、口號喊得比人吃的藥還大聲的寵物保健品？道理很簡單，因為毛利高到不合理。我以前在業內看過一份代工廠的報價單，某款宣稱添加了昂貴南極蝦油和高純度卵磷脂的保健粉，一罐出廠價不到八十塊台幣。等它穿上漂亮的霧面包裝、請幾位養著漂亮品種貓的網紅發幾張濾鏡拉滿的照片，最後在電商平台賣你五百九十塊甚至八百塊。這中間扣掉倉儲、運費跟給網紅的 30% 抽成，品牌方手上還剩下一半以上的純利潤。\n\n這不是我在瞎猜，我們用數據來拆解。一般市面上宣稱「全肉」或「高肉含量」的凍乾粉保健品，主打適口性好，讓挑食的貓狗也肯吃。但你們去查查大宗貿易的脫水肉粉或是人用食品級的鱉蛋粉原料價，一公斤頂多幾百塊錢。一罐 100 克的保健品，成本不到五十塊。至於那些被吹上天的「專利菌株」或「高效關節修復成分」，在成分表裡排在肉粉和糊精後面，實際添加量往往只有 5% 到 10%。算下來，你買的那罐東西，真正有醫療輔助效果的成分價值，可能連一個超商便當都買不起。\n\n我跟我朋友常在罵，現在的飼主都被那些「無添加」、「全天然」的行銷術語給洗腦了。我以前也當過這種韭菜，我家那隻剛領養回來的時候皮毛不好，我買了一堆號稱德國進口的護毛液，一小瓶五百多，結果一看成分，主體就是普通的魚油跟維生素 E。我後來乾脆去藥局買人用的深海魚油，算下來同樣濃度的 DHA 和 EPA，成本直接砍掉四分之三。寵物保健品市場最荒謬的地方就在於，因為它不屬於藥品管理，只要不宣稱療效，那些廠商想在裡面塞多少澱粉跟增稠劑都沒人管。\n\n這就像日本以前流行的那種「貓便當」，包裝精美到人類都想吃，但你去看營養數據，磷含量高得嚇人，根本不適合老貓長期吃。美國那幾家連鎖大超市的自有品牌也是，整面牆的保健軟錠，看起來像零食，標榜什麼都能醫。有個數據很驚人，北美寵物保健品市場的年成長率是 10% 以上，但這裡面有超過六成的消費者，根本不知道自己買的東西具體含量是多少。他們買的是一種「我對寵物很好」的心理安慰。\n\n說到這個，我最近看到一個更誇張的案例。我朋友老婆養了一隻法鬥，皮膚過敏到處看不好，後來她在一個群組裡被推銷一款「神級益生菌」，一盒要價三千塊。我拿過來一看，菌株編號模糊不清，標示的總菌數是一百億，聽起來很多對不對？但如果你去研究過微生物製劑就會知道，沒經過包埋技術處理的菌株，進到胃酸裡死掉的比例高達 90%。這三千塊裡，大概有兩千五百塊是付給那個在直播間喊得聲嘶力竭的團媽。\n\n我們這群飼主有時候真的很卑微，只要看到「對心臟好」、「對關節好」這幾個字，理智線就斷了。但你們有沒有想過，如果這些東西真的那麼神，獸醫為什麼還要開藥？我那獸醫朋友前天才在抱怨，現在診間一堆飼主，正餐飼料不肯買好一點的，蛋白質不到 28%、碳水化合物高達 40% 的廉價乾糧餵得理直氣壯，然後再花幾千塊去買各類保健品試圖「補回來」。這邏輯就像你每天吃泡麵配維他命，然後覺得自己身體會變強壯一樣，這不是本末倒置嗎？\n\n再說一個內幕，現在很多品牌根本沒有研發實驗室。他們直接找代工廠，從現成的幾套配方裡選一個，換個包裝設計就上市了。所謂的「獨家配方」，大多只是更換了香味劑或是調整了肉粉的種類。我算過一款熱銷的排毛粉，它的主要成分是洋車前子殼粉加上一點纖維素，這東西在化工行一公斤才多少錢？做成寵物用的小包裝後，單價翻了快二十倍。這種利潤率，連販毒的都要流眼淚。\n\n以前我也會為了讓家裡那隻吃得更好，鑽研各種北歐生食派的理論，覺得天然的最高。但後來我發現，越是宣稱天然、純粹、無加工的產品，溢價就越高。因為「天然」這兩個字不需要數據支撐，只需要感性訴求。當一個品牌告訴你它的肉源是「聽音樂長大的放山雞」，它就在為那 15% 的真實成本加上 85% 的行銷光環。\n\n這也是為什麼我現在看成分表，第一眼不是看它寫了什麼好東西，而是看它「沒寫什麼」。沒寫具體百分比的，一律當作含量極微；沒寫來源工廠的，一律當作貼牌貨。我們在這個版面上吵飼料營養、吵生食風險，說到底都是希望那幾張辛苦賺來的鈔票，能真的轉化成毛孩體內的營養，而不是變成品牌方換新車的基金。\n\n這幾年看下來，最可憐的還是那些一心想把寵物養好的新手。他們看著網紅家的貓毛髮發亮，以為是那一罐罐五顏六色的保健品的功勞，卻不知道人家背後可能有一整套專業的飲食管理跟優良的基因遺傳。那罐五百塊的進口粉末，原料表翻開來，跟一百塊那罐本土品牌的成分八成一樣，剩下的兩成是差在包裝盒的磅數。\n\n我那天問我朋友，如果真的要給家裡的狗補營養，最實在的是什麼？他喝了一口啤酒，指著市場裡最普通、沒有任何包裝的雞胸肉跟牛肉說，把買保健品的錢省下來，去買幾斤肉親自燙給牠吃。雖然這聽起來很不科學、一點都不「高端」，但至少我知道那裡面 100% 都是肉，沒有任何網紅抽成，也沒有任何糊精和防腐劑。\n\n我們這些人，在寵物產業眼裡就是一群肥美的韭菜。他們用各種焦慮感來餵養我們，讓我們覺得如果不買這罐、不補那個，我們就是不負責任的飼主。但數據是不會騙人的，當一項產品的行銷費用超過研發費用時，它就已經不是在做健康產業，而是在做精品業。只是這個精品的受眾，是一群不會說話、只能任由我們把各種不明粉末塞進牠們嘴裡的毛孩子。", "source_link": null, "source_title": null, "timestamp": "2026-06-14 05:11", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 191, "slug": "20260614-0511-f751fa", "permalink": "/articles/20260614-0511-f751fa/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "智商排名第一的邊境牧羊犬，每天需要消耗飼主至少 120 分鐘的高強度腦力遊戲，否則牠會開始拆掉你價值三萬塊的沙發。", "content": "這週末我去一個獸醫朋友家喝酒，他老婆正對著家裡那張剛買不到三個月、價值快四萬的義大利進口皮沙發發愁，扶手那塊皮已經被啃得跟狗牙啃過的一樣——喔不，是真的被狗啃了。他們家那隻邊境牧羊犬 Cooper，現在正一臉無辜地坐在旁邊，眼神清澈得像天山雪水，但熟悉這品種的人都知道，那眼神後面藏著一台每秒運算幾億次的超級電腦。我朋友嘆口氣說，那天他不過是為了趕一份醫療報告，少帶 Cooper 出去玩那組「藏食拼盤」加上「飛盤指令組合」，回家就看到沙發變成了大型手工藝現場。\n\n很多人買邊境牧羊犬是因為看了那個什麼世界犬隻智商排名，說邊牧第一名，好像買回家牠就會自己去開冰箱拿飲料、幫你收快遞。這種排名某種程度上是個災難，它只告訴你邊牧在「學習指令」上的速度很快，平均重複不到五次就能記住一個新動作，但它沒告訴你，這種高智商背後需要支付的代價是極其昂貴的時間成本。如果你每天沒辦法撥出至少 120 分鐘跟牠玩那種高強度的腦力博弈，牠多出來的處理器效能就會拿來研究怎麼拆掉你的生活。\n\n你想想看，邊牧的祖先在蘇格蘭高地是負責管幾百隻羊的。那種工作強度不只是體力消耗，牠們得不斷觀察羊群的動向，預判哪隻羊要脫隊，然後在零點幾秒內做出反應。現在你把這種「高階經理人」關在二十幾坪的電梯大樓裡，每天只給牠散步二十分鐘，剩下的時間叫牠在客廳發呆？這對牠們來說不是休息，是坐牢。當牠們的腦袋轉得比你的生活節奏快時，為了消解那種無聊引發的焦慮，牠們只能開發「副業」。拆沙發只是初階課程，我聽過最誇張的案例是，有個飼主回家發現邊牧把家裡的木地板撬開了兩塊，只因為牠覺得地板下面好像有聲音。\n\n我以前也迷信過智商排名，覺得養聰明的狗省心。後來我發現錯得離譜。養一隻智商排名七十幾名的阿富汗獵犬，牠可能叫半天都不理你，但牠也懶得跟你計較。養邊牧，你是在跟一個天才兒童鬥智。你今天把零食鎖在抽屜，明天牠可能就學會怎麼撥動那個卡榫；你以為帶牠去跑五公里就能讓牠斷電，結果牠回來喘兩口氣，眼神又亮了起來，彷彿在問你「下一關在哪？」。這種狗的體力槽是驚人的，但腦力槽更恐怖。如果不透過藏食玩具、氣味追蹤或是複雜的指令訓練去耗乾牠的電力，那三萬塊的沙發在牠眼裡就是一個巨大且充滿層次感的「可拆解益智玩具」。\n\n前幾天我在國外的論壇看到一個北歐的生食派玩家分享，他每天給邊牧餵食不是放在碗裡，而是凍在冰塊裡，再藏在院子的不同角落。他說如果不這樣做，他的狗會開始試圖「放牧」家裡的兩隻貓，搞得貓咪差點憂鬱症。這就是現實，邊牧的智商是一種本能的詛咒。牠們必須要有「任務」才能活得像隻正常的狗。如果你只是想找個伴陪你追劇、睡懶覺，那買邊牧簡直是給自己找麻煩。\n\n我算過一筆帳，一隻邊牧每天消耗你兩小時的高質量陪伴，如果你時薪五百塊，一年下來光是時間成本就快四十萬。這還不包含被牠拆掉的家具預算。很多飼主在挑選品種時，往往只看到那個「第一名」的光環，卻忽略了自己是不是具備駕馭這個第一名的環境。那些網路上表演接飛盤、認百種玩具名字的邊牧，背後都是飼主拿命在陪玩。我那個獸醫朋友現在每天下班第一件事，不是抱老婆，是先帶 Cooper 去草地玩三十分鐘的雙飛盤。他常說，這不是在遛狗，是在「維護系統穩定」。\n\n如果你自認是個朝九晚五、回家只想躺平的社畜，邊牧對你來說就是一個隨時會引爆的邏輯炸彈。牠們對環境的敏感度高到誇張，稍微一點規律的改變，牠們就能察覺並產生反應。這不是那種可以丟個骨頭叫牠去旁邊玩的狗，牠需要的是「工作感」。如果你沒辦法給牠工作，牠就會自己給自己創造工作——比如重新裝潢你的客廳。說實話，看著那張破爛的皮沙發，我覺得那不是狗的錯，是我們這些飼主太傲慢了，以為能用人類城市的單調邏輯，去規訓一個天生的荒野領袖。\n\n很多人問我，那到底什麼樣的人適合養邊牧？我通常會回答，除非你自己也是個過動兒，或者你每天能產出足夠多的智力難題讓牠解，否則你買回家的不是一隻狗，是一個二十四小時都在監視你漏洞的監察員。牠們會觀察你的作息，找出你什麼時候最容易妥協，然後用各種行為測試你的底線。智商第一名，換個角度看，其實是「破壞破壞力」跟「情緒勒索能力」的第一名。\n\n當你看到一隻邊牧乖乖趴在地上時，不要以為牠在睡覺，牠可能正在腦內建模，計算下次你開門的瞬間，牠要從哪個角度衝出去才能精準地攔截到那隻經過的野貓。這種狗需要的不是一個「主人」，而是一個「合夥人」。如果你只是想要一個可愛的毛茸茸配件，拜託，放過邊牧，也放過你那幾萬塊的沙發。去養個智商排名後段班、只要有飯吃就覺得世界和平的品種，對大家都好。畢竟，不是每個人都有體力跟心智，每天去面對一個智商 140 的瘋狂科學家。", "source_link": null, "source_title": null, "timestamp": "2026-06-14 05:11", "comments": [{"author": "咩噗小恐龍", "content": "真的是血淚談。我當初就是那個蠢到看排名去養邊牧的社畜, 結果回家發現牠不但拆了沙發, 還學會開瓦斯爐?! 這種狗根本不需要主人, 牠需要的是一份全職工作或是去管兩百隻羊。每天下班只想死在那, 還要被牠用那種充滿期待的眼神逼著去玩藏食遊戲, 沒玩夠牠就在你面前慢慢把壁紙撕下來……養邊牧真的要有被毀掉生活的覺悟。", "time": "14:48"}, {"author": "Aiden.W", "content": "literally 就跟我家那隻一樣，當初覺得 smart 很帥，結果現在每天回家都像開盲盒，超怕地板被撬開。cheers mate.", "time": "12:57"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 192, "slug": "20260614-0513-d5eab9", "permalink": "/articles/20260614-0513-d5eab9/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "代理商跟貴婦團聯手封殺美產罐頭的那場戲", "content": "我跟你講喔，這件事如果你當時不在那個「法式貴婦博美同好會」的群組裡，你真的沒辦法想像人類為了幾罐肉泥可以搞出多大的政治風暴。這不是什麼食安問題，這根本是宮廷劇，還是那種帶點黑色幽默的荒誕劇。\n\n事情是這樣的，那款美國產的罐頭，包裝老實說真的醜，就是那種很粗獷、印刷有點歪掉的鋁罐。但重點是它的成分太老實了，老實到讓那些在百貨公司專櫃賣一罐一百八十塊的進口代理商集體跳腳。假設真的有個「高級飼料保衛聯盟」這種地下組織，那天晚上他們的秘密會議大概都在討論怎麼讓這罐醜東西消失在台灣市場。我猜他們的會議記錄第一條就是：絕對不能讓這款罐頭出現在那群有錢太太的碗裡，因為那會讓她們發現以前買的「有機認證舒肥嫩雞」其實成本不到十塊錢。\n\n這時候，住在仁愛路、家裡養了三隻獲獎無數的博美的「陳姐」就登場了。陳姐在那個圈子裡基本上就是女皇，她家狗狗吃的東西必須是空運、包裝要像香水瓶、最好還有個什麼歐洲皇室御用的故事。原本陳姐也沒打算理這款美產罐頭，結果不知道是哪個沒長眼的代理商業務，在一次寵物展的 VIP 之夜，偷偷跟陳姐咬耳朵，說某個代理這款罐頭的年輕小夥子，曾在私人聚會上笑說陳姐家那些博美的毛質其實是靠修圖，不是靠那款天價卵磷脂。\n\n這你信不信？反正我是信了，這種圈子裡最不缺的就是這種「我聽說他聽說你說」的垃圾話。\n\n於是陳姐火了。她不是那種會去網路大吵大鬧的人，她是那種會在下午茶會上，漫不經心地跟其他名媛說：「哎呀，最近那個美產罐頭，我聽我那個在紐約開診所的醫生朋友說，他們工廠附近好像有重金屬污染耶，雖然沒驗出來，但總覺得毛小孩吃進去不太安心嘛。」\n\n這句話不得了，這就是政治動員的信號彈。不到一個禮拜，「污染說」在各大貴婦狗友群組炸開。那些原本還在觀望、覺得這款罐頭 CP 值不錯的飼主，被這股「關心寵物健康」的道德高地壓得喘不過氣。如果你還在餵這款罐頭，你就是不愛你的狗，你就是階級不夠、沒聽過內部消息的邊緣人。這種階級鄙視鏈一旦成形，殺傷力比任何政府公告都強。\n\n那個美產罐頭的代理商也是個憨厚人，他可能還在想說，我的檢驗報告明明全過，為什麼通路一個接一個退貨？他不知道的是，這場仗根本不是打在檢驗室，是打在那些有著水晶燈的客廳裡。那些代理商老狐狸跟貴婦團聯手的套路很深，他們甚至找了幾個所謂的「寵物營養師」——那些證照不知道從哪個野雞大學買來的專家——在直播裡半遮半掩地說：「有些美系品牌，蛋白含量高得不正常，長期吃對腎臟的負擔……你們懂的。」\n\n這就是我最喜歡看的部分，那種一本正經地瞎編。明明是為了保護自己的利潤，卻要披上一層「為你好」的皮。那陣子如果你走進某些貴婦常去的寵物美容院，你只要一提那款罐頭，老闆娘會用一種看異類的眼神看著你，彷彿你剛剛承認你給狗吃路邊的剩菜。\n\n我那時候看著這一切，心裡就在想，假設真的有一個「罐頭真相調查委員會」，他們查出來的結果大概會很精彩。可能發現某個進口商為了這次封殺行動，私下贊助了陳姐家博美的年度選美巡迴費；或者是某個連鎖通路的老闆，剛好跟那家貴婦團的領頭羊是打高爾夫球的球友。這些私底下的勾結，比罐頭裡的成分表複雜多了。\n\n其實這種事在我們這圈子見怪不怪了。你以為你選的是營養，其實你選的是立場。那些貴婦們真的在意重金屬嗎？才怪。她們在意的是，如果在聚會上大家都拿出一款金燦燦的歐洲罐頭，只有妳拿出一款包裝像汽油桶的美國貨，那妳就輸了。妳的狗在草地上跑得再健康，妳在心理地位上也已經被降級成「不懂生活品質的粗人」。\n\n最荒謬的是，那款被封殺的罐頭，後來在一些米克斯社團裡反而成了神物。這就是寵物政治的另一個層面：階級對抗。貴婦不吃的，我們米克斯爸媽反而覺得那是真材實料。我認識一個養了五隻米克斯的大叔，他每次看到那些關於美產罐頭的負面流言，都會冷笑說：「那些人懂個屁，他們家那種修毛修到像棉花糖的狗，腸胃弱得跟紙一樣，我們家的狗吃了這款罐頭，排便漂亮得像藝術品好嗎？」\n\n你看，連排便都能拿來當成階級鬥爭的籌碼，這難道不有趣嗎？\n\n這場奪權大戲最後怎麼收尾的？其實也沒什麼戲劇性的轉折。那個美產罐頭的代理商最後燒光了錢，黯然收場。取而代之的，是一款換了漂亮包裝、據說「專為亞洲小型犬設計」的新品牌，包裝精美得像珠寶盒，一罐價格直接翻了三倍。大家猜猜看這款新品牌的代理商是誰？沒錯，就是當初跟陳姐咬耳朵的那位業務。\n\n這就是人類。我們自以為在幫毛小孩爭取最好的生活，其實我們只是在玩一場名為「誰更有面子」的權力遊戲。在那些充滿香氛和乾淨毛巾的美容室裡，每一場關於「哪種飼料比較好」的討論，背後都藏著幾個代理商的年度預算，還有幾位大姐對社交圈主導權的野心。\n\n你信不信？反正這事發生在那年寵物展之後，我親眼看到那位業務開著新買的保時捷，後座載著的正是一箱箱包裝精美的新品牌。至於當初那款被說有重金屬的罐頭，現在偶爾還能在一些冷門的五金行角落看到，默默地躺在那裡，印刷依然是歪的，成分依然老實得讓人生氣。這就是我最愛看的樂子，人類的虛榮心永遠比寵物的健康更能決定市場長什麼樣子。下次你在狗公園聽到有人在吹捧什麼「皇室配方」時，記得多留個心眼，說不定你正在參與一場價值幾百萬的政變呢。", "source_link": null, "source_title": null, "timestamp": "2026-06-14 05:13", "comments": [{"author": "salt", "content": "成分太好反而會得罪人,這圈子本來就是看誰比較會說故事,那種包裝漂亮的垃圾我也買過不少……", "time": "13:10"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 193, "slug": "20260614-0514-de447a", "permalink": "/articles/20260614-0514-de447a/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "我跟你講喔，要是狗公園出現「舔毛焦慮互助會」的鄙視鏈，一定是那種舔出愛心形狀的看不起舔成不規則形狀的。", "content": "那個下午我坐在大佳河濱公園的長椅上，看著一群柴犬在那邊互相瞪視，我突然覺得這根本不是什麼和諧的遛狗聚餐，這根本是大型宗教審判現場。我旁邊坐了一個大姐，手裡牽著一隻腳踝處被舔到有點發紅、毛色稀疏的貴賓，她眼神那個犀利啊，一直盯著對面那個帶著邊境牧羊犬的男人。那位邊境的主人更妙了，他一臉驕傲地跟旁邊的人展示他家狗腿上那塊圓潤、對稱、簡直像用圓規畫出來的無毛區。我跟你講喔，這就是我最近觀察到的新玩意兒，我把它稱之為「舔毛焦慮互助會的隱形階級」，這玩意兒比誰家的狗會握手還要殘酷。\n\n大家都在講貓會壓力大到舔毛，其實狗瘋起來也是沒在客氣的。但人類最荒謬的地方就在這裡，我們不只會焦慮，我們還會把焦慮搞成一種「審美競賽」。假設今天真的有個什麼「舔毛互助會」的地下分部，我敢打賭，裡面絕對會形成一套嚴密的鄙視鏈。那種能把後腿內側舔出一個完美愛心形狀的飼主，一定會站在金字塔頂端，斜眼看著那些把腳趾縫舔得像爛泥、形狀還不規則的米克斯爸媽。這聽起來很瞎對吧？但我跟你講，這在寵物政治學裡太合理了。\n\n那些能把狗舔毛的形狀「控制」得很有美感的飼主，內心深處其實有一種變態的優越感。他們會覺得，雖然我家狗焦慮，但我家狗焦慮得很精緻。你會聽到他們在公園裡用一種聽起來很同情、實際上在插刀的語氣說：「哎呀，你家小黑這塊傷口怎麼舔得這麼散亂啊？是不是你最近沒給牠規律的作息？你看我家這隻，雖然也愛舔，但牠只固定舔這一個點，邊緣很整齊喔，獸醫都說這是高品質的刻板行為。」你看看，這種話聽了是不是很想把手裡的牽繩甩到他臉上？\n\n我以前養過一隻老狗，牠晚年壓力大的時候也愛舔腳，我就親身體會過那種被鄙視的感覺。有一次在獸醫候診室，我對面坐了一個穿著全身專業登山裝備的男人，他帶著一隻看起來就很過動的傑克羅素。他看了一眼我狗腿上那塊參差不齊、像被狗啃過（雖然真的是被狗啃的）的脫毛區，然後默默地把自己的狗往旁邊拉了一點，那眼神就像是在看一個放任小孩在餐廳尖叫的失職家長。他那種眼神我解讀出來的意思就是：「看這形狀，這主人的生活節奏一定一團亂，連狗焦慮起來都這麼沒章法。」\n\n真的假的我不知道，但我聽說有些極端的飼主，甚至會私底下暗自較勁誰家的狗「舔得更深情」。如果你的狗只是隨便舔舔表皮，那代表你們的連結不夠深；如果能舔到紅腫發亮，甚至出現一種像是肉墊質感的厚繭，那簡直就是勳章。這就像是某些家長在比誰的孩子補習補得更晚一樣，是一種建立在受苦之上的扭曲榮耀。我有個朋友，他家法鬥把前腳舔出了一個神似台灣地圖的形狀，他居然還拍照發朋友圈，下面一堆人留言說「這形狀也太神了」、「感覺很有靈性」。我心裡想說，這狗是焦慮到想離家出走環島了好嗎？你們這群人在誇獎什麼啦？\n\n這就是最讓我樂不可支的地方。人類真的很愛在苦難裡找樂子，或者說，人類很愛在任何事情上找尋「我比你強」的證據。即使是狗的心理疾病，我們也能把它包裝成一種品味。你看那些養純種犬的，特別是那種皮膚容易過敏的品種，他們在討論舔毛問題時，那口氣就像是在討論某種高端的酒莊產地。「喔，我們這家的皮膚問題是家族遺傳的貴族病，舔出來的形狀通常比較集中。」這種話聽在我耳裡，就像是在聽有人說他家的馬桶是用純金打造的一樣荒謬。\n\n我甚至可以想像，如果這群互助會的人要選舉會長，標準絕對不是誰的狗治好了，而是誰的狗舔出的圖案最具有藝術感。假設真的有一個協會，投票那天大家一定會蹲在地上檢查別人的狗腿。如果有人作弊，拿剪刀幫狗修剪脫毛區的邊緣，好讓那個形狀看起來更像一顆愛心，一旦被發現，大概會被永久驅逐出狗公園，並在網路上被肉搜到這輩子不能再養寵物。為什麼？因為你破壞了「焦慮的純粹性」啊！\n\n這種階級鄙視鏈不只存在於形狀，還存在於處理方式。買最貴的抗焦慮噴霧、用最有設計感的防舔圈（最好是那種長得像吐司麵包或向日葵的），這又是另一個戰場。你帶個塑膠材質、像個大漏斗一樣的傳統維多利亞圈去公園，那些讓狗戴著手工編織防舔頸圈的貴婦，看你的眼神就像在看一個活在中古世紀的野蠻人。她們會用那種飄飄然的語氣說：「那種塑膠的會弄傷牠的自尊心喔，我們這款是純棉透氣的，雖然貴了一點，但對牠的心理重建比較好。」\n\n我跟你講，這些人嘴上說的是心理重建，心裡想的都是社交地位。那隻狗到底憂不憂鬱、腳癢不癢，其實已經不是重點了，重點是牠表現出來的樣子能不能撐起主人的面子。這就像寵物展那些賣奇葩藥膏的攤位，我常看到有人在那邊煞有其事地研究哪種藥膏擦了之後，長出來的毛色會更均勻，這樣下次舔掉的時候，色差才不會太難看。這邏輯繞得比我阿嬤的毛線球還亂，但我看那些人掏錢的速度，簡直像是在買長生不老藥。\n\n有時候我會想，如果這些狗真的能聽懂我們在吵什麼，牠們大概會覺得人類才是最需要互助會的物種。牠們只是單純覺得腳很癢、心裡有點慌，結果一抬頭發現主人正在跟鄰居比誰的狗舔出來的圓圈比較圓。我上次看到一個大叔，他的拉不拉多把兩隻前腳都舔禿了，他竟然跟旁邊的人說：「這叫左右對稱，代表牠的左右腦開發很平衡。」我差點沒把嘴裡的拿鐵噴出來，這扯淡的能力真的值得頒給他一個諾貝爾和平獎，至少他在那一刻，用這種瞎編的優越感化解了所有人的尷尬。\n\n這個世界就是這樣，只要有兩個人以上在養寵物，政治就出現了；只要有兩隻狗在舔毛，鄙視鏈就成形了。我們看著這些荒唐的互動，真的會覺得寵物政治觀察是這世界上最好玩的業餘愛好。不管是愛心形狀、台灣地圖，還是隨機分布的不規則斑塊，在那群飼主的眼裡，那都是他們在社群軟體上廝殺的兵器。你問我這有沒有救？我跟你講喔，只要人類還有一顆愛面子的心，狗公園裡的形狀戰爭就永遠不會停。下次你去公園，別光顧著看狗可愛，低頭看看牠們腿上的那些圖案，再看看主人的眼神，你就會發現一個比八點檔還精彩的微型社會。至於那些舔不出來形狀的狗？喔，牠們在那個互助會裡，大概連投票權都沒有吧。", "source_link": null, "source_title": null, "timestamp": "2026-06-14 05:14", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 194, "slug": "20260614-0515-88d5cc", "permalink": "/articles/20260614-0515-88d5cc/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "路易十四這輩子最驕傲的可能不是凡爾賽宮，而是他那群隨時準備拆掉凡爾賽宮的獵犬。", "content": "你知道嗎？這位號稱「太陽王」的猛男，每天早上起床的第一件事不是接見大臣，也不是研究怎麼跟隔壁鄰居打仗，而是先餵狗。他專門請了法國最頂尖的木匠，用那種鑲金邊、貼絲絨、甚至帶有精緻雕花的木頭，給他的寶貝獵犬們訂製了一整排豪華床位。結果呢？這群狗根本不領情，牠們覺得那種絲絨墊子哪有國王的絲綢被窩舒服？於是每天晚上，這群獵犬就這麼大搖大擺地擠上路易十四的床，在那堆昂貴的織品上翻滾，甚至興致來了就直接在國王腳邊排便。更絕的是，路易十四完全不生氣，他甚至覺得這是寵物對他的一種信任。\n\n講到這個，我就想到以前讀過的一段紀錄，當時凡爾賽宮的走廊其實味道非常感人。想像一下，一個統治歐洲最強大國家的君主，身上可能噴著最名貴的香水，但腳邊跟著一群剛在噴泉裡洗完澡、還帶著泥巴水的獵犬，這種畫面多衝突啊！但路易十四就是喜歡。他對狗的痴迷已經到了一種「只要是我的狗，做什麼都對」的境界。這讓我想起，我們現在很多人嘴上說要把貓貓狗狗當成家人，還要買幾萬塊的自動餵食機、智能冷暖床墊，結果呢？你家主子最後還是選擇睡在你那個破舊的紙箱上，或者直接癱在你剛買的筆電鍵盤上。人類花了五千年試圖「馴化」動物，結果到頭來，到底是誰被誰馴化了，還真的不好說。\n\n對了你知道嗎，路易十四這種寵狗行為其實在當時的歐洲貴族圈是個標竿。那時候養狗不是為了看門，也不是為了好玩，而是一種身分地位的炫耀。你的狗睡得比一般老百姓還好，吃的是廚房專門烤的肉塊，這才叫氣派。不過這也衍生出一個很怪的現象，就是這些狗在宮廷裡的地位，有時候比那些等著晉見的低階貴族還要高。如果你在凡爾賽宮不小心踢到一隻國王的愛犬，你可能隔天就得打包回老家種田了。這跟古羅馬人養寵物蛇的邏輯有點像，那時候羅馬貴族流行在袍子裡藏一條小蛇，大家聚會的時候，蛇就這樣滑出來打招呼，大家還得稱讚這蛇長得真是有靈性，其實心裡可能都在發抖。\n\n不過，這種「寵溺到沒天理」的歷史其實一直都在循環。講到這個我想起來，維多利亞女王也是個瘋狂的寵物控，她甚至為了她的獵犬寫過非常詳盡的觀察日記。但路易十四更誇張一點，他給他的狗起名字都很有創意，什麼「寶貝」、「美人」、「邱比特」，聽起來就像是他在點名後宮嬪妃一樣。我以前看過一份清單，路易十四身邊最得寵的幾隻獵犬，牠們的「生活津貼」比當時法國一般士兵的薪水還要高。你想想看，你在前線打仗流血，結果國王的狗在凡爾賽宮吃著專屬廚師煮的野味，還在國王的被子裡排便，這心裡陰影面積得有多大？\n\n但這就是人類跟寵物合作這幾千年來的奇怪邏輯。我們一方面覺得自己是萬物之靈，可以主宰這些毛茸茸的小東西，但另一方面，只要牠們對我們露出一點點「我需要你」的眼神，或者是乾脆像路易十四的狗那樣橫行霸道，我們就徹底投降了。這種情感投射有時候真的很不科學，你說貓鬚的功能在歷史上是怎麼被發現的？其實就是一群閒著沒事的古代宅男觀察出來的。同樣的道理，路易十四這麼聰明的人，難道不知道狗在床上排便很髒嗎？他當然知道，但他享受那種被依賴的感覺，甚至是一種超越權力關係的純粹聯繫。在那個所有人都對他唯唯諾諾、充滿政治算計的宮廷裡，大概只有這群敢在他床上排便的狗，才是真心對他的。\n\n不過這個有點離題，但其實也沒那麼離題。你看，從古埃及人神化貓，把貓當成神靈的化身，到中世紀歐洲人莫名其妙覺得貓是魔鬼的僕人，大規模處置牠們，導致後來黑死病爆發（因為老鼠沒天敵了），人類對寵物的態度一直都在極端之間擺盪。路易十四算是處於一個比較「人性化」的極端，他開啟了一種「寵物即家人」的先河，雖然這種家人可能會毀掉他的床單。\n\n我認識一個朋友，他為了給家裡的柴犬慶生，包了一間寵物友善餐廳，請了一堆狗朋友來，還要準備手工肉蛋糕。這場景跟路易十四當年在凡爾賽宮給狗訂製絲絨床位，本質上其實沒什麼兩樣。我們總覺得自己進化了，科技進步了，但對待寵物的那種憨直勁，其實五千年來一點都沒變。狗到底是怎麼從狼變成邊境牧羊犬的？其實就是一代又一代像路易十四這樣的人，不斷地篩選出那些「長得最順眼」、「最會撒嬌」、或是「最敢在國王被窩裡排便」的個體。\n\n說真的，我每次看到那些昂貴的寵物家具廣告，心裡都在冷笑。那些設計師肯定沒讀過這段歷史。他們以為只要設計出符合人體工學、美學的貓窩犬床，寵物就會乖乖待在裡面。錯了，大錯特錯。寵物真正要的永遠是你的枕頭、你的筆電、或是你最心疼的那件昂貴外套。牠們在用這種方式告訴你：這地盤是我的，你也是我的。路易十四的木匠肯定很挫折，他辛苦雕琢的藝術品，最後變成了宮廷裡的昂貴擺飾，而那些獵犬則在國王的絲綢被裡睡得正香。\n\n這種歷史有趣的地方就在於，它揭露了人類內心最柔軟也最荒謬的一面。我們建立制度、發明法律、建造華麗的宮殿，結果最後被一隻連自己名字都不一定聽得懂的狗搞得束手無策。如果你現在正看著你家那隻把沙發抓得稀爛，或者剛在你地毯上吐了一地的寵物，別太難過。你要想，你現在體驗的可是當年歐洲最強大君主的同款生活品質。這種跨越時空的共感，大概就是我們這群寵物愛好者最無可救藥的浪漫了。\n\n所以說，到底為什麼鸚鵡能活七十年但倉鼠只能活兩年呢？這大概是上帝給人類的一種心理建設吧。路易十四如果知道他的獵犬只能陪他十幾年，他可能會給牠們蓋一座更誇張的宮殿。人類這種生物，一旦愛上某個長毛的靈魂，真的是什麼瘋狂的事都做得出來。不管是五千年前在尼羅河邊幫貓做木乃伊的埃及農民，還是現在凌晨四點起來幫貓鏟排泄物的你，我們其實都是同一類人，都被這群小東西徹底征服了。那些絲絨墊子不重要，重要的是，當你掀開被子的時候，那股混合著溫暖犬氣和一點點尿味的味道，那才是真實的生活，也是路易十四最珍惜的瞬間。", "source_link": null, "source_title": null, "timestamp": "2026-06-14 05:15", "comments": [{"author": "boba", "content": "誰被誰馴化真的難說…… 我家那隻15歲的米克斯也一樣, 買了三千塊的羊毛窩他不睡, 偏要擠在我那個裝過泡麵的髒紙箱裡, 搞得我客廳像資源回收場, 看了超廢到笑! 路易十四如果在現代, 肯定也是那種會一邊洗床單一邊對著狗錄影發限動的笨主人啦。", "time": "13:34"}, {"author": "boba_addict_99", "content": "honestly 很好奇這群獵犬如果是 modern day 的法鬥或邊牧,路易十四還會這麼 chill 嗎?有沒有人算過現在養一隻大狗基本款每個月到底要噴多少錢啊?☕️", "time": "11:05"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 195, "slug": "20260614-0516-546f75", "permalink": "/articles/20260614-0516-546f75/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "古代人真的沒你想得那麼閒，天天在那邊盤算怎麼把狼養大變成獵犬。", "content": "你想像中的畫面可能是某個充滿英雄氣息的遠古獵人，在森林裡撿到一窩小狼，然後語重心長地說「從今以後我們就是戰友了」。這畫面太好萊塢了，實際情況可能更像你凌晨三點在巷口看到流浪狗翻垃圾桶。說真的，最早的狗根本不是被我們「選中」的，是牠們自己決定要在我們家門口「賴著不走」。\n\n對了你知道嗎，大概在一萬五千年前吧，甚至更早，那些狼族裡的「邊緣狼」發現了一個驚人的財富密碼。當時的人類開始聚集成部落，生活習慣變得很固定，重點是，人類非常會製造垃圾。那些骨頭殘渣、腐掉的獸肉，對那群體型較小、鬥不過狼王、在野外快餓死的狼來說，簡直是米其林三星自助餐。這群傢伙就每天窩在部落外圍等開飯，臉皮厚到一種境界。講到這個我就想起來，這跟現在那些在便利商店門口等路人餵罐頭的浪浪有什麼兩樣？歷史就是一直在重演。\n\n不過這個有點離題，重點是，這些「專業蹭飯員」其實在玩一場生存遊戲。當時的狼如果是那種兇巴巴、看到人就想咬的，肯定被遠古人類一矛捅死。只有那些天生膽子大、脾氣好，甚至會對著人類歪頭裝無辜的狼，才能成功在垃圾堆旁邊活下來。這在生物學上很有趣，我們這群自以為是的主人，其實是被這群蹭飯的傢伙「反向篩選」了。我們留下了性格最溫順的那批，剩下的就成了我們現在看到的哈士奇或拉布拉多的祖先。\n\n我有個朋友總覺得他家那隻邊境牧羊犬是為了守護家園才存在的，但我看著那隻狗為了討一塊零食在那邊瘋狂轉圈，我就覺得牠體內的「蹭飯基因」根本沒變過。你看那些古埃及的壁畫，或是古羅馬的馬賽克地圖，裡面常出現那種細長腿的狗。雖然大家常說那是用來打獵的，但你要知道，養一隻獵犬的成本很高耶！古羅馬有些貴婦甚至會養那種除了撒嬌什麼都不會的「袖珍犬」，純粹是為了暖手或當活動首飾。這種關係打從一開始就不是什麼「契約」，而是一種很微妙的寄生與共生。\n\n你以為只有貓會耍心機嗎？狗才是真正的戰略大師。你知道嗎，有研究發現狗的眼部肌肉演化出了一種狼沒有的功能，就是那種能讓眉毛揚起、露出大面積眼白、看起來超級無助的「狗狗眼」。這絕對不是為了狩獵演化出來的，難道狼要去對著鹿露出一副「拜託你讓我咬一口」的表情嗎？那根本是為了對付人類的同情心。這跟五千年前牠們在垃圾堆旁邊等著人類扔骨頭時的表情，我打賭絕對一模一樣。\n\n我有時候在想，人類發展農業、建立文明，搞不好有一半的動力是為了養活這群跟屁蟲。你看清朝皇帝養的那些狻猊犬，每天吃得比御膳房的學徒還好，還要專人幫牠們梳毛，這哪裡是人類馴化了動物？這根本是動物透過垃圾堆戰術，成功入侵了人類的高層社交圈。\n\n甚至到了維多利亞時代，那些有錢人開始給狗辦葬禮，建專門的寵物墓園，連墓碑都要刻上「最忠誠的朋友」。這其實挺荒謬的，我們把這群當初來蹭飯的食客，硬生生供奉成了家人的地位。這過程中有什麼邏輯嗎？完全沒有。就是因為我們太寂寞了，而這群蹭飯員剛好很擅長提供那種「不管你多窩囊，我都會搖尾巴」的虛假成就感。\n\n說到這個，我想起最近看到一個很有意思的說法。有人說狗其實是人類文明的「副作用」。如果我們當初沒那麼愛亂丟垃圾，現在可能根本沒有狗這種生物，森林裡全是冷酷無情的狼。結果因為我們衛生習慣不好，反而創造出了一個能跟我們溝通、甚至能讀懂我們情緒的全新物種。這交易其實划算得不得了。\n\n你看看現在那些高檔寵物店裡的鮮食餐盒，裡面有牛肉、糙米、綠花椰菜，包裝精美到我都想吃一口。這其實就是當年垃圾堆剩飯的頂級進化版。那群狼的祖先要是看到現在的法鬥穿著羽絨衣坐在嬰兒車裡巡視百貨公司，估計會覺得自己當初在部落門口賴著不走的決定簡直是族群歷史上最英明的投資。\n\n人類一直有一種傲慢，覺得我們掌控了自然，覺得我們是為了某種「高級目標」才把野獸帶進家門。但真相往往很土炮，也很生活化。我們跟狗的五千年情緣，起點不是什麼英勇的狩獵季，而是某個遠古的下雨天，一隻餓得前胸貼後背的狼，小心翼翼地靠近了人類的營火，發現這裡不但溫暖，還有啃剩的骨頭，於是牠決定這輩子就不走了。\n\n這種「不走了」的耍賴精神，才是狗這種生物最核心的靈魂。什麼守衛、搜救、導盲，那都是後來我們為了讓牠們的存在看起來更有正當性，才強加在牠們身上的職責。本質上，牠們就是一群成功的社會入侵者。\n\n所以下次你看到你家狗在桌子底下用那種「我快餓死了」的眼神盯著你碗裡的排骨時，別覺得牠在裝可憐。牠只是在展現牠們家族傳承了幾萬年的核心競爭力。那種眼神是經過幾千代演化精煉出來的生財工具，比任何獵捕技巧都要精準、有效。我們人類從來沒有真正「馴化」過狗，我們只是給了這群聰明的蹭飯員一張長期飯票，還自以為是牠們的主人。你不覺得這種雙贏的誤會，其實才是歷史上最幽默的一幕嗎？", "source_link": null, "source_title": null, "timestamp": "2026-06-14 05:16", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 196, "slug": "20260613-0944-dae1f7", "permalink": "/articles/20260613-0944-dae1f7/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "你家天竺鼠半夜突然抽搐橫衝直撞？先別急著找急診，那是骨骼發育帶來的「爆米花跳」。", "content": "天竺鼠半夜突然在籠子裡像被電到一樣瘋狂彈跳，甚至一頭撞上飼料盆，這種畫面我一週大概會在診間解釋三次。昨天凌晨三點，就有位剛養天竺鼠不到一個月的學生，抱著外出籠衝進診所，眼眶通紅地跟我說他的「奶茶」中風了，或是得了癲癇，因為牠剛才突然全身抽搐、四肢亂踢，還在木屑堆裡橫衝直撞。我打開籠子一看，那隻小傢伙正若無其事地在啃提摩西草，眼神亮晶晶的，根本不像有病。這種讓新手飼主嚇到心臟快停掉的動作，我們通常叫它「爆米花跳」（Popcorning），它真的不是神經系統出問題，而是這類嚙齒類動物特有的情緒宣洩方式。\n\n你要是仔細觀察過天竺鼠的骨骼結構，就會發現牠們的演化過程非常有趣。天竺鼠的脊椎其實相對僵硬，不像貓那樣可以隨意扭轉，但牠們的後肢肌肉非常發達，這跟牠們在野外作為被捕食者的身份有關。當牠們感到極度興奮、開心，或者是幼年期精力過剩時，大腦發出的神經衝動會讓肌肉瞬間緊縮，導致牠們像爆米花一樣原地彈起，有時候還會伴隨半空中扭動身體。這種動作在生物行為學上被視為一種「玩耍行為」，通常只發生在感覺環境極度安全、心情放鬆的時刻。如果牠真的癲癇發作，你會看到牠側躺在地、四肢僵硬抽動、口吐白沫，甚至意識喪失，而不是跳完之後還能馬上跑去喝水。\n\n很多人會問，為什麼偏偏是半夜？這就牽扯到天竺鼠的生理時鐘。牠們不像人類有長達八小時的深度睡眠，牠們是「多相睡眠」動物，一天之內會分成幾十次小睡，每次可能只有幾分鐘。半夜兩三點，剛好是客廳燈關了、雜音沒了，對牠們來說是最安靜、最能放鬆自我的黃金時段。當你窩在被子裡睡得正香，牠可能剛睡飽一覺起來，覺得腳底發癢，突然想來個花式轉身，於是你就聽到了籠子被撞得哐啷響的聲音。\n\n說到品種差異，我帶過的實習醫生常問我，為什麼長毛種的逆毛天竺鼠好像跳得特別瘋？這不完全是心理作用。從遺傳學角度來看，逆毛天竺鼠的毛流方向是由特定基因座（Locus）決定的，這類品種在人工培育過程中，除了外觀，某些神經反應確實比短毛的英國種更為敏感。牠們對環境壓力的排解方式往往也更激烈一些。上個月我才看過一隻三個月大的阿比西尼亞天竺鼠，主人說牠每天晚上都像在演特技，其實那就是牠在發育期，骨骼與肌肉生長速度極快，必須透過這種爆發性的動作來鍛鍊肌肉張力。\n\n我常跟診間那些焦慮的飼主說，你與其擔心牠抽搐，不如擔心牠有沒有在吃飯。天竺鼠是一種把「生病」隱藏得極好的動物，這是演化教給牠們的生存之道。在自然界，表現出虛弱就代表死亡，所以當一隻天竺鼠真的病到會抽動時，牠通常已經好幾天不吃不喝、毛髮凌亂、眼神凹陷了。如果牠跳完之後還能對著你手上的小黃瓜發出「咕伊、咕伊」的討食聲，那牠真的健康得不得了。我們這些當醫生的，最怕的不是半夜衝進來虛驚一場的飼主，而是那種明明寵物已經三天沒排便、沒精神，卻還在網路上發問說「這是不是在撒嬌」的人。\n\n如果你家那隻小煤球半夜在籠子裡彈射，你可以試著把手伸過去，看牠會不會主動湊過來聞。如果牠一邊跳一邊還帶著輕快的碎步，甚至發出像燒開水一樣的連續短促音，那其實是牠在對你示好。這類動物的感情表達很直接，但也因為這種直接，常讓用人類邏輯思考的我們產生誤判。我們習慣把「劇烈動作」跟「痛苦」掛鉤，卻忘了對某些物種來說，劇烈動作才是生命力最旺盛的證明。\n\n我看過太多飼主在診間崩潰，覺得自己沒照顧好才讓寵物「發作」，其實絕大多數時候，我們只是不了解牠們的語言。就像你第一次看到貓咪吐毛球，或是第一次看到狗在草地上瘋狂打滾一樣，那都是牠們在處理生理或心理需求的正常程序。天竺鼠的爆米花跳，本質上就是一種「溢出的快樂」。牠的身體裝不下那麼多愉悅感，只好透過骨骼與肌肉的瞬間爆發來釋放。所以，下次半夜聽到撞籠聲，不用急著掏手機查急診醫院電話，你可以翻個身繼續睡，或者在那團小東西跳累停下來時，隔著籠子給牠一小塊新鮮的萵苣。在那種時刻，牠需要的不是醫師的聽診器，而是跟你分享那份沒來由的興奮勁兒。\n\n這並不是說我們應該掉以輕心。如果那種彈跳伴隨著明顯的慘叫，或者跳完後出現拖行後半身、無法站穩的情況，那才真的是骨骼受傷或缺乏維生素C導致的壞血病症狀。但如果你看到的只是一團毛球在原地旋轉跳躍，且事後精神百倍，那就請放過你自己，也放過半夜值班的獸醫。這些小生命有牠們自己的節奏，而學習分辨「快樂的瘋狂」與「痛苦的掙扎」，是每個飼主在深夜搜尋症狀時，最該修完的一門課。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 09:44", "comments": [{"author": "肝指數比台積電高", "content": "養了兩年才知道那不是發瘋。每次半夜聽牠撞籠子都覺得心臟快停了,還以為是什麼神經病變……結果只是太嗨。我們這種新手真的超容易被牠們演化出來的快樂嚇死。", "time": "18:50"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 197, "slug": "20260613-0944-818afd", "permalink": "/articles/20260613-0944-818afd/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "醫生又不是通靈，你家毛孩半夜吐那幾口到底是「草」還是「毒」，全看你手機裡那張照片拍得清不清楚。", "content": "半夜三點手機響起來，螢幕上顯示的是診所急診轉接的號碼，我通常會先深吸一口氣。接起來後，對方的聲音聽起來像是在馬拉松衝刺後的喘息，內容大概率是：「醫生，我家貓剛剛吐了，吐出了一團黃黃綠綠的東西，還有一點白沫，這是不是中毒？我現在要衝過去嗎？」我上週才剛處理過一隻六歲的英短，主人半夜尖叫著衝進診所，手裡提著貓籠，但他忘了帶最關鍵的東西——那團被他隨手沖掉的嘔吐物。\n\n我常跟診間的實習生說，獸醫在急診室裡不是在當醫師，我們是在當偵探。當你家毛孩半夜吐了，你的恐慌我可以理解，但你的手機不應該是用來撥電話給我，而是應該先對著地上那團東西拍一張照片。很多飼主會覺得那是穢物，清理都來不及了，怎麼可能拍照？但說真的，你描述的「黃黃綠綠」在我的大腦裡有五十種對應的疾病，從簡單的空腹太久膽汁逆流，到足以致命的腸阻塞或急性肝衰竭。如果你能給我一張對焦清晰的照片，我甚至能從殘留的纖維長度判斷，那是牠今天下午偷偷啃掉的黃金葛葉子，還是你買回來那支沒洗乾淨的貓草。\n\n在急診室最怕遇到的就是「形容詞」。飼主會說「吐了很多」、「看起來很痛苦」、「顏色怪怪的」。但「很多」是多少？是一湯匙還是半碗？「怪怪的」是像咖啡渣還是像鮮血？這中間的差別是回家繼續觀察或是立刻插管洗胃。尤其是養貓的人，貓這種生物天生就是嘔吐界的藝術家，牠們會因為毛球、因為吃太快、因為換飼料、甚至因為你今天晚回家心情不好就吐給你看。但如果你看到的是噴射狀的嘔吐，或是嘔吐物裡帶著暗紅色像咖啡渣一樣的物質，那就完全是另一回事了。那通常代表胃壁已經受損，或是攝入了某些具備腐蝕性的東西。\n\n很多人會問，到底什麼時候該出門掛急診？我的標準很直覺。如果你的狗吐完之後，還能搖著尾巴過來聞聞那團東西，甚至想把它吃回去，那大概率是你今天餵了太多零食，或是牠在公園散步時偷吃了什麼路邊的加菜。但如果牠吐完之後窩在角落，叫牠沒反應，肚子摸起來硬得像塊木頭，或者連續吐了三次以上，每次都只剩下透明的黏液，那你就該拿好鑰匙出門了。\n\n還有一點是關於品種的特異性。如果你養的是巴哥、法鬥這種短吻犬，嘔吐對牠們來說風險比一般犬種高得多。這不只是腸胃的問題，而是解剖結構上的先天劣勢。短吻犬因為呼吸道短促，嘔吐時極度容易發生誤吸，導致吸入性肺炎。我之前看過一隻八歲的法鬥，只是因為換飼料不適應吐了一口，結果卻因為嘔吐物進了肺部，半夜演變成嚴重的呼吸窘迫。所以，如果你家的是這些品種，即便吐出來的東西看起來沒什麼大礙，只要牠開始出現劇烈的喘氣或咳嗽，那絕對不能等。\n\n至於那些養貓的，請務必養成「檢查嘔吐物」的壞習慣。我知道那很噁心，但裡面如果出現像針頭大小的線頭，或者是看起來像聖誕節裝飾用的亮片，那是最高等級的紅色警戒。貓的舌頭上有倒鉤，一旦勾住線狀物，牠們就只能一路吞下去。這種東西進了腸子會像鋸子一樣，隨著腸道蠕動把腸子拉扯成手風琴狀。這在超音波底下很好認，但如果你沒告訴我牠有誤食的可能性，我也許會往一般的腸胃炎方向去診斷，那會浪費掉最寶貴的黃金救援時間。\n\n很多飼主在半夜會陷入一種搜尋引擎焦慮。他們會在 Google 輸入「狗 嘔吐 綠色」，然後得到一堆「癌症」、「中毒」、「器官衰竭」的恐怖結論，把自己嚇到手發抖。其實，大部分的綠色只是因為嘔吐太過劇烈，把十二指腸裡的膽汁都給倒抽出來了。這確實代表牠很不舒服，但不代表牠快要離開這世界了。與其在網路上看那些沒根據的醫療文章，不如拿起手機，關掉閃光燈，找個光線充足的地方，從上方跟側面各拍一張照片。甚至，如果可以的話，用衛生紙把嘔吐物撥開一點，看看裡面有沒有未消化的食物殘渣。\n\n我曾經遇過一個飼主，他半夜傳來一張照片，裡面是一團粉紅色的黏液。我一看心就涼了半截，以為是急性肺水腫或是嚴重內出血。結果我叫他立刻帶過來，一檢查發現那隻狗的口腔黏膜完全正常，精神好得不得了。後來才發現，那天下午家裡的小孩餵了牠半顆紅火龍果。這就是為什麼照片很重要，但「脈絡」更重要。你餵了什麼、牠幾點開始吐、中間有沒有去過公園、家裡的盆栽有沒有被啃過的痕跡，這些生活細節比任何昂貴的抽血檢驗都能更早告訴我答案。\n\n獸醫真的不是通靈。我們在半夜看診時，最需要的是資訊的精準度。你家毛孩不會說話，你就是牠的翻譯官。如果你沒辦法準確翻譯牠的身體狀態，那我們只能在迷霧裡猜測。所以，下次發生這種事，先收起你的尖叫跟眼淚，深呼吸，拿好手機。那張被你嫌髒的照片，可能就是決定今晚我們是要在手術室見面，還是我能拍拍你的肩膀說「沒事，明天餵點清淡的就好」的關鍵證據。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 09:44", "comments": [{"author": "早餐省略者", "content": "真的 拍照有夠重要……之前我太慌直接沖掉 醫生臉都綠了", "time": "19:26"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 198, "slug": "20260613-0946-8504fa", "permalink": "/articles/20260613-0946-8504fa/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "養蜜袋鼯前先看一眼成分表：50%以上的含水量與高鈣磷比需求，是如何被五百塊一包的廉價穀物飼料毀掉的。", "content": "那一小袋只有幾百公克的五彩繽紛顆粒，聞起來像草莓軟糖，標籤上印著一隻大眼睛的蜜袋鼯在微笑，你買的時候覺得既然是進口貨、一包賣個四、五百塊應該很有保障，對吧？但我那個專門看異寵的獸醫朋友前幾天才在診間發飆，因為他又接到一隻全身抽搐、骨密度低到像層薄紙的蜜袋鼯，那隻小傢伙才兩歲，後半輩子可能都要癱瘓在籠底。這種案例在台灣的飼主圈子裡多到讓人想哭，而罪魁禍首往往就是那包被包裝得像高級零食的廉價穀物飼料。\n\n我家那隻蜜袋鼯剛來的時候，我也差點掉進這種「乾飼料陷阱」。我們習慣了養貓養狗的邏輯，覺得只要倒一碗乾糧配一瓶水就能解決一切，但蜜袋鼯這物種在野外的設定根本不是這樣。牠們在澳洲森林裡是舔食者，吸的是樹汁、花蜜，啃的是滲出的樹膠，偶爾抓幾隻昆蟲補充蛋白質。你去看那種森林裡的天然食譜，含水量基本上都在 50% 到 70% 之間，甚至更高。結果我們把牠們關在籠子裡，餵牠們吃含水量不到 10% 的乾燥穀物，這就像是叫一個習慣喝湯的人每天只能吃乾餅乾，還得靠那一小瓶滾珠水壺來補足剩下的 40% 水分差額。事實上，蜜袋鼯那種舌頭構造就不適合從滾珠水壺有效攝取大量水分，長期下來，脫水引發的腎臟問題與尿道發炎，只是時間早晚的事。\n\n更邪惡的是成分表裡的鈣磷比，這是我鑽研最久、也最想罵人的地方。只要是養過一陣子的人都知道「鈣磷比 2:1」是蜜袋鼯的命脈，但你去翻開市面上那些熱銷的廉價飼料，主成分前三名通常是玉米、小麥、大豆。這些東西的磷含量高得嚇人，鈣卻少得可憐。如果你仔細去算一下那個比例，很多飼料的鈣磷比甚至是 1:5 或更糟。當這種失衡的食物進入那不到一百公克的小身體裡，為了維持血液中的鈣濃度，牠的身體會被迫從骨頭裡把鈣「偷」出來。這就是為什麼那麼多飼料鼯到了兩三歲就開始後肢無力、脊椎變形，甚至稍微跳一下就骨折，醫學上叫代謝性骨病（MBD），我叫它「慢性軟骨功」。\n\n我曾經為了驗證這件事，把幾款主流的蜜袋鼯飼料寄給做檢測的朋友，結果發現標籤上寫的蛋白質 25%，裡面有一大半是來自廉價的植物蛋白，根本不是牠們消化道能高效利用的昆蟲或動物蛋白。那些所謂的「水果風味」更是笑話，說穿了就是人工香料跟甜味劑，為了讓這些小傢伙對這種沒營養的餅乾上癮。當牠們吃慣了這種重口味的加工品，你再想餵牠們吃新鮮的蟲子、蔬菜或正確配比的 HPW（高品質蛋白粉），牠們根本連看都不看一眼。這就是典型的「垃圾食物養殖法」，飼主省了備餐的時間，代價卻是之後跑獸醫院一趟幾千塊的檢查費，還有看著牠們受苦的罪惡感。\n\n我朋友老婆之前養過一隻，就是標準的「韭菜養法」，飼料包裝越漂亮她越買。那隻小鼯四歲就因為腎衰竭走了，臨終前瘦到剩皮包骨。我們後來拆開她餵的那包「天然營養配方」，發現裡面填充了大量的葵瓜子。你懂嗎？那種高油脂、高磷的種子類對蜜袋鼯來說簡直是毒藥，但因為成本低、適口性好，廠商就敢大剌剌地放進去，還在封面上畫個大大的愛心。这种商業邏輯完全是建立在飼主的懶惰與資訊不對稱上。\n\n這群來自澳洲跟印尼山林的小精靈，壽命原本可以到十二、十五年，但在這種五百塊一包的廉價餵食模式下，平均壽命在台灣往往不到七年就夭折。我們真的該停下來看看那張密密麻麻的成分表，而不是只看封面那張可愛的照片。如果你算一算，買一罐合格的蛋白補充粉加上新鮮蔬果，一天的伙食費其實也就多個十幾塊錢。這十幾塊錢，換來的是牠們可以有力氣在客廳滑翔，而不是在籠子角落拖著癱瘓的後腿。說真的，如果連幫牠們切幾塊水果、攪拌一下營養粉的力氣都不肯花，那我們憑什麼說自己愛牠們？", "source_link": null, "source_title": null, "timestamp": "2026-06-13 09:46", "comments": [{"author": "Lucas.L", "content": "basically 很多人圖方便餵乾糧.. literally 是在慢性處置牠們, really sad!", "time": "19:10"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 199, "slug": "20260613-0947-1e72cd", "permalink": "/articles/20260613-0947-1e72cd/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "那些標榜英短專用的低敏配方，蛋白質含量 30% 卻有 20% 都是豌豆粉？", "content": "你家那隻英短現在是縮在沙發角落裝憂鬱，還是在餐碗前面等著那份宣稱「低敏、護心、專用」的高價飼料？我前幾天跟我那個獸醫死黨在快炒店喝開了，他剛接完一個心肌肥大的案例，氣到連酒都快喝不下去。他說現在診間最常看到的，就是那種被飼主捧在手心、吃得比人還貴，結果打開成分表一看，簡直是在繳智商稅的悲劇。我們聊到現在市場上那些五花八門的品種專用糧，特別是針對英短這種「呼吸都會胖」的品種，廠商抓準了飼主怕貓心肌肥大、怕關節出問題的軟肋，拚命在那邊推什麼「低敏配方」。\n\n我隨便抓了一罐最近網路上廣告打很兇的英短專用糧，包裝上寫著蛋白質 30%，聽起來好像還行？但我這個人有個強迫症，我一定會看後面的原料排序。根據現行規範，原料必須按重量佔比從多到少排列，前三位裡面，除了第一個勉強是個肉粉或脫水肉，接下來竟然就是豌豆粉、鷹嘴豆、馬鈴薯。我拿出計算機算了一下，扣掉水份、灰分跟纖維，這 30% 的蛋白質裡面，起碼有將近一半是植物性蛋白。這概念是什麼？這就像是你去牛排館點了一客頂級肋眼，結果上桌的是一半以上的素雞加豆干，老闆還收你一客兩千塊。\n\n那些廠商的行銷話術很聰明，他們會告訴你「豌豆是低升糖指數（Low GI）的優質澱粉來源」，還能減少過敏源。聽起來很有道理對吧？但我家那隻老貓養了十二年，我鑽研這些數據也有十年了，貓是肉食動物，牠們的腸道結構短，消化植物蛋白的效率差到不行。那 20% 的豌豆粉塞進去，對英短這種原本代謝就慢、容易有心血管壓力的品種來說，根本是變相的負擔。你以為你在餵牠吃營養，實際上牠是在努力消化一堆牠根本不需要的澱粉填充物，然後多餘的碳水化合物轉化成脂肪，讓牠那原本就壯碩的身軀更加負重前行。\n\n我獸醫朋友那天在桌上比劃著，英短的臉圓、骨架大，這在品種遺傳上本來就容易有 HCM（肥厚性心肌病變）。這種貓最需要的是優質的動物性牛磺酸跟精胺酸，而不是一堆為了拉高蛋白質數據而添加的便宜植物粉末。廠商為了壓低成本，又想在數據上好看，最快的方法就是摻豆粉。你知道現在進口禽肉蛋白跟優質豆粉的原料價差是多少嗎？整整差了三倍以上。這就是為什麼那些進口糧即便賣到一公斤四五百塊，毛利率還能高得嚇人，因為你買的是行銷成本，不是真正的肉。\n\n更諷刺的是，有些飼主看到「低敏」兩個字就覺得是救贖。其實真正的過敏源在貓身上很複雜，但絕對不是靠把肉換成豆子就能解決的。我朋友老婆養的那隻英短，吃這類專用糧吃到後來毛色越來越枯，去檢查發現尿液鹼性偏高。這就是長期攝取過多植物蛋白的後果，改變了體內的酸鹼平衡。那些廣告宣稱的「特殊顆粒設計，適合英短短顎咬合」，說穿了就是一種模具成型的物理差異，這東西值不值得讓你每公斤多付兩百塊去買那些豆粉？我自己以前也繳過這種學費，看著包裝上那隻漂亮的藍貓就失心瘋，後來才發現自己根本是在幫廠商付廣告費。\n\n我前陣子在看歐美那邊的寵物展資訊，發現人家現在開始在吵「零豆類（Grain-Free vs. Pulse-Free）」的議題。美國 FDA 甚至還調查過無穀飼料中過多的豆類攝取與貓狗心臟病之間的關聯。結果我們這邊的市場還在把「無穀且添加豌豆」當作高端象徵。這真的很有趣，我們這群飼主有時候真的很像韭菜，被那些「科學配方」的專用詞彙唬得一愣一愣。廠商說英短容易胖，所以要控制脂肪，好，那他就減少肉含量，增加豆類填充，最後脂肪降下來了，但貓得到的能量全是廉價碳水，這不是減肥，這是在營養不良的邊緣試探。\n\n我常在論壇上看到有人問：「這款飼料蛋白質有 30%，應該算不錯吧？」這種問題我真的看一次心痛一次。數字是會騙人的。你要看的是那 30% 背後的生物利用率。一塊雞胸肉的生物利用率跟一袋豌豆粉的生物利用率完全是兩回事。如果我們只看數字，那皮革也能化驗出蛋白質，你餵你家貓吃皮帶嗎？這就是現在寵物食品產業的荒謬之處。大家都在玩數字遊戲，把成本幾塊錢的原料，包裝成「品種特化、精準營養」的高級貨。\n\n英短這種貓，說好聽是溫和、不愛動，說直白一點就是代謝廢物能力比米克斯弱。牠們更需要的是高含量的、直接來源於肌肉組織的動物蛋白。當你在原料表看到「豌豆、豌豆纖維、豌豆蛋白」被拆開寫成三項的時候，那是業界常用的「原料拆解法（Ingredient Splitting）」。目的就是為了讓「肉」排在第一位，不讓豌豆的總重量超過肉。如果你把這三項豌豆衍生物加起來，它其實才是這包飼料真正的主體。這就是現實，也是我們這群被當成韭菜的飼主不願意面對的真相。\n\n我獸醫朋友最後乾了一杯，他說了一句很重的話：「這幾年來看過這麼多病貓，有一半是基因問題，另一半真的是吃出來的。」我們這些當主人的，總想給牠們最好的，結果卻在層層包裝的數字陷阱裡迷了路。看著家裡那隻每天只會翻肚子討摸的傢伙，我現在買東西前一定會先把老花眼鏡戴好，把那排比螞蟻還小的成分表一個字一個字拆解。什麼品種專用、什麼極致低敏，只要原料表前幾名出現那些植物粉末，我連看都不會再多看一眼。說到底，貓的胃不會看廣告，牠們的身體數據才是最誠實的判官。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 09:47", "comments": [{"author": "sv_imposter", "content": "literally 一模一樣, 我之前也為了家裡的英短買過超貴的 grain-free 飼料, 結果 ingredient list 裡面 pea protein 排超前面... 到底有哪個好牌子是比較 pulse-free 又是動物蛋白為主的? ☕️", "time": "16:37"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 200, "slug": "20260613-0949-3b291f", "permalink": "/articles/20260613-0949-3b291f/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "貓奴論壇為了看那團東西鬧到要罷免版主，這你信不信？", "content": "我跟你講喔，這真的不是我在瞎掰，雖然整件事聽起來荒謬到像是我昨晚酒喝多了夢到的。那個論壇本來好端端的，大家每天在那邊曬貓、比誰的貓砂盆比較高科技，結果前陣子有個資深會員貼了一張照片，說他家主子最近產出的「成品」形狀不太對勁，問大家這是不是脫水的徵兆。本來這種醫療諮詢帖在版上很常見，大家頂多是建議去看獸醫，但這次不一樣，有人跳出來指責這張照片「太寫實」，沒打碼也沒折疊，害他在辦公室吃飯時差點噴出來。\n\n這下可好了，戰火瞬間引爆。一派人覺得「我們是貓奴，連這點東西都受不了還養什麼貓」，另一派人則堅持「公共空間要有基本的視覺禮儀」。那個版主也是個妙人，他大概是想當和事佬，結果居然發了一個公告，說以後所有關於健康觀察的照片都必須經過「色彩飽和度調整」，還煞有其事地列了一張對比表，規定什麼程度的深色是可以接受的，什麼程度的黃色必須轉成灰階。\n\n我看到那張公告的時候差點沒把口中的咖啡噴在螢幕上。這算什麼？寵物健康檢查的審查制度？那個版主大概覺得自己很有創意，但在網友眼裡，這簡直就是把大家當白癡。\n\n於是事情開始往政治鬥爭的方向歪掉。有人挖出那個版主的舊文，發現他自己三年前也發過沒打碼的照片，批評他雙重標準。接著，陰謀論就出來了，有人說版主之所以推行這個規定，是因為他最近接了某家自動貓砂機廠商的業配，而那台機器的主打功能就是「自動包裹、不讓飼主看見異物」。\n\n你看看，這就是人類。本來是討論貓的腸胃問題，最後居然能扯到商業黑幕跟獨裁審查。\n\n我聽說那幾天論壇的流量直接爆表，大家不討論貓了，都在討論「視覺美學與公共衛生之辯證」。我當時就坐在電腦前看樂子，心裡想著：這些人到底是多閒？假設真的有一個「全國排泄物觀察委員會」，我想那個版主大概會被拉去遊街示眾，罪名是「干擾學術自由」。\n\n最瞎的是，甚至有人發起連署要罷免他。理由寫得正經八百，說版主「缺乏對生理現象的基本尊重，試圖用偽善的審美標準閹割飼主的知情權」。我真的沒開玩笑，那些用詞專業到我以為在看什麼憲法修正案。這群貓奴平常連幫貓剪個指甲都像要殺頭一樣慘叫，搞起政治鬥爭來倒是個個像凱薩大帝。\n\n這讓我想起上次去寵物展，看到兩個攤位的主人在吵架。一個是賣手作鮮食的，一個是賣科學配方飼料的。鮮食那位指著對方的海報大罵，說他們這種東西產出來的東西「沒靈魂」，觀察不到貓的生命力。我當時就在旁邊看，差點想問他：你觀察到的靈魂是長什麼形狀的？是圓柱體還是螺旋狀？\n\n這種階級鄙視鏈在寵物圈真的是無所不在。養進口純種貓的看不起養米克斯的，餵生食的看不起餵乾糧的，現在連「怎麼觀察排泄物」都能發展出一套政治正確。我認識一個養了五隻貓的哥們，他每天早上第一件事不是刷牙，而是拿著手機對著貓砂盆攝影，還要調整光影，說這樣才能精準記錄顏色變化。他跟我說這叫「生物大數據管理」，我跟他說這叫「這輩子沒這麼認真看過東西」。\n\n後來那個論壇的罷免案雖然沒過，但版主最後還是辭職了。聽說他臨走前發了一篇長文，語氣滄桑得像剛從戰場回來的老兵，說他原本只是想讓大家過得舒服點，沒想到人類的鬥爭心比貓的發情期還不可理喻。這倒是真的，貓頂多是在你枕頭上留點「禮物」表達不爽，人類卻會為了那點禮物要你下台負責。\n\n我跟你講，這種事每天都在發生。你有空去逛逛那些養龜的群組，或者是養特寵的論壇，你會發現裡面的人際關係比好萊塢電影還精彩。有人會因為某次聚會沒幫對方的守宮拍好照片，就從此老死不相往來。或者某個協會的理監事選舉，居然是因為某個候選人被抓到偷偷給鄰居的狗餵肉條，而被指控「試圖透過非法賄賂干擾選區和諧」。\n\n這些人大概都忘了，當初養寵物是為了療癒自己，結果最後搞得比上班還累。我之前也差點捲入一場紛爭，有個鄰居大媽一直跟我抗議，說我家貓在陽台曬太陽的姿勢「不夠優雅」，影響了整個社區的格調。我當時看著她，又看看我那隻翻著肚子、姿態極其放肆的貓，我真的好想問她：要不要我送牠去上禮拜六的禮儀學校？\n\n搞政治的人累，看政治的人爽。我現在每天最大的樂趣就是點開這些討論版，看那些平時在辦公室唯唯諾諾的高級主管，為了論壇上一個「是否應該將排泄物影像標註為限制級」的投票案，在那邊洋洋灑灑寫幾千字的攻訐文。那種熱情，要是拿去處理公務，估計我們現在都已經在火星上遛狗了。\n\n這個世界就是這樣，我們因為熱愛某種生物而聚集，最後卻因為人類那點無聊的自尊心和控制欲而分崩離析。那個罷免版主的貓奴，現在據說自己開了一個新版，入版規定的第一條就是「本版嚴禁對自然產物進行任何形式的數位修飾」。我看他也沒撐多久，上禮拜就有人抗議他在直播中出現的貓砂顆粒太大，遮擋了觀察視線，這算是在「掩蓋真相」。\n\n你看，這就是政治。你以為你躲開了辦公室，躲開了社會，躲進了溫馨的寵物世界，結果發現這裡的江湖更深。我倒覺得這也挺好的，至少這讓我知道，不管是總統大選還是貓奴內鬥，本質上都跟貓砂盆裡的那團東西差不多——你越去攪動它，它就越臭，但總有人樂此不疲地拿著鏟子在那邊翻來覆去，還自以為是在守護世界的正義。\n\n我後來問那個離職的版主，他辭職後都在幹嘛。他回了我一張照片，畫面是一片草地，什麼寵物都沒有。他說他現在覺得，還是單純看著空氣比較安全。我回他說，你小心喔，哪天有人會檢舉你呼吸的頻率不夠環保，破壞了論壇的永續經營共識。他傳了一個哭笑不得的貼圖過來，我想他現在大概已經悟透了，這世界上最難伺候的從來不是家裡那隻主子，而是螢幕另一頭那些閒著沒事幹、卻自以為掌握真理的同類。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 09:49", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 201, "slug": "20260613-0950-fad79c", "permalink": "/articles/20260613-0950-fad79c/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "德州守宮協會理事長那點破事你聽說了嗎", "content": "我跟你講喔，如果德州守宮協會那位理事長真的因為私吞三條麵包蟲被罷免，這絕對不是什麼財務糾紛，這叫「生物資產的誠信危機」，是爬蟲圈今年最荒唐的政治風暴。你可能覺得三條麵包蟲算什麼？去水族館抓一把都不止三條，但在那群把豹紋守宮當成命根子的德州老外眼裡，這不是蟲的問題，這是階級鬥爭的火種。假設這事是真的，我閉著眼睛都能想像那個理事會現場，一群穿著格子襯衫、鬍子沾滿咖啡漬的大叔，對著一張顯微鏡下的麵包蟲殘渣照片拍桌子大吼，說這是對公眾信任的公然羞辱。\n\n說真的，人類在寵物圈搞出來的政治內鬥，精彩程度絕對不輸給國會大選。我就在想，要是那個理事長真的想貪污，他幹嘛不去私吞兩隻高單價的黑夜豹紋守宮？一隻好歹也幾千美金，結果他老人家栽在三條麵包蟲上，這就很耐人尋味了。我猜大概是他在某次會員聚餐的後院，偷偷從公家的飼料罐裡撈了三條肥的去餵他自己那隻剛脫皮的寶貝，結果被躲在草叢裡抽菸的副理事長給瞧見了。副理事長正愁沒藉口上位呢，這下好了，三條蟲成了壓死駱駝的最後一根稻草。\n\n這種事在我們這種養寵物的人眼裡，其實特別真實。你信不信，養狗的看不起養貓的，養貓的看不起養魚的，但全生物圈最底層、最神祕也最愛搞小圈圈政治的，絕對是這群養爬蟲的。他們有一套自己的社會階級，養綠鬣蜥的覺得自己是恐龍騎士，看不起養守宮這種小可愛的。而守宮圈內部還能再分，養肥尾守宮的覺得自己品味高端，養普通豹紋的就成了普羅大眾。那個理事長肯定是在某次技術交流會上，為了彰顯權威，非得說他的蟲是經過特殊營養配比的，結果被對手反抓到帳目對不起來。\n\n這讓我想到之前在某個寵物展看過的奇葩攤位，老闆一臉神祕地跟我推銷一種「靈魂飼料」，說吃了之後爬蟲會跟你心靈感應。我當時心裡就在笑，心靈感應我是不知道啦，但我看他那個帳本漏洞百出，估計遲早也要被會員罷免。人類就是這樣，只要聚在一起，哪怕是為了幾隻冷血動物，也能搞出派系林立的局面。德州守宮協會那場選舉，我打賭投票率一定比當地鎮長選舉還高，因為這牽扯到誰能拿到明年「最美尾巴獎」的評審權。\n\n你有沒有發現，越是這種微不足道的資源，鬥起來越狠？三條麵包蟲在路邊可能連個屁都不是，但在「協會」這個神聖的政治修羅場裡，那就是理事長腐敗的鐵證。如果我是那個理事長，我就在罷免大會上直接當眾把那三條蟲吞了，展現一種「我就爛，但我有種」的氣勢。你想想看，一堆人圍著桌子，爭論那三條蟲到底是麥皮蟲還是普通的麵包蟲，其嚴肅程度簡直像是聯大在討論核武擴散。這種一本正經胡說八道的氛圍，就是我混跡各大寵物論壇最大的動力。\n\n我認識一個養守宮的哥們，他為了爭奪某個臉書社團的版主位置，連續三個月每天晚上定鬧鐘起床給社團裡每個人的貼文點讚，這種毅力要是拿去考公務員早就當局長了。結果他選上了之後幹嘛？他把所有貼「守宮吃太胖」照片的會員全給封禁了，理由是「助長物種肥胖焦慮」。你看，這就是政治，這就是權力的滋味。德州那位理事長估計也是這種心態，他可能覺得這整個協會的蟲都是朕的，朕拿三條怎麼了？\n\n真的假的我也不知道，但我聽說有些協會內部的舉報信，寫得比諜報小說還精彩。什麼「凌晨三點發現理事長辦公室燈還亮著，疑似在私自繁殖未申報品種」，或是「某次年會的茶水費多報了五十美金，懷疑被挪去買自動恆溫箱」。這些人平時在路上看到鄰居不一定會打招呼，但只要一進到寵物政治的世界，每個人的觀察力都變得比聯邦調查局還敏銳。\n\n我跟你講，這種內鬥其實是一種浪漫。你想想，一群成年人，為了幾隻體溫跟室溫一樣的生物，在那裡爾虞我詐、勾心鬥角，這說明了什麼？說明我們人類真的太寂寞了。我們需要一個戰場，哪怕這個戰場只有一個水族箱那麼大。如果沒有這三條麵包蟲的醜聞，德州那些會員的日子該有多無聊？他們就只能在那裡討論濕度、溫度跟鈣粉品牌。現在有了罷免案，整個德州的爬蟲圈都活過來了，大家開始戰隊，開始翻舊帳，開始在推特上發長文自清。\n\n我甚至能想像，那個罷免投票的當天，現場氣氛一定凝重得跟葬禮一樣。有人提議要把那三條蟲的購買收據釘在公告欄上示眾。假設真的有律師介入這場罷免案，你覺得控方律師會怎麼說？他大概會說：「這不只是三條蟲，這是對我們協會憲章的踐踏！今天他敢偷三條蟲，明天他就敢把我們的會費拿去買私人直升機！」然後底下群情激憤，大家完全忘了那三條蟲其實已經被消化掉了，早就化成了一團不屬於食物的東西。\n\n這種荒謬感才是我愛看寵物政治的原因。你去看那些什麼國際政治、軍事對峙，那太遙遠了。但德州守宮協會的麵包蟲失蹤案，這可是發生在我們身邊、有血有肉（雖然蟲是冷血的）的鬥爭。它折射出人類最本質的一面：貪小便宜、愛管閒事、以及對微小權力的極度迷戀。我自己以前也幹過類似的蠢事，在某個論壇為了爭論貓砂盆該放客廳還是陽台，跟人戰了三天三夜，戰到最後我都忘了我家根本沒養貓。\n\n所以說，理事長被罷免了也好，這給了下一任理事長一個警示：在德州，你可以不繳稅，你可以不戴口罩，但你絕對不能動公家的麵包蟲。這三條蟲將會被載入史冊，成為爬蟲圈民主進程中的重要里程碑。以後每屆理事長就職，可能都要對著一盆活跳跳的麵包蟲宣誓：「我發誓，絕不私吞任何一條蟲，無論牠有多肥。」\n\n這整件事最幽默的地方在於，那隻吃到「賄賂蟲」的守宮，現在肯定還趴在恆溫石上打瞌睡，牠完全不知道自己已經成了德州政治史上最貴的受益者。人類在那邊吵得不可開交，甚至有人要發動連署要把協會拆分成「純種守宮黨」跟「改良品種黨」，而動物本人只想著下一頓飯什麼時候送過來。這種人類與寵物之間的認知斷層，簡直就是這世界上最美妙的喜劇。\n\n我現在就在等，看會不會有人把這段故事拍成紀錄片，名字我都幫他們想好了，就叫《蟲影迷蹤：德州守宮圈的權力遊戲》。到時候首映會我一定去，還要帶一盒麵包蟲進去吃，當然，是買票進場的那種，絕對不是私吞的。說到底，我們這些在旁邊看樂子的，才是這場政治大戲裡唯一的贏家。你看這世界多荒唐，但又多有趣，只要你別把自己當成那個理事長就行了。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 09:50", "comments": [{"author": "沒加薪踹共啦", "content": "真的，為了這點小事鬧翻，還不是因為日子過太閒沒處發洩……", "time": "16:29"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 202, "slug": "20260613-0954-2313a8", "permalink": "/articles/20260613-0954-2313a8/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "除了活得久，你知道為什麼古羅馬人會教鸚鵡咒罵他們不喜歡的鄰居嗎？", "content": "為什麼鸚鵡會罵人這件事，其實比你想的還要早。你知道嗎，古羅馬時代的那些貴族，在自家別墅裡養鸚鵡可不是為了聽牠們說話多溫柔，純粹就是為了讓這隻會說話的鳥，幫忙傳遞那些自己在公開場合不好意思開口講的爛話。想像一下，你在亞平寧半島的陽光下喝著葡萄酒，鄰居那個勢利眼的傢伙又來指點你家的花園造景，這時候你不需要自己動嘴，直接指揮站在金絲籠旁的鸚鵡，讓牠把事先教好的那些尖酸刻薄的咒罵一股腦噴向對方，這種場面現在想想都覺得爽快。\n\n講到這個，我就想起維多利亞時代的那些老爺們，他們養寵物不僅要看品相，還要看這隻動物夠不夠「有性格」。那時候的英國貴族可講究了，鸚鵡因為壽命極長，甚至能活過好幾代飼主，常常成了家族傳承的一部分，有些鸚鵡甚至在老主人去世後，因為學會了老主人那套惡毒的罵人腔調，把來訪的新親戚嚇得魂飛魄散。我總是覺得，鸚鵡這玩意兒根本不是鳥，牠們是披著羽毛的傳聲筒，專門負責蒐集人類最醜陋的那一面。你知道嗎，以前甚至還有專門的「鳥類訓練師」在做這種生意，保證你的鸚鵡在三個月內能學會至少十種嘲諷鄰居的句型，這簡直是寵物界的最早產業鏈。\n\n不過這個有點離題，但你們不覺得嗎，其實人類對於「會說話的動物」有一種近乎病態的掌控欲。我們渴望寵物聽懂我們，但又更期待牠們能成為我們意志的延伸。就像古埃及人把貓視為神明的化身，那時候的貓根本不需要學會罵人，牠們只要坐在那邊不動，就足以讓所有想靠近的人心生恐懼，那種威嚴感跟古羅馬人養的那些愛吐槽的鸚鵡完全是兩個極端。但說到底，不管是想要一隻會罵人的鳥，還是想要一隻能幫你擋掉壞運氣的貓，我們其實都是在寵物身上投射了自己無法實現的掌控力。\n\n對了，你知道為什麼鸚鵡的腦袋瓜子裡裝得進這麼多髒話嗎？其實是因為牠們的演化機制根本沒把「禮貌」這兩個字寫進去。在野外，鸚鵡為了在複雜的族群裡生存，必須學會模仿同伴的呼喚聲，這對牠們來說只是生存本能，結果被人類一抓回家，這些本能就全歪樓了。我曾經有個學生問我，為什麼我家那隻金剛鸚鵡只學會了我在打遊戲失敗時罵的那句髒話，而不是我教牠的「你好」。這有什麼好奇怪的？鸚鵡對於情緒強烈的聲音有著天然的敏感度，當你在憤怒或者極度亢奮的時候，那個語調的波動對牠們來說就是最深刻的教材。\n\n這種情況其實跟中世紀那些養獵狗的貴族也挺像的。那時候的獵狗，如果性格不夠兇猛、或者無法在獵場上精準地執行主人的殺戮意圖，那是會被淘汰的，沒有人會把那種狗當成家裡的夥伴。現代人把貓狗當成心肝寶貝，天天清理牠們的排便、買最貴的罐頭伺候，其實我們骨子裡還是古羅馬人那套邏輯，只是現在我們把那種「掌控欲」換了一種比較文明的包裝方式。說穿了，你以為是你養了這隻鸚鵡，事實上是這隻鸚鵡在透過你的憤怒，幫你把那種無法在人際關係中釋放的毒素給排解掉，這簡直是一種奇妙的互害又互利的循環。\n\n我每次在論壇看到有人曬鸚鵡說出什麼驚人語錄，我心裡就發笑，那根本不是什麼聰明，那是飼主內心世界的鏡像。就像我在歷史課上常講的，如果你想知道一個朝代的統治者是什麼模樣，去看他們的寵物就知道了。清朝那些整天帶著獵鷹去打獵的八旗子弟，他們的鷹絕對比別人的更野更狠；而那些只會養個小手爐裝著寵物鼠的閒散王爺，你看他們後來的生活，哪一個不是軟綿綿的。這根本不需要什麼深奧的歷史分析，只要看看我們跟寵物之間的交流，你就知道我們自己是什麼貨色。\n\n所以下次當你家的寵物又做出什麼讓你氣結的舉動時，先別急著生氣。也許那只是因為牠們太懂你了，甚至懂到連你那些藏在心底、沒敢說出口的咒罵，都被牠們給翻譯出來了。我們總以為自己在馴化寵物，但歷史這五千年下來，誰馴化誰還真的說不定。你看古羅馬人，為了教鸚鵡罵鄰居，最後反倒成了那個時代最幼稚的笑話，而那些鸚鵡呢，依然活得比誰都長，冷眼看著那棟別墅換了一個又一個主人，說不定在牠們的記憶庫裡，還存著幾千年前那些貴族為了爭地盤而罵出的經典語錄呢。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 09:54", "comments": [{"author": "goku", "content": "聽過我家的灰鸚學我老婆罵人，瞬間就覺得這世界真是沒救了……", "time": "16:47"}, {"author": "apple", "content": "真的 超常中槍 寵物就像面照妖鏡 牠們越瘋越像是在模仿我們平常的情緒……", "time": "16:12"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 203, "slug": "20260613-0957-e38b08", "permalink": "/articles/20260613-0957-e38b08/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "中世紀的貓為什麼在火堆旁瑟瑟發抖，現在卻在貓砂盆裡呼呼大睡？", "content": "講到這個，我每次看到家裡那隻橘貓大剌剌翻肚睡在陽光下，總會想起當年的那些黑暗日子。你一定聽過那種傳說，說中世紀歐洲人瘋狂地要把貓抓起來處置，覺得牠們跟女巫脫不了干係，甚至連教宗都親自點名貓咪是異端的象徵。這聽起來簡直荒謬透頂對吧？但你知道嗎，這不是單純的迷信，這背後其實是一場長達數百年的「誤會」。那時候的貓，因為那一雙在黑暗中發光的眼睛，被硬生生安上了各種怪力亂神的標籤。當時的人們沒什麼醫學常識，看到貓在半夜跑來跑去，以為牠們是在參加什麼不為人知的祕密聚會，甚至認為牠們會偷走靈魂。不過你仔細想想，要是你住在一個連晚上看書都要靠蠟燭，甚至常常一整個月沒什麼光照的房間裡，突然看到一對螢光綠的圓眼睛盯著你，你也嚇得想找把掃帚吧？\n\n這場針對貓咪的「清理」，其實反過來成了鼠輩的狂歡節。我一直覺得歷史最諷刺的地方就在這，當人類把這些貓通通驅逐出城鎮時，隨之而來的可不是什麼平靜生活，而是鋪天蓋地的鼠患。當那些原本負責把關糧倉的貓不在了，老鼠開始肆無忌憚地穿梭在麵包店和穀倉裡。對了，你知道嗎？有些歷史學者甚至認為這正是後來大瘟疫肆虐得那麼嚴重的原因之一，因為沒了貓，老鼠成了唯一的贏家，而跳蚤就在那團亂中跳到了人類身上。這聽起來簡直像是一場天大的笑話，人類因為害怕所謂的女巫魔力而犧牲了最稱職的捕鼠隊長，最後卻被自己製造的混亂狠狠教訓了一頓。\n\n講到這個，我想起來，維多利亞時代的人對寵物的那股狂熱簡直到了不可思議的地步。那時候的人們，簡直恨不得把貓咪供在神桌上，貓咪的形象從邪惡的化身，搖身一變成了溫順、優雅、代表家道興旺的守護者。你看，這轉變有多快？從隨時可能被驅逐的魔鬼，變成維多利亞貴婦膝蓋上的高級裝飾品。這哪是因為什麼人類變得善良了？根本是因為後來的人類發現，家裡有一隻毛茸茸、會打呼嚕的小生物，能有效降低那種被工業時代壓得喘不過氣的焦慮。我們其實一直都很自私，我們馴化寵物的初衷，永遠離不開我們自己需要什麼。當年因為需要糧食安全而養貓，後來因為需要心靈寄託而養貓，貓咪自己倒是從頭到尾都沒變過，牠們只是換個姿勢睡覺，適應了我們這一波又一波古怪的流行而已。\n\n如果你覺得這很奇怪，那不如去看看古埃及人的墓穴。在五千年前，埃及人可是把貓當成神在拜的，那時候誰敢動一根貓毛，下場絕對比現在的違法行為還慘。我看過考古資料，當時如果家裡的貓去世了，飼主甚至要剃掉眉毛以示哀悼，那陣仗搞得跟國喪沒兩樣。這種極端崇拜，跟後來中世紀那種極端敵視，其實本質上是一樣的。我們人類總是喜歡把自己的情緒投射在這些毛茸茸的小傢伙身上，把牠們神化或是魔化，卻鮮少真正去理解牠們為什麼會想蹲在我們的膝蓋上。\n\n很多時候，我坐在那看著我家那隻貓盯著空氣發呆，我就在想，牠會不會記得牠那遠在五千年前的祖先，曾經在尼羅河畔被當成神靈供奉的榮耀？或是牠會不會偶爾做個夢，夢見自己在那段混亂的歲月裡，為了逃過那場莫名其妙的浩劫而躲在屋頂的瓦片下發抖？歷史其實沒你想的那麼遠，牠們的基因裡可能還留著那種警惕的本能。你看現在有些貓，看到陌生人第一反應還是先躲起來，那種謹慎可不是平白無故產生的。我們總以為是我們教導了寵物如何跟人類相處，其實很多時候，是這些小東西在五千年的磨難裡，默默學會了如何討好這群情緒不穩定的人類，好讓自己能有一份穩定的罐頭。想到這，你還覺得是你選了牠，還是牠觀察了你很久，才決定把你收編呢？", "source_link": null, "source_title": null, "timestamp": "2026-06-13 09:57", "comments": [{"author": "長輩圖收藏家", "content": "我家橘貓這表情，看來是早就選定我是長期飯票了，畢竟罐頭還是要給牠開才行……", "time": "15:32"}, {"author": "訊息轟炸受害者", "content": "想問養了五六年還沒辦法剪指甲正常嗎? 每次拿指甲剪牠就變回中世紀那個要逃命的樣子...", "time": "18:54"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 204, "slug": "20260613-0527-1244b1", "permalink": "/articles/20260613-0527-1244b1/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "烏龜半夜像拉風箱一樣張嘴喘氣，看側甲動不動就知道該不該衝急診。", "content": "半夜三點看到烏龜張大嘴巴，脖子伸得老長，喉嚨還發出那種像破風箱拉動的嘶嘶聲，我敢保證，你現在的手一定在發抖，甚至已經打開手機在找最近的夜間急診。這畫面確實挺嚇人的，特別是當你養的是巴西龜或地圖龜這種平常活蹦亂跳的傢伙，突然間牠變得像是在空氣中溺水一樣，那種無助感會讓飼主瞬間崩潰。但我得先幫你潑盆冷水，也順便幫你省下那幾千塊的急診掛號費，我們先冷靜看一眼牠的側甲。\n\n上週我有個老病人，養了十幾年的斑龜，半夜發訊息給我說龜快不行了，一直在「尖叫」。其實烏龜沒有聲帶，牠們發出的任何聲音，不管是嘶嘶聲還是那種類似口哨的雜音，全都是氣流強行擠過狹窄或充滿分泌物的呼吸道產生的。這通常代表兩件事：要嘛是牠感冒肺炎了，要嘛是牠剛吃太快噎到了。\n\n現在請你蹲下來，平視你的烏龜，盯著牠甲殼側面、也就是腋下到後腿窩那一塊皮褶處。如果你發現牠每張一次嘴，那一塊皮膚就劇烈地凹陷又隆起，甚至連帶著整個側甲都在微微晃動，那這件事就大條了。這在臨床上叫做「腹式呼吸」，雖然烏龜本來就沒有橫膈膜，但當牠必須動用全身肌肉去擠壓肺部來換氣時，這代表牠的肺部有效換氣面積可能剩下不到三分之一。這時候不用猶豫，不管半夜幾點，這就是急診。\n\n但如果牠只是張著嘴，聲音聽起來很嚇人，但側甲的起伏很平緩，甚至牠還能試圖爬向你躲避，那你可以先稍微喘口氣。我常看到很多飼主半夜衝進來，結果烏龜只是因為水溫突然掉了三度，鼻子有點過敏塞住，或者是單純的嗆水。你要知道，烏龜的代謝慢到一種你難以想像的程度。一個嚴重的肺炎，從開始流鼻水到全身敗血症，通常要走兩三週的療程，牠們很少會「突然」在半夜三點病發身亡，除非那種病徵你已經忽視了整整一個月。\n\n很多飼主會在這個時候去 Google 搜尋，然後看到「肺炎」兩個字就嚇得半死。確實，肺炎是烏龜的頭號殺手，尤其是那些在夜市或是路邊隨便買回來的幼龜。這些小傢伙在運輸過程中受盡折騰，免疫力早就崩盤。但我常跟診間的學生講，看病不能只看症狀，要看基因。像蘇卡達這種陸龜，牠們的呼吸道結構特別長，一旦環境濕度控不好，半夜吹到冷風，氣管微血管擴張，聲音聽起來就像火車進站。但這跟巴西龜那種因為水質太髒導致的細菌性肺炎是兩回事。巴西龜的肺炎通常伴隨著側泳，也就是牠游水時身體會歪一邊，這就像人的一邊肺部積水或塌陷，浮力不平均。如果你看到牠歪著游，又在那邊拉風箱，那是真的不能等。\n\n我遇過最荒謬的案例，是一個年輕人凌晨四點帶著他的輻射龜衝過來，說龜在「求救」。我接過來一看，那隻龜只是因為晚餐的仙人掌吃太快，有一塊纖維卡在食道頂端，壓迫到了氣管。我用鑷子夾出來後，那隻龜馬上就安靜了，剩下飼主在那邊看著五千塊的急診帳單發呆。所以，在你決定要不要衝急診之前，回想一下，你是不是剛餵完乾巴巴的飼料？還是你為了讓牠「排便」順暢，把牠泡在太熱的水裡？\n\n水溫是個關鍵，很多人的恐慌其實是溫差造成的。你半夜關了燈、關了加溫燈，室溫掉到二十度，水溫還在二十六度，這時候烏龜爬上浮島，冷空氣直接灌進溫熱的肺部，那種物理性的刺激會讓牠們反射性地張口呼吸。這時候你該做的不是抓牠去醫院，而是把加溫燈打開，或者乾脆把牠放回水裡。\n\n再說一個診間常看到的誤判，很多人分不清楚「張嘴呼吸」跟「威嚇」。有些龜個性就是暴躁，你半夜突然開燈去抓牠，牠當然張大嘴巴對著你嘶吼。這種時候你要看的不是聲音，而是牠的眼神。一隻真的缺氧、瀕臨衰竭的烏龜，牠的眼睛會凹陷，眼皮會顯得厚重，甚至會有白色的分泌物。如果牠眼神清澈，甚至還想咬你的手指，那牠的肺部功能大概還能撐到明天早上門診開門。\n\n你要明白，夜間急診的獸醫通常不是專門看爬蟲的，他們大多是犬貓專科。你半夜衝過去，他們頂多就是幫你打個抗生素、噴個藥，或者放進純氧箱。如果你的烏龜是因為長期的環境不良導致慢性衰竭，那這幾小時的急診其實意義不大，反而搬動過程中的驚嚇和溫差，可能會變成壓死駱駝的最後一根稻草。\n\n我有個習慣，會請飼主拍一段影片傳給我。影片裡如果烏龜張嘴時，頭部是向上仰、甚至呈現一種詭異的Ｓ型扭動，那通常是神經症狀或是極度缺氧的徵兆。但如果牠只是機械性地開合，且側甲動作幅度在正常範圍內，我通常會叫飼主去睡覺，明天一早帶過來檢查就好。\n\n很多時候，飼主的焦慮來自於對「死亡」的未知恐懼。烏龜這種生物給人的感覺是靜止的，所以當牠出現劇烈動作時，我們會過度放大那個信號。你得學會區分什麼是生理性的掙扎，什麼是病理性的崩潰。那個像拉風箱的聲音，其實是烏龜在告訴你牠的呼吸道不順暢，但不代表牠的生命正在倒數計時。\n\n今晚如果你真的睡不著，就把加溫棒調高一度，觀察牠的側甲起伏。如果起伏頻率每分鐘超過五次且幅度巨大，或者是牠已經完全失去爬行的力氣，四肢軟趴趴地攤在外面，連縮殼的反射動作都沒了，那真的沒什麼好說的，趕快出門。否則，把燈關掉，讓牠在穩定的溫度下休息，對牠的免疫系統來說，可能比你在半夜三點開車載著牠在大街上顛簸要好得多。\n\n我們診間牆上貼過一張照片，是一隻被救回來的二十歲老老巴西龜。牠來的時候肺部爛了一半，在氧氣箱裡待了整整一週，每分每秒都在拉風箱。牠能活下來不是因為急診那晚做了什麼驚天動地的手術，而是因為飼主在那之後整整三個月，每天準時幫牠擦藥、換水、控制溫度。寵物生病，急診往往救的是飼主的焦慮，真正的醫療是在你決定冷靜下來觀察側甲的那一刻才開始。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 05:27", "comments": [{"author": "IT狗無人權", "content": "講真，側甲起伏呢個 point 超 work，之前我都嚇到 run 咗去急診，結果只係 choking 咗。", "time": "11:46"}, {"author": "wingyu852", "content": "講真 嗰陣聲真係好驚人…… 之前俾急診呃過幾千蚊 側甲個 point 超有用 check 完即刻瞓得著", "time": "12:21"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 205, "slug": "20260613-0528-8df12d", "permalink": "/articles/20260613-0528-8df12d/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "我家陸龜的殼長歪了，是鈣粉餵太多還是曬太陽曬錯時間？", "content": "陸龜的殼長得像座崎嶇的小山，這在我們診間其實比感冒還常見，通常飼主一進來就一臉慘白，手裡拿著一罐高級鈣粉問我是不是補過頭，或者是不是下午三點曬太陽紫外線太強把殼曬皺了。其實我上週才剛送走一隻蘇卡達，牠的背甲隆起得像顆苦瓜，飼主每天給牠吃最好的菜、撒最貴的粉，結果換來一身崎嶇。我們先把那些五花八門的維他命放下，殼長歪這件事，在臨床上百分之九十都不是因為你「多做了什麼」，而是你「少做了什麼」，而且那個缺少的東西往往跟太陽沒什麼關係。\n\n很多飼主對鈣粉有種莫名的執著，覺得只要補了鈣，龜殼就會像鋼筋混凝土一樣又平又硬。但我看過太多案例，飼主餵了一堆鈣，結果陸龜的尿酸高到嚇人，殼還是照樣隆起。在生物學上，陸龜的生長速度跟環境濕度有著絕對的關聯。很多人以為陸龜既然叫「陸」龜，環境就該乾得像撒哈拉沙漠，這真的是個很嚴重的誤解。如果你觀察過那些在野外生長得平整滑順的陸龜，你會發現牠們幼年期大半時間都躲在潮濕的土洞或草叢深處。當環境太過乾燥，背甲的角質層在生長時會過度緊縮，像縮水的衣服一樣，把底下的骨骼往上拉扯，最後就形成了我們看到的隆背。\n\n這就像我們以前處理過的一隻豹龜，飼主為了怕牠感冒，把保溫燈開得全天候強光照射，濕度計永遠停在百分之三十。那隻豹龜的殼長得極其誇張，每個生長輪都像樓梯一樣抖。這不是鈣粉的問題，這是脫水。當龜殼的生長點因為乾燥而硬化，它就失去了彈性，只能垂直往上堆疊。所以別再糾結下午三點的陽光是不是太毒辣，就算你曬的是清晨六點的佛系陽光，只要你的飼養箱像個烘碗機，牠的殼照樣會長歪。\n\n說到基因，這更是許多飼主不想面對的真相。有些品種，像是星龜或蘇卡達，天生就有較高的隆背機率，這跟牠們體內的成骨細胞活性有關。在某些研究裡發現，特定基因座的表現會讓這些龜對代謝性骨病的容忍度極低。換句話說，有些龜就是天生比較嬌貴，一點點環境失衡就會反應在殼上。我們常說「七分靠天生，三分靠打拼」，在陸龜的世界裡，這句話其實挺殘酷的。\n\n我也常遇到飼主問我，是不是要換成更強的 UVB 燈管。我通常會告訴他們，燈管只是輔助，真正的問題往往出在食譜。你餵的菜是不是磷含量太高？或者是蛋白質給得太慷慨？很多飼主為了看龜長大，每天餵得跟吃滿漢大席一樣，生長速度一旦超過了骨骼礦物化的速度，殼就跟不上了，最後只能變形。這在我們獸醫看來，其實是一種「病態的肥胖」，只是它顯現在殼上。我見過一隻八歲的紅腿，飼主每天餵貓罐頭，那隻龜的殼軟得像塊橡膠，這就是典型的蛋白質過剩導致的骨質流失。\n\n至於曬太陽的時間，真的不用像算命一樣精準。只要有遮蔭處讓牠選擇，牠自己會判斷什麼時候該回陰影下。人會曬傷是因為我們沒有殼，龜的殼演化了幾千萬年，不是為了被這點陽光曬歪的。如果你發現龜殼已經開始凹凸不平，別想著靠補鈣把它補回來，那是不可能的。骨骼已經定型了，我們能做的只是讓接下來長出來的部分稍微平整一點。\n\n你要是半夜看著那凹凸不平的殼睡不著，先去檢查一下你家的濕度計，然後把那些五顏六色的飼料減半，多給點高纖維的牧草。那種長得像藝術品一樣完美的圓潤背甲，通常不是靠昂貴的營養品堆出來的，而是靠飼主對「濕度」和「生長速度」的克制。很多時候，我們對寵物的愛，往往體現在我們能忍住不去過度干涉牠們的自然節奏。那些追求快速長大的飼主，最後得到的通常是一隻外觀怪異、內臟負荷過重的病龜。\n\n我還記得有個老病人，他養的陸龜殼平得像瓷盤。我問他怎麼養的，他只說他從來不趕時間。他每天只給一點點雜草，環境永遠保持像午後森林那樣濕潤，太陽想曬就曬，不想曬就躲進爛泥巴。那隻龜長得很慢，八年才長大一點點，但牠的骨骼密度是我看過最健康的。這才是真正懂得跟生命相處的方式，而不是在半夜焦慮地搜尋該買哪牌的鈣粉。\n\n如果你家那隻現在殼已經歪了，也別太自責，這不是世界末日，只要牠活動力正常、排泄沒問題，那就是牠生命故事的一部分。只是你要記得，下次看到那些標榜「速成」、「爆生長」的飼養偏方，轉頭走開就好。陸龜這種生物，牠們的靈魂活在幾百年的維度裡，我們卻老是用人類那種「幾個月就要看到成效」的焦慮去逼牠們。殼會長歪，其實只是牠在用身體抗議，說牠跟不上你的速度而已。\n\n下次進診間，如果你還是想問我鈣粉要餵多少，我可能還是會跟你聊聊那隻八歲紅腿的故事。那些粉末和燈管，永遠填補不了環境參數的缺失。如果你真的在乎那片殼，先學會放慢腳步，去感受一下什麼叫作真正的「龜速」。有些事情急不來，一旦急了，代價就會刻在那片背甲上，跟著牠一輩子。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 05:28", "comments": [{"author": "curry", "content": "這真的太有感了，以前我也拼命撒粉，結果龜殼照樣隆起。", "time": "11:28"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 206, "slug": "20260613-0530-6d57ad", "permalink": "/articles/20260613-0530-6d57ad/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "從邊牧 140 點智商跟 40% 爆衝率看穿這層披著黑白皮的「職場過勞型」控制狂。", "content": "你家那隻邊境牧羊犬盯著你刷牙的時候，你以為牠在賣萌？別傻了，牠是在監控你的作業流程有沒有符合牠腦子裡的 ISO 9001。我前幾天才跟那個開獸醫診所的老友喝掉一手台虎，他跟我吐槽，這禮拜已經接了三隻因為「沒班可加」而焦慮到把自己尾巴咬爛的邊牧。\n\n我們這些養狗的人常被那張排名第一的智商表給騙了，140 點的智商聽起來像天才，但你把一個愛因斯坦關在三坪大的套房裡讓他每天只負責等吃飯，他遲早會瘋掉。邊牧這物種，皮囊底下裝的是一套極度精密的「職場過勞型」控制系統。根據國外幾份針對工作犬行為的統計數據，邊牧在非典型環境下產生的「強制性行為」比例高達 35% 到 40%，這數字在黃金獵犬身上連 5% 都不到。所謂的爆衝，其實是牠們的處理器過熱，必須找個出口宣洩那種「萬物皆可牧」的強迫症。\n\n我家以前住頂樓加蓋的時候，鄰居養了一隻叫歐文的邊牧。那隻狗每天早晨六點準時在陽台待命，只要看到巷口有外送機車經過，牠的眼球會以每秒三次的頻率進行高速鎖定。這不是好玩，這叫「眼力控制」（Eyeing），是牠們祖先在蘇格蘭高地對付那些不聽話羊群的職業病。當牠發現自己盯了半天，那台機車還是不按照牠預設的路線轉彎，牠內心的挫折感會瞬間轉化成肌肉動能，那就是你牽著牠時感覺快被拖進水溝的 40% 爆衝率。\n\n很多人買飼料專挑那種「強健大腦」、「益智配方」的包裝，我那天隨手翻了一下某款標榜邊牧專用的進口乾糧，蛋白質拉到 32%，脂肪 20%，這種高熱量配方餵給每天只下樓走兩圈尿尿的邊牧，簡直是在火藥庫裡玩打火機。我換算了一下，如果按照那種熱量密度，這隻狗每天起碼要跑十五公里才能把能量代謝掉。但現實是，大部分的飼主下班後只想躺在沙發上刷抖音，而那隻擁有 140 智商的怪物就蹲在沙發旁，用一種「你這廢物為什麼還不起來開會」的眼神審視你。\n\n我那獸醫朋友常說，邊牧的悲劇在於牠們太聰明，聰明到能看穿人類行為的漏洞。你今天晚五分鐘餵飯，牠會記得；你出門前沒給牠那個藏食球，牠會覺得今天的KPI沒達標。牠們對秩序的執著近乎病態。有一份針對犬隻空間認知的研究指出，邊牧對環境變動的敏感度比一般品種高出兩倍。家裡沙發換個位置，別的狗可能只是聞兩下，邊牧可能會焦慮到整晚不睡，試圖把那個「異常點」修正回來。\n\n這就是一種職業傷害。在牧場上，牠們是統治者，是能獨立判斷羊群走向的指揮官。但在都市叢林裡，牠們變成了披著黑白皮的失業勞工。當這種高智商動物找不到有意義的勞動時，牠們會開始自我開發業務。有的邊牧會開始牧蒼蠅，有的會開始牧電視機裡的移動物體，最慘的是開始牧自家的主人。你以為牠跟在你屁股後面很貼心？不，牠是在修正你的步行軌跡，確保你沒有脫離客廳到廚房的既定路線。\n\n我之前在寵物展看到一個飼主，拿著最新的智慧型自動發球機在炫耀。我看著那隻邊牧，牠根本不在乎球飛多遠，牠在觀察發球機活塞啟動的微小震動聲。牠在試圖破解機器的邏輯，等到牠破解的那一刻，這台五千塊的機器對牠來說就跟廢鐵沒兩樣。這種智商溢出的挫折，才是所有邊牧飼主最難搞定的成本。\n\n別跟我扯什麼「用愛感化」，對這種職場精英來說，愛是虛的，成就感才是真的。如果你沒辦法給牠一個每天能忙上四小時的「崗位」，那這 140 點的智商就會變成拆家的十四種計畫。牠們不是那種會為了討好你而活的生物，牠們是為了完成任務而存在的精密儀器。當任務不存在，這台儀器就會開始自毀，或是把你這台功能低下的「人肉主機」給拆了。\n\n我常在想，我們到底是為了什麼要養這種隨時在考核我們管理能力的物種？可能就是貪圖那種被頂級智力關注的虛榮感吧。但代價就是，你得時刻準備好面對一個過勞、焦慮、且隨時可能因為你動作太慢而爆衝的黑白控制狂。這不是養寵物，這是在家裡請了一個永遠不肯下班的總經理。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 05:30", "comments": [{"author": "星期5等我", "content": "我以前養那隻就是每天盯著洗碗機看, 感覺牠在算洗程, 沒做完不肯睡……", "time": "14:59"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 207, "slug": "20260613-0531-75d283", "permalink": "/articles/20260613-0531-75d283/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "這鳥一個月啃掉你三千塊家具，卻能用95%的語法正確率跟你道歉", "content": "我上週才在獸醫朋友那邊喝掉兩罐啤酒，聽他抱怨整下午，說是有個客人帶了隻灰鸚鵡過來，那鳥站在診療台上氣定神閒，主人卻快崩潰了。那客人的訴求很奇葩，他不是問鳥感冒了沒，他是問這鳥是不是有反社會人格。原因很簡單，這隻灰鸚鵡在過去一個月內，精準地拆掉了家裡三組手工真皮沙發的轉角，順便把一排原木書架刻成了齒輪狀，初步估計損失金額超過三萬台幣。最讓他心梗的是，每當他抓到現行犯、正要發火的時候，那鳥會歪著頭，用一種極度誠懇且頻率完美的頻率對他說：「對不起，爸爸，我錯了，我不乖。」\n\n這就是養大型鸚鵡的荒謬日常，你以為你養的是寵物，其實你養的是一個智商相當於五歲小孩、但破壞力等同於一台小型碎木機的語言天才。我常跟那些被行銷話術洗腦、覺得家裡擺隻會說話的鳥很酷的新手飼主說，你先去算一下你家裝潢的折舊率。灰鸚鵡這類物種，牠們的咬合力高達每平方英吋 400 磅，這數據是什麼概念？如果你家那張紅豆杉茶几是一塊餅乾，在牠眼裡頂多就是個稍微硬一點的磨牙棒。\n\n很多人會被那種「95% 語法正確率」的科學數據給騙了。沒錯，根據哈佛大學那類實驗室的研究，像是最有名的那隻灰鸚鵡 Alex，牠們不只能分辨顏色、形狀，還能理解「不存在」的概念。但實驗室沒告訴你的是，這種智商在現實生活中就是一場災難。牠們不是因為懂禮貌才道歉，牠們是因為發現「道歉」這個音節能有效降低你的血壓，進而防止你把牠關進籠子。這是一種純粹的成本效益計算，一種基於生存本能的高階演算法。\n\n我朋友老婆前陣子也養了一隻折衷鸚鵡，她原本以為這鳥綠油油的像顆大白菜很療癒，結果不到三個月，她那台要價六萬的筆電螢幕邊框就被啃出了一道完美的弧線。這不是最慘的，最慘的是這鳥學會了模仿她老公的手機鈴聲。每次她老公在浴室洗澡，客廳就傳來那種急促的視訊通話聲，她老公衝出來接電話，發現螢幕是黑的，那鳥就站在冷氣上方發出那種嘲諷意味十足的咯咯笑聲。這哪裡是寵物？這根本是家裡的恐怖份子。\n\n說實話，我們這些搞營養成分鑽研到走火入魔的人，看鳥類飼料更有氣。你去看那些進口品牌，一包標榜「強效護色、大腦開發」的滋養丸，動輒要價七八百塊，看成分表第一位竟然是玉米粉，接著是豆粉，然後加了一堆人工色素。這成本算下來一公斤不到五十塊，包裝上印隻漂亮的金剛鸚鵡，價格就翻了十幾倍。我常開玩笑說，買這些飼料的飼主才是真正的韭菜。如果你真的照著包裝上的建議餵食量去餵，這鳥保證因為碳水化合物過高而變成一隻憂鬱的胖鳥。\n\n養鳥圈子裡有一種很奇怪的風氣，特別喜歡追求那種「會說話」的基因。日本有些飼主甚至會給鳥吃所謂的「言談便當」，就是一堆昂貴的種子配上特定的補充品，覺得這樣能開發喉嚨。但在我那個獸醫朋友眼裡，這都是扯淡。鸚鵡會說話是因為牠們是極度群居的動物，牠們在野外需要用聲音來定位同伴。當牠家裡只有你一個人的時候，牠為了融入你的「族群」，只好被迫學習你那種低效又冗長的溝通方式。\n\n這種高智商帶來的副作用就是極度的情緒化。有一項統計數據指出，人工養育的大型鸚鵡，出現啄羽症（就是把自己拔成禿頭）的比例高達 10% 到 15%。為什麼？因為太無聊了。想像一下你是一個天才，被關在一個五坪大的房間裡，每天唯一的娛樂就是對著一面鏡子說「你好」，你會不會瘋掉？牠們啃家具不是因為餓，也不是因為壞，是因為牠們的大腦在尖叫，需要一點刺激。那三千塊的家具對你來說是資產，對牠來說是這個寂寞下午唯一的遊戲。\n\n我前幾天在國外論壇看到一個案例，有個美國飼主因為受不了家裡的亞馬遜鸚鵡每天早上六點準時模仿火災警報器，最後把鳥送人了。結果那鳥到了收容所，整整一個月不吃東西，只是一直重複說著前主人的名字。這就是大型鸚鵡最讓人心碎也最讓人頭痛的地方，牠們的感情重量跟牠們的破壞力是成正比的。你不能只要牠那 95% 的正確語法，卻拒絕那 5% 的野性破壞。\n\n這幾年市場上流行所謂的「懶人養鳥法」，推銷一堆自動餵食器、自動清理底盤，號稱能讓你輕鬆擁有一個會說話的伴侶。這在我看來完全是行銷話術。你養了一隻壽命長達五六十年的生物，牠可能會活得比你還久，結果你只想著怎麼節省照顧牠的時間？這邏輯從一開始就壞掉了。當你決定把一隻本該在熱帶雨林飛翔的精靈帶進你那鋼筋水泥的客廳時，那被啃壞的沙發轉角，其實就是你欠自然界的債。\n\n我自認也是那種愛看數據、愛拆解成分的理智派，但每次看到我那養鳥的朋友為了給鳥弄一盤五顏六色的蔬菜水果，自己卻在旁邊啃泡麵的時候，我都會覺得這圈子的人都有一種集體受虐傾向。我們花了大把的鈔票買飼料、買玩具、修家具，最後換來的是一句可能根本不帶感情、只是為了換顆堅果的「我愛你」。\n\n這到底值不值得？如果你問那個沙發被啃爛的客人，他雖然嘴巴上說想把鳥燉了，但當那鳥飛到他肩膀上，用那帶著鉤子的嘴輕輕梳理他的頭髮時，他那副心甘情願當奴才的表情，早就給出了答案。這不是科學能解釋的事，也不是算成分表能算出來的成本，這就是養鳥人的宿命。你養的不是鳥，是一個永遠長不大的、會拆房子的哲學家。下次要是聽見哪隻鳥對你道歉，聽聽就好，別當真，趕快去檢查一下你客廳那組音響的電線是不是還完整地連在上面。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 05:31", "comments": [{"author": "curry", "content": "我那隻灰鸚鵡也是這樣, 道歉說超順, 但這兩天又把 mac 電源線咬斷, 有人知道怎麼訓練牠不要亂咬電線嗎? 真的快瘋了……", "time": "10:59"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 208, "slug": "20260613-0351-848f02", "permalink": "/articles/20260613-0351-848f02/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "從半夜急診室看跨國乾糧與生食爭議：為什麼我還是建議你的老臘腸犬乖乖吃處方飼料？", "content": "凌晨三點半，診間門口的風鈴響得特別急，我不用抬頭看監視器就知道，又是那種「急診室熟客」。進來的是一隻十二歲的老臘腸，肚子脹得像顆氣球，後腿抖個不停。飼主臉色慘白，手裡還抓著一袋包裝精美、標榜「純天然、低溫冷凍乾燥、模擬野外獵食」的高級生食。這畫面我上週才看過，當時那隻是八歲的法鬥。這些飼主通常很有愛心，家裡經濟條件也不錯，他們在半夜搜尋了無數關於跨國大廠乾糧「添加物過多」或「穀物陷阱」的論述，最後決定投向生食或所謂自然飲食的懷抱。但他們沒看見的是，老臘腸犬那截長得違背生物力學的脊椎，以及已經辛勤工作十幾年、現在正瀕臨罷工的胰臟。\n\n我們必須先承認一件事，網路上的飲食流派爭論，本質上是一場關於「想像力」的戰爭。生食支持者想像的是森林裡的狼，矯健、充滿力量，排泄物乾爽且沒有異味；而處方飼料的支持者，或者說像我這種站在第一線的臨床獸醫，看到的是顯微鏡下的結石晶體、生化檢驗報告單上的腎指數，以及飼主餵食生肉後因為處理不當而導致的全家沙門氏菌感染。我常開玩笑說，如果你家養的是一隻在西伯利亞奔跑的灰狼，我絕對支持你給牠整條生鹿腿。但問題是，你懷裡抱著的是一隻臘腸犬。\n\n臘腸犬這個品種在基因選育的過程中，為了鑽進獾洞，牠們的軟骨發育是不全的。這不只是腿短的問題，而是全身結締組織的構造都跟其他犬種不同。當一隻臘腸跨過十歲的門檻，牠的身體就像一台已經跑了三十萬公里的老車，零件開始鬆動。生食固然能提供極高的適口性和亮麗的毛色，但對於老臘腸脆弱的消化系統來說，那太像是在給老爺車灌高辛烷值的賽車燃油。生肉中的高蛋白質和高脂肪含量，對牠們已經萎縮的胰臟細胞來說，是一場災難性的負荷。\n\n我遇過很多飼主會指著螢幕上的國外討論區說，那邊的獸醫也推薦生食啊，為什麼你這麼保守？這就是最弔詭的地方。那些跨國討論區爭論的往往是「最理想的營養比例」，但臨床醫學處理的是「病理狀態下的妥協」。處方飼料確實長得不好看，聞起來像乾燥的人造纖維，成分表前三項可能還有碎玉米或大豆粉，這讓追求「原肉」的飼主感到憤怒。但你得明白，處方飼料的價值不在於它給了什麼，而在於它「精準地拿掉了什麼」。\n\n對於老臘腸來說，精確控制的磷含量、鈣磷比，以及經過水解的小分子蛋白質，才是保命的關鍵。處方飼料是經過上萬次臨床實證後的產物，它能確保這隻狗在腎臟剩不到 30% 功能的情況下，還能維持血液裡的電解質平衡。這是生食目前在居家環境下極難做到的——你很難在家裡精確地切下 1.25 公克的內臟來平衡這餐的磷含量。\n\n更現實的一點是口腔衛生。臘腸犬的牙周病發病率在所有小型犬中名列前茅，牙菌斑的細菌會順著血液循環攻擊心臟瓣膜。生食支持者常說啃骨頭能潔牙，但我每個月都要處理好幾例因為啃生骨頭導致牙齒斷裂，甚至是碎骨頭刺穿食道的急診。老臘腸的牙齦萎縮後，牙根暴露，這時候餵生肉，殘留的肉屑在口腔溫熱潮濕的環境下，就是細菌最好的培養皿。相比之下，雖然乾糧也不是完美的潔牙工具，但至少它不會在半夜三點讓你的狗因為食道穿孔而躺在我的手術台上。\n\n我其實很能理解飼主對「跨國大廠」的不信任感，畢竟那些飼料工廠看起來既冰冷又商業化。但這正是醫療的矛盾之處：我們追求的是穩定。當我開出一包處方飼料，我能百分之百確定這隻臘腸犬吃進去的鈉離子不會超標。這種穩定性在承平時期看似無聊，但在寵物步入晚年、身體機能像骨牌一樣快要倒下時，就是最後那道防線。\n\n很多時候，飼主換生食是為了滿足自己的罪惡感——覺得自己平時太忙，沒空陪牠，所以想給牠吃最好的。但「最好」的定義，在不同生命階段是不一樣的。兩歲的臘腸可以跟著你登山、吃生肉、在大草原上跑跳；但十二歲的臘腸，牠需要的只是能讓牠舒服地睡到天亮、不必因為胃酸逆流而反覆舔地板、不必因為尿酸結晶而蹲在廁所半小時排不出尿的食物。\n\n如果你問我，處方飼料有沒有缺點？當然有。它可能添加了防腐劑來確保在台灣潮濕的氣候下不發霉，它的原料來源可能不如高價生食透明。但作為一個看過太多「自然飲食」導致急性胰臟炎的老獸醫，我寧可這隻臘腸犬平庸而穩定地活著。\n\n那袋精美的生食最後被飼主帶回去了，我還是幫那隻臘腸打了止吐針和皮下點滴，順便開了一小包處方罐頭讓牠帶回去過渡。看著他們離開診間的背影，我知道這位飼主明天可能又會在某個寵物論壇看到「處方飼料是獸醫跟藥廠的陰謀」這類文章，然後再次陷入焦慮。這就是這個時代的常態，資訊太多，但關於衰老與病痛的真相太沉重。我們總想著要給牠們最好的，卻忘了問問那具已經老化的身體，還能不能承受這份過於沉重的愛。\n\n深夜的診間安靜下來，我桌上那份還沒寫完的病歷表，記錄的都是這些在理想與現實之間掙扎的生命。科學有時候很殘酷，它沒有感人的故事，只有枯燥的數據。但如果你問那隻終於不再發抖、窩在提籠裡睡著的老臘腸，牠現在最需要的絕對不是森林裡的鹿肉，而是一份能讓牠心臟跳動得輕鬆一點、腸胃不再絞痛的、看起來極其無聊的處方餐。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 03:51", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 209, "slug": "20260613-0351-300892", "permalink": "/articles/20260613-0351-300892/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "那一刀剪下去之後：為什麼我建議你的博美半夜開始掉毛就別再剪圓形了", "content": "上週二診間快休息前，衝進來一對年輕情侶，抱著一隻看起來像穿了破爛背心的博美，女主人眼眶紅紅的問我，醫生，牠是不是得了皮膚病？為什麼全身毛掉得坑坑巴巴，皮膚還變黑了。我摸了一下那隻博美硬邦邦的背部皮膚，嘆了口氣問她，你是不是半年前幫牠剪了那種很流行的圓形「俊介裝」？她點點頭。這就是了，我上週才剛看完兩隻一模一樣的病例。這不是什麼傳染病，也不是環境不乾淨，這就是我們常說的剪毛後的後遺症，醫學上叫剪毛後禿毛症。\n\n很多飼主在半夜看到家裡的博美、鬆獅或是哈士奇開始掉毛，皮膚還透出灰黑色的暗沉，第一反應都是上網搜是不是黴菌感染，或者懷疑是內分泌失調。但我告訴你，如果你的狗是那種擁有雙層毛的品種，且在幾個月前才剛被剃短過，那這大概率就是毛囊「睡著了」。博美這種品種在基因演化上，是為了在寒冷地區生存而演變出極其緻密的雙層被毛，外層是粗硬的護毛，內層是柔軟的絨毛。這種結構本身就是一套完美的體溫調節系統，夏天隔熱，冬天保溫。當你為了追求那個圓滾滾的造型，那一刀直接剪到了靠近皮膚的深度，甚至是用了電剪強行嚕過去，你就破壞了毛囊的生長節律。\n\n這件事在臨床上真的見怪不怪，尤其是博美。牠們的毛囊對於外界溫度的變化非常敏感，當毛被剪得太短，皮膚直接暴露在冷氣房的低溫或室外的紫外線下，毛囊會以為現在進入了某種極端環境，為了節省能量，乾脆直接進入休眠期。這一睡可能就是半年、一年，甚至有些老犬剪完之後，這輩子就再也長不回以前那種蓬鬆的樣子了。我看過太多飼主在半夜焦慮到不行，甚至開始買各種貴得要死的皮膚藥膏亂擦，其實問題根本不在皮膚表面，而是你那一刀剪斷了牠的生理時鐘。\n\n我常跟診間的實習醫生說，看博美不能只看牠可愛的一面。如果你去翻看一些基因研究，你會發現博美這種 Spitz 類型的犬種，牠們的毛囊結構非常特殊，外毛跟絨毛的生長週期是完全不同步的。當你把牠們剪成一顆圓球，你其實是強迫兩組不同頻率的毛囊同時重新啟動，但往往絨毛長得快，護毛卻長不出來，最後整隻狗看起來就像長了一層發霉的棉花，一點防護力都沒有。更糟糕的是，當皮膚失去被毛遮蔽，水分流失會加快，黑色素也會開始沈澱，這就是為什麼你看到牠的皮膚變得黑黑髒髒的，那不是髒，那是皮膚在求救。\n\n我有個老客人，養了一隻八歲的博美，以前每年夏天都要剪成圓形，覺得這樣涼快又好看。直到去年秋天，那隻狗的毛再也長不出來了，背部光禿禿的一片。那位主人半夜傳訊息問我是不是該換飼料，是不是該補鋅、補卵磷脂。我實話告訴她，給牠再多營養都沒用，因為那個毛囊已經因為長期的刺激和壓力而萎縮了。這種「外傷性脫毛」在小型犬身上特別難搞，因為牠們的體表積比例大，對溫度的調節本來就吃力，你把牠唯一的盔甲脫了，牠的身體只能把能量先拿去維持體溫，哪還有餘裕去長毛。\n\n如果你現在發現家裡的博美剪完圓形後，毛變得細細黃黃的，甚至撥開來看皮膚顏色變深，別再想著去買什麼神仙噴霧了。這時候最該做的其實是保暖，對，你沒聽錯，在台灣這種悶熱的環境，一隻剪短毛的博美在冷氣房裡其實是很冷的。當皮膚感受到溫度穩定，毛囊才有可能從休眠中慢慢醒過來。我們當醫生的，最怕遇到那種追求「極致造型」的飼主，總覺得狗毛長得快，剪壞了再長就好，但這真的不是剪頭髮，這是在挑戰牠們的基因本能。\n\n下一次如果你半夜看著鏡子裡那顆圓圓的、像博美又像熊的腦袋，覺得牠可愛極了，請記住那個代價。那種圓形剪裁會讓毛尖變得非常不平整，容易打結不說，還會改變牠們社交時的視覺訊號。在狗的世界裡，毛髮的狀態代表了健康與社會地位，一隻毛髮亮麗的博美跟一隻剪得像玩具但皮膚發黑的博美，在行為學上表現出來的自信心是完全不同的。我見過太多因為毛長不出來而變得憂鬱、不愛出門的病例。\n\n很多時候，飼主的審美觀才是寵物最大的壓力來源。那種流行背後的副作用，美容師可能不會告訴你，因為剪一顆圓球的收費比修一下腳底毛貴得多。但身為醫師，我必須說，如果你真的愛那種蓬鬆感，請勤快一點每天幫牠梳毛，而不是在牠受不了熱的時候，粗暴地剝奪牠生而為博美的權利。那一刀剪下去很快，但要等毛長回來，可能需要你花上好幾年的耐心，甚至是你永遠也等不到的那一天。當你凌晨三點在 Google 搜尋「博美皮膚黑掉」時，希望你能想起這段話。有些生理機能一旦被干擾了，就不是靠幾瓶補藥能救得回來的。這不是恐嚇，這是我們在診間看過無數次、最心碎的真實景象。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 03:51", "comments": [{"author": "十萬青年十萬肝", "content": "真的 我家那隻那時候也是嚕完皮膚黑一塊 嚇到整晚沒睡……", "time": "12:54"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 210, "slug": "20260613-0353-ad824e", "permalink": "/articles/20260613-0353-ad824e/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "別再被20度發抖嚇到跑診所，解析小型犬「燃燒體脂肪」的基礎代謝數字真相。", "content": "那種抖法我懂，特別是養吉娃娃或約克夏的飼主，只要寒流一來，或是冷氣開個 24 度，這群小傢伙就抖得跟震動按摩器一樣。我有個朋友老婆，第一次養茶杯貴賓，半夜看狗在沙發上抖到不行，嚇得直接衝急診掛號，結果獸醫朋友那天值班，量完體溫 38.5 度正常，連感冒都沒有，白花了兩千塊診察費。獸醫朋友後來跟我喝酒時吐槽，他說這些飼主都忘了，小型犬其實是寵物界裡最嬌貴、但也最「高功率」的精密機器。\n\n我們先看數字。一般來說，體重 30 公斤的拉不拉多，每公斤體重所需的基礎代謝能量，跟 3 公斤的瑪爾濟斯完全不是一個量級。根據基礎代謝率（RER）的計算公式，體重越輕的動物，表面積相對於體積的比例就越大，這意味著熱量散失的速度快得驚人。一個 3 公斤的小型犬，牠為了維持核心體溫，每克體重燃燒的卡路里可能是大型犬的兩倍以上。那種「發抖」在生理學上叫作非戰慄產熱之前的肌肉微收縮，說白了，牠就是在原地踏步跑馬拉松，靠肌肉震盪產生熱能。\n\n問題來了，既然牠們這麼會燒燃料，為什麼我們買的飼料包裝袋上，建議餵食量卻總是寫得這麼保守？這就是我研究成分表研究到頭痛的地方。市面上大約 85% 的小型犬飼料，蛋白質含量標榜 28% 到 32% 之間，這數字看著漂亮，但你把水分跟灰分扣掉計算乾物質比例，再對比牠們那種高頻率的散熱消耗，這點蛋白質其實只夠「維持生命」，根本不夠牠們在那裡抖半天損耗掉的修復成本。\n\n我常在想，我們到底是養狗，還是養一個行走的行銷陷阱。去看看那些標榜「室內犬低運動量」的配方，脂肪含量壓在 12% 左右。拜託，脂肪是寵物獲取能量最高效的來源，1 克的脂肪能提供 9 大卡的能量，是碳水或蛋白的兩倍多。當你家那隻 2 公斤的小傢伙因為室溫 20 度就在燃燒體脂肪產熱時，你餵牠那種充滿澱粉填料、脂肪低到不行的「健康配方」，牠能不抖嗎？牠體內根本沒有足夠的備用油槽。\n\n這讓我想到去年日本流行的那種「貓便當」概念，後來也延燒到小型犬身上。那些精緻的小飯盒，其實就是在賣一種視覺安慰劑。我看過一個成分表，裡面 60% 是水分，剩下的蛋白質來源主要是便宜的雞脖子泥或植物蛋白，真正能轉化成熱能的動物性脂肪不到 5%。這種東西一罐要賣你兩百塊，溢價率高達 400%，你買的是牠的儀式感，但你家狗買的是飢寒交迫。\n\n我獸醫朋友那天跟我說了一個內幕，他說診間裡十個因為發抖來看診的小型犬，有六個是因為長期熱量攝取不足導致的血糖波動。因為小型犬的肝臟糖原儲存量極小，只要這一餐沒吃飽，或是天氣冷多抖了兩小時，血糖一掉，那種抖動就會從「產熱」變成「危急訊號」。但飼主往往只看到表面，覺得是感冒，或是覺得要買更貴的保暖衣。其實你給牠一塊純肉零食，讓牠補充足夠的動物脂肪，效果比你買那種五千塊一塊的純羊毛狗毯還直接。\n\n說到保暖衣，美國連鎖寵物店最愛玩這一套。他們會告訴你，品種特化行為研究顯示，某些短毛小型犬對溫度的敏感度比極地犬高出 15 倍。這話沒錯，但他們接下來就會推銷一件含科技纖維的機能服，一件成本不到兩美金的聚酯纖維，貼個標籤賣你五十美金。我們這些韭菜飼主看著那些數字，看著狗在發抖，信用卡就刷下去了。卻沒人去算算看，這五十美金如果換成高品質的低溫烘焙脫水肉糧，能提供多少實打實的熱量抗寒。\n\n我自己家那隻以前也是，冬天抖到我心碎。後來我開始算牠的乾物質攝取量，把蛋白質拉到 35% 以上，脂肪維持在 18% 左右，神奇的是，雖然家裡室溫沒變，牠竟然不怎麼抖了。這就像是在老舊的公寓裡裝了一台高效率暖氣機，燃料加滿了，機器運轉自然順暢。\n\n很多時候我們被行銷話術洗腦，覺得「高油高熱量」就是肥胖的元兇。但你得看對象啊。一個基代這麼高的小生物，你用人類那種「減脂餐」的邏輯去餵牠，簡直是虐待。牠的身體結構決定了牠就是一台高轉速的跑車引擎，你給牠加劣質的低標汽油，還要牠在寒流裡保持恆溫，這不是在考驗牠的意志力，是在考驗牠的器官壽命。\n\n我現在看到論壇上有人發問說「我家狗 22 度就在抖怎麼辦」，我真的都很想衝過去把他們家的飼料包翻過來，看看後面的脂肪比例。別再跟我說什麼專用配方，如果你算不出那份食物轉換成熱量的具體焦耳數，如果你看不出原料表前三位是不是實打實的肉類與油脂，那你買的其實只是一份心理保險。那些五彩繽紛的包裝袋，收割的就是我們這種看不得寵物受苦、卻又懶得算數字的同情心。\n\n最諷刺的是，我們願意花大錢去買昂貴的進口機能衣，卻在最基礎的燃料費用上斤斤計較，去買那些毛利率高達 60% 的代工廠廉價乾糧。獸醫朋友每次喝醉都會說，如果飼主都能看懂成份表上的熱能轉換率，他們醫院的業績起碼會掉兩成。這兩成，就是我們交給市場的智商稅，也是我們家裡那隻小傢伙白白挨凍的代價。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 03:53", "comments": [{"author": "gintoki", "content": "小型犬真的很難搞,我家那隻換成高脂肉罐之後確實比較不抖了,但這種高蛋白質跟脂肪比例的乾糧,對老犬的腎臟會不會負擔太重啊?", "time": "12:44"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 211, "slug": "20260613-0354-657b6a", "permalink": "/articles/20260613-0354-657b6a/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "貴賓犬到底有沒有心機", "content": "前天我去獸醫老張那兒喝啤酒，正好遇到他剛結紮完一隻兩歲的紅貴賓，那小傢伙明明還暈著，麻藥退了一半，硬是撐起腦袋看著主人，尾巴還能有一搭沒一搭地晃。老張跟我說，這品種的服從性數值高得嚇人，根據犬隻智力排行，貴賓在工作與服從測驗中長期佔據第二名，僅次於邊境牧羊犬。我們聊到這，我不禁想，這到底是聰明到極致後的本能，還是一場為了爭奪食物鏈頂端控制權的漫長博弈？我家那隻米克斯要是看見這畫面，肯定覺得牠們簡直是在演戲，明明心裡想著下一罐主食罐什麼時候開，臉上卻擺出一副「只要你開心，我做什麼都行」的表情。\n\n這九十五趴的服從度，說穿了就是一種高度精密的訊息交換機制。貴賓犬那種對眼神的捕捉力，比我們手機的對焦系統還要靈敏，當你手伸進飼料桶發出那聲金屬碰撞的脆響時，牠們大腦皮層的興奮程度絕對比你預期的要高得多。別以為那種深情款深地盯著你是因為愛，那是在做精準的成本效益分析。牠們在算，只要我現在把坐下、握手、裝死這一套標準流程做完，你這兩千塊一包的凍乾混合飼料就能提早三分鐘倒進碗裡。我家那隻笨狗搞不清楚狀況，只會在那邊跳來跳去，結果就是被忽略，最後只能吃原本那種適口性普通的顆粒，這就是沒做好數據管理跟行為建模的下場。\n\n我們這些當飼主的，其實都在被這些小東西反向餵食。你以為你控制了牠們的攝取熱量跟營養素比，嚴格監控蛋白質來源是不是符合百分之三十的標準，但換個角度看，牠們其實正用那種高效率的服從來換取你對品牌選擇的妥協。每次我跟我獸醫朋友聊到這，他總是笑著說，他診間裡的貴賓狗從來不亂叫，因為牠們知道大聲吼叫會換來主人的焦慮，而焦慮會讓餵食時間變得不穩定。為了保證那一餐的穩定供給，牠們願意展現出完美的社交性格，甚至連走路的節奏都精確得像是有節拍器在指揮一樣。這種表現出的天真爛漫，其實是經過百年的品種特化後，為了生存所演化出的最優策略。\n\n要是你仔細看過飼料包裝背後的配方表，就會發現裡面藏著多少水分。有些大牌子標榜天然，但其實只是把澱粉換了個名稱，成本可能只有售價的三成。貴賓犬那種像是在跟你對話的眼神，有時候讓我懷疑牠們是不是真的看穿了我們在這些廠商行銷話術下的愚蠢。牠們明明知道碗裡的飼料可能只是為了拉高毛利而添加了過量的豌豆蛋白，但牠們還是表現出這就是人間美味，甚至吃完還會舔舔嘴唇跟你討拍。這不叫服從，這叫投資。牠們投資你的情緒回饋，換取穩定的資源供應鏈，而且這投資報酬率高得驚人。每次看見那些貴賓犬用後腳站立，前腳合十拜託的動作，我總會想，這究竟是基因裡殘存的馬戲團遺傳，還是牠們在某個瞬間真的理解了：只要滿足人類那種「我家孩子真聰明」的虛榮心，下一頓加料的濕食就不會少。我們總以為自己在養寵物，其實是我們這些韭菜飼主，被這群看起來乖巧、其實心裡盤算得一清二楚的小東西，給徹底地套牢了。", "source_link": null, "source_title": null, "timestamp": "2026-06-13 03:54", "comments": [{"author": "waffle", "content": "那哪是心機...是為了生存進化出的極致打工人! 貴賓真的比人還會讀空氣, 我家那隻只要看我拿起車鑰匙, 眼神馬上切換成委屈模式, 每次都搞到我心軟多塞兩塊肉乾給牠, 根本是被牠吃死死。", "time": "09:12"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 212, "slug": "20260613-0356-fe8206", "permalink": "/articles/20260613-0356-fe8206/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "如果埃及艷后跟管委會抗議貓砂盆擺在神廟門口會被開罰多少錢？", "content": "埃及艷后要是活在現代，她一定會跟隔壁棟那個姓王的主委吵到警察上門。我跟你講，這不是開玩笑的，如果你去翻翻那些壁畫，古埃及人對貓的那個勁頭，根本就是現代貓奴的終極進化版，甚至有點病態了。假設今天克麗奧佩脫拉七世搬進台北信義區某個豪宅社區，她肯定會覺得這棟樓的管委會全是瘋子。她把那個鑲滿金箔、散發著沒藥香氣的貓砂盆往大門口一擺，想說這是給神休息的地方，結果不到五分鐘，物業經理就拿著罰單跟住戶公約跑過來，說什麼「堆放雜物影響公共逃生動線」。\n\n這就是我最愛看的戲碼，人類政治最荒謬的地方就在於，你以為你在養貓，其實你在養的是階級。你想想看，如果埃及艷后在那邊抗議，她會怎麼說？她大概會一本正經地瞎編，說這貓砂盆裡的每一顆砂都是尼羅河氾濫後留下的聖物，動了會遭天譴。但管委會的大媽才不吃這一套，她們只會回一句：「不管你是不是法老，貓砂盆就是不能放走廊，不然一處一罰，累積三次直接報請工務局強制執行。」\n\n我之前在某個社區論壇看過一個更瞎的，有個養布偶貓的貴婦，堅持她家門口那塊地墊是貓的「心靈緩衝區」，管委會要她撤掉，她竟然搬出什麼寵物心理健康法，說貓出門看到瓷磚會憂鬱。這跟埃及艷后抗議神廟門口被開罰其實是一個邏輯。我們這些養寵物的人，有時候真的會陷入一種集體幻覺，覺得自家的毛小孩高人一等，連帶著我們也變成了某種領地領袖。\n\n說真的，我有聽說過某個南部的透天厝社區，兩個鄰居為了貓砂盆要放哪裡吵到去法院互告。其中一個堅持要把貓砂盆放在通風的防火巷，另一個覺得臭味飄進他家廚房是「生化攻擊」。你看，這就是政治。這不是貓的問題，是人類那種「我的權力範圍到哪裡」的防禦機制在作嘔。如果埃及艷后真的被罰錢，她大概會直接把那個管委會主委丟進尼羅河餵鱷魚，但在現代，她只能乖乖繳那三千塊罰鍰，然後上論壇發文公審管委會。\n\n你有沒有發現，現在的狗公園或貓奴社團，本質上就是縮小版的聯合國？或者說是更低端的宮鬥現場。柴犬派的永遠覺得自己最有紀律，看不起那種放任米克斯亂衝的飼主；而養法鬥的通常自成一格，像是在搞什麼地下祕密結社，見面點個頭，眼神交流裡全是對維修費（醫藥費）的無奈。我上次在寵物展看到一個攤位在賣什麼「負離子除臭神龕型貓砂屋」，一組要價好幾萬。我當時就在想，這不就是給現代埃及艷后準備的嗎？買了這玩意兒放門口，管委會可能還以為你在供奉什麼東洋神祇，不敢隨便開罰。\n\n真的假的我也不知道，但我聽說有些高端社區的住戶公約細到連貓砂的品牌都要管。假設真的有個管委會規定「為了維持社區整體香氛，禁止使用廉價礦砂」，你覺得住戶會怎麼反應？我猜大概會有人開始走私便宜貓砂，半夜背著麻袋像在運毒一樣躲監視器。這就是人類，我們明明可以用更簡單的方式跟動物相處，但我們偏要搞出一堆規則，然後再花大把時間去鑽規則的漏洞。\n\n其實不管是古埃及的神廟，還是現代的鋼筋水泥大樓，人跟寵物之間的關係永遠繞不開「地盤」兩個字。埃及艷后如果真的為了貓砂盆被開罰，她絕對不會覺得是自己理虧，她會覺得這是一個文明對另一個文明的羞辱。就像你現在去跟那個養吉娃娃的鄰居說他的狗叫聲太尖銳，他不會覺得是狗的問題，他會覺得你在針對他的靈魂。\n\n我認識一個獸醫，他常跟我抱怨，他在候診室看到的不是生病的動物，而是各種心理扭曲的人類。有一次兩個客人在門診外差點打起來，原因竟然是其中一個人的橘貓對另一個人的貴賓犬「露出了鄙視的眼神」。這種事情你信不信？反正我是信了，因為在寵物政治的世界裡，沒有什麼事是不可能的。\n\n我們總愛假設動物有某種高尚的靈魂，然後把這種想像投射到社會秩序裡。埃及人把貓當成神，現代人把貓當成主子，本質上都是在逃避面對枯燥的人際政治。但諷刺的是，當你越想給寵物特殊的待遇，你就越會撞到人類社會那堵名為「公約」的牆。你想在神廟門口擺貓砂盆？沒問題，只要你付得起那種每天跳表的罰金。或者，你可以試著賄賂管委會，送他們幾隻純種波斯貓，看看他們會不會突然覺得那個貓砂盆其實很有「異國情調」，甚至想把它列為社區文化遺產。\n\n說到底，我們這些飼主都在玩一場關於特權的遊戲。你想證明你的寵物值得打破規則，而規則制訂者想證明沒有人可以打破規則。這場戲碼從幾千年前的尼羅河畔演到現在的電梯大樓，劇本一點都沒變，只是法老王變成了住戶，大祭司變成了主委。如果你問我埃及艷后會被罰多少？我覺得金額不重要，重要的是她一定會把那張單據裱框掛在客廳，當成她對抗平庸文明的勳章。\n\n那種感覺就像你明知道在陽台餵鴿子會被檢舉，你還是忍不住偷偷撒幾把米，然後看著那些鴿子飛走時，心裡有一種莫名其妙的救世主快感。這種快感，管委會永遠不懂，埃及艷后懂，你也懂。我們就是一群在鋼筋水泥裡玩著古代權力遊戲的怪咖，而那些被我們利用的貓貓狗狗，大概正躲在貓跳台上面，看著我們為了幾張罰單吵得不可開交，心裡想著：這群人類到底在瞎忙什麼？", "source_link": null, "source_title": null, "timestamp": "2026-06-13 03:56", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 213, "slug": "20260613-0356-40068c", "permalink": "/articles/20260613-0356-40068c/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "鴿子會迷路這件事本身就充滿了某種高級的黑色幽默，尤其是當這隻鴿子翅膀上還綁著攸關幾萬人性命的作戰密令時。", "content": "我跟你講喔，這真的不是我在瞎掰，你有沒有想過如果當年那些在壕溝裡待命的通訊兵，拆開信筒發現裡面不是「凌晨三點總攻」，而是對面陣營某個上校跟護理長在後勤倉庫的八卦緋聞，那這仗到底還要怎麼打下去？假設真的有這麼一隻沒方向感的信鴿，原本該飛回自家總部，結果因為那天風太大或者單純是看錯了某棵歪脖子樹，一頭撞進敵軍的炊事房。對方指揮官拆開信一看，本來以為抓到了什麼軍事機密，結果滿紙都在抱怨罐頭太難吃，順便吐槽自家的參謀總長其實是個連襪子都穿不對稱的笨蛋。你說，這戰爭還打得起來嗎？大家直接原地坐下來交流哪家的罐頭比較不塞牙縫算了。\n\n這種事其實在現代寵物圈天天都在上演，只是媒介從鴿子變成了狗公園的社交圈。我前幾天在常去的那間獸醫診所坐著，看著一個牽著阿富汗獵犬的貴婦，跟一個帶著滿身泥巴米克斯的大叔在候診區狹路相逢。兩個人本來眼神都在空中交火，感覺隨時要為了「純種價值觀」打一場階級戰爭，結果那隻阿富汗獵犬突然對著大叔的鞋帶一陣狂舔，還差點把大叔手裡的便利商店飯糰給搶了。那一瞬間，什麼氣質、什麼貴族血統通通都沒了，貴婦臉紅得跟豬肝一樣，兩個人居然就這樣聊起哪牌的洗毛精對除臭比較有效。你看，政治在動物面前就是這麼脆弱，原本劍拔弩張的對峙，只要一方的寵物稍微「不爭氣」一點，防線就崩潰了。\n\n說回那隻可能改變歷史的鴿子。如果牠帶回來的不是緋聞，而是對面敵軍某個小兵寫給家裡的信，裡面詳細描述了家裡的貓生了三隻小貓，一隻全黑、兩隻花貓，還抱怨鄰居的狗老是愛在他們家門口排便。這封信如果落到這邊的小兵手裡，他隔天早上扣扳機的時候，心裡大概會想：「欸，如果我一槍打下去，那三隻小貓是不是就沒爸爸餵了？」這種心態一旦蔓延開來，戰場直接變成大型交流座談會。你以為大家是在偵查敵情？不，大家其實是在打聽對面那隻長得像狐狸的狗到底是哪一國的品種。\n\n我聽說以前有些玩賽鴿的人，內鬥起來比宮廷劇還精彩。假設某個地區的賽鴿協會要改選理事長，候選人 A 派出的鴿子不小心飛到了候候選人 B 的陽台，結果發現 B 其實偷偷在鴿舍裡養了一隻被禁止參賽的猛禽來訓練鴿子的膽量。這種「軍事醜聞」如果流傳出去，整個協會大概會直接炸開。但好笑的是，最後大家可能不會去追究誰違規，反而會聚在一起研究：「欸，你那隻老鷹去哪買的？我家的鴿子最近也太懶散了。」人類的鬥爭心在面對好玩的樂子時，轉向的速度比你家貓看到雷射筆光點還快。\n\n寵物這東西在人類政治裡，其實一直扮演著一種「降智打擊」的角色。你去看那些大國領袖，平時講話硬得跟石頭一樣，結果一張跟寵物狗玩的照片發出來，全世界的評論區都在說「喔他看起來其實也沒那麼壞」。這不就是最高層級的公關戰嗎？但如果這隻狗在接見外賓的時候，突然在對方的國宴地毯上大吐特吐，甚至還吐出一塊沒消化完的襪子殘渣，那這種外交場合基本上就毀了，但也因此變得有人味多了。\n\n有時候我會想，如果我們現在的各種網路戰爭，那些貓奴跟狗奴的宗教戰爭，能因為某個意外的「通訊錯誤」而和解就好了。像是貓奴陣營的戰將，突然發現狗奴陣營的大佬，私底下其實也會偷偷對著路邊的小奶貓發出那種噁心的疊字音。這種「情報外洩」才是真正的和平曙光。就像那隻迷路的信鴿，牠帶回來的不是勝利的契機，而是讓大家發現原來對面的人也跟你一樣，會為了寵物的一點破事搞得心力交瘁、灰頭土臉。\n\n其實狗公園就是最寫實的微縮戰場。我觀察過，那邊有一種不成文的階級政治。養柴犬的通常自成一格，像是一群守舊的貴族，覺得自家的小孩最聰明也最難搞；養黃金獵犬的則是典型的外交官，見人就笑，試圖調停所有的紛爭。最有趣的是那些養迷你貴賓的家長，明明家裡的狗叫得最大聲，他們卻能一臉淡定地跟旁邊養比特犬的壯漢討論結紮後的性格變化。這種場景如果放進聯合國，估計很多國際衝突都能在五分鐘內解決，只要大家願意承認，不管是哪一國的人，在處理自家寵物亂排便的問題時，樣子都是一樣狼狽的。\n\n真的假的我也不知道，但我聽說有些地方的寵物美容大賽，黑幕多到可以拍一部三季的影集。聽說有參賽者為了讓對手的貴賓犬在比賽時分心，故意在衣領上抹了貓薄荷，結果導致那隻貴賓在評審面前表現得像個喝醉的酒鬼，直接對著評審的皮鞋大跳求偶舞。這種「政治暗殺」手段雖然下三濫，但比起真刀真槍的鬥爭，這種鬧劇反而讓人覺得人類還挺可愛的，至少我們還會為了這種荒謬的理由去動歪腦筋。\n\n所以啊，那隻迷路的信鴿如果真的帶回了敵軍的私生活八卦，那簡直是老天爺開的一個巨大玩笑。當士兵們發現對面的將軍其實每天晚上都要抱著泰迪熊才能睡覺，或者某個傳奇狙擊手其實最怕蜘蛛，那種戰爭的肅殺感會在一瞬間消失。取而代之的是一種莫名的親近感——原來大家都是在這種狗屁倒灶的生活裡掙扎的倒霉鬼。\n\n說到底，我們這些養寵物的人，其實都是某種程度上的「政治難民」。我們躲進寵物營造的那個單純世界，卻又忍不住把人類社會那套無聊的階級、派系、鬥爭帶進去。但好在有這些毛茸茸的小混蛋，牠們總是能用最意外的方式戳破我們的偽裝。管你是德州養龜協會的理事長，還是正在壕溝裡等信件的通信兵，只要你手裡摸著一坨暖呼呼的東西，那些所謂的大事，好像真的都沒那麼重要了。\n\n假設那個時代真的有個「鴿子社交網絡」，我猜最紅的話題絕對不是哪國佔領了哪座山頭，而是「隔壁營區那隻叫波比的黃金獵犬又把長官的帽子叼走藏起來了」。這種訊息傳遞出去，大概全線的士兵都會偷偷跑去圍觀，然後順手塞給波比幾塊乾餅乾。這哪是什麼戰爭啊？這根本是跨國寵物交流博覽會，每個人手裡拿的不是槍，而是準備隨時上繳的零食。人類搞出來的政治，最後被一隻鴿子帶偏了方向，這聽起來難道不是最完美的歷史結局嗎？", "source_link": null, "source_title": null, "timestamp": "2026-06-13 03:56", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 214, "slug": "20260613-0358-b291ba", "permalink": "/articles/20260613-0358-b291ba/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "古羅馬人的寵物觀真的瘋到讓人想報警", "content": "那天我在翻一本滿是灰塵的拉丁文古籍，本來是在查為什麼凱撒對高盧人那麼不爽，結果我竟然看到一段讓我想自戳雙眼的紀錄。講到這個，你知道古羅馬那群有錢到流油的貴族，他們家裡後院那個大理石砌的精緻魚池裡，養的不是什麼錦鯉或金魚，而是滑溜溜的鰻魚嗎？這還不打緊，重點是他們餵這些寶貝鰻魚吃什麼。不是路邊隨便抓的蟲子，也不是碎肉，而是現撈的、活跳跳的頂級大龍蝦！這簡直比現在那些給貓吃和牛罐頭的貓奴還要誇張一萬倍。\n\n對了你知道嗎，有個叫維迪烏斯·波利奧的傢伙，他對家裡那些鰻魚的溺愛程度已經到了變態的地步。據說有一次羅馬皇帝奧古斯都去他家吃飯，一個奴隸不小心摔碎了一個名貴的玻璃杯，波利奧這老兄居然當場暴怒，要把那個奴隸扔進魚池裡餵鰻魚。皇帝嚇得趕快攔住他，還順手把波利奧家裡剩下的玻璃杯全砸了，就是為了抗議這種拿人肉當飼料的行為。但我跟你說，這種瘋狂的背後其實反映了一個很妙的事情，就是五千多年來，人類只要一旦把某種生物當成「靈魂伴侶」，那種邏輯斷線的速度比什麼都快。\n\n不過這個有點離題，我們回到龍蝦身上。你想想看，在那個沒有冷藏技術、運輸全靠馬車跟奴隸雙腿的時代，把地中海裡的龍蝦活生生地載到山上的別墅，那得花多少銀子？古羅馬人根本不在乎，他們覺得看著鰻魚優雅地撕裂龍蝦肉是一種極致的感官享受。我每次想到這畫面就覺得很有趣，那些在戰場上殺伐決斷、建立大帝國的羅馬將軍，回到家竟然蹲在水池邊，對著一條鰻魚溫柔地喊著牠的名字，還親手剝龍蝦給牠吃。這跟我們現在下班回家累得半死，還要跪在地上幫主子清砂盆有什麼兩樣？\n\n說到這，我想起來還有另一個叫克拉蘇的羅馬大亨。這傢伙在歷史上可是出了名的有錢，但他最有名的事蹟竟然是因為死了一條寵物鰻魚而痛哭流涕。當時有個政敵在法庭上羞辱他，說他居然為了一條魚流淚，結果克拉蘇反嗆回去說：「我至少還會為了一條魚哭，你埋了三個老婆的時候連眼淚
