 "naspit_scores": null}, {"id": 57, "slug": "20260630-0645-9c6399", "permalink": "/articles/20260630-0645-9c6399/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "半夜那種像小狗的吠叫不是在求救，但你如果現在去抱他，就是在親手毀掉你未來五年的睡眠。", "content": "半夜三點被那種短促、帶點委屈又像是在求救的吠叫聲吵醒，你的第一反應通常是從床上彈起來，心跳加速，腦袋裡閃過一百種恐怖畫面：是不是卡住了？是不是哪裡痛？還是牠看到了什麼我們看不見的東西？我上週三才剛處理完一個案例，那是一位養柴犬的林小姐，她黑著眼圈衝進診間，說她已經連續兩週沒睡好，因為她家那隻才六個月大的小朋友，每天凌晨兩點準時發出那種聽起來快要斷氣的哀鳴。林小姐每次都以為出了人命，衝過去抱、去摸、去安慰，結果換來的是更嚴重的半夜大合唱。\n\n我跟她坐在診間，看著那隻在診檯上裝得一臉無辜、還在試圖舔我聽診器的柴犬，我直接跟她說，妳這不是在救牠，妳是在親手把自己未來五年的睡眠品質送進墳場。這話聽起來很狠，但這是每個家庭獸醫最想對半夜驚慌失措的飼主說的實話。我們要先搞清楚一件事，除非你的狗有嚴重的分離焦慮症病史，或者牠正處於癲癇發作這種極端情況，否則那種規律、有節奏感、聽起來像是在「討價還價」的吠叫，在本質上跟求救完全沒關係。那是一種溝通，更精確地說，那是一種測試。\n\n從遺傳學的角度來看，狗的祖先在野外為了生存，必須學會利用聲音來定位同伴。但家養犬在幾千年的馴化過程中，特別是像柯基、貴賓或是一些小型梗犬，牠們的發聲基因座被刻意強化了。這不是為了讓牠們去森林裡打獵，而是為了跟人類互動。這些品種的社交依賴度極高，牠們的腦部構造對「回應」這件事非常敏感。當牠在半夜發出一聲試探性的吠叫，而你翻個身、開了燈，甚至只是隔著房門喊了一聲「乖，別吵」，對牠來說，這就是一次成功的捕獵。牠捕獲了你的注意力，這個獎勵比什麼肉條都還要讓牠興奮。\n\n我以前自己養第一隻拉不拉多的時候，也犯過這種錯。那時候我覺得牠剛換環境，半夜叫得那麼淒厲，不過去抱一下簡直是虐待。結果呢？牠學會了只要我一關燈，牠就開始練習牠的歌喉。那不是因為牠害怕黑暗，是因為牠知道只要牠持續發出那個音頻，那個溫暖的人類熱源就會出現。這就是行為學裡最典型的正增強。\n\n很多人會問，難道牠真的不痛嗎？你要觀察的是行為的連續性。如果一隻狗真的因為身體不適而半夜哀鳴，那通常會伴隨著頻繁的換位置睡、喘氣，或者是不斷變換姿勢試圖緩解疼痛。如果牠是站在籠子邊，或者是對著你的臥室門口，眼神清亮、尾巴甚至還帶點期待的擺動，那牠的身體結構百分之百沒問題，有問題的是牠對你的控制欲。\n\n特別是像博美或約克夏這類品種，牠們的骨骼結構雖然嬌小，但神經系統非常發達，對於周遭環境的變動極其敏感。牠們能在幾毫秒內判斷出你的呼吸聲變了，知道你醒了。如果你在這個當下推開房門，把你那溫暖的懷抱送上去，你就是在告訴牠：沒錯，這個頻率是對的，明天請繼續。\n\n我常跟飼主說，半夜的這種對峙是一場心理戰。這不是叫你冷血，而是要你學會鑑別。如果你的狗平時食慾正常、排便規律、走起路來沒有任何跛足或重心偏移，那麼半夜那幾聲像小狗一樣的委屈吠叫，就是牠在對你下達指令。你要是投降了，那種「只要我叫，主人就會來」的制約會變得像鋼筋混凝土一樣堅固。等牠到了三歲、五歲，甚至更老的時候，這種行為會演變成一種頑固的生理時鐘。到時候你想改？那可能得花上幾個月甚至半年的時間，伴隨著鄰居的投訴信跟你的神經衰弱。\n\n很多人擔心不理牠會不會造成心理創傷。其實狗的韌性比我們想像中強得多。牠們是非常現實的機會主義者，當一個行為持續產生不了預期的回報，大腦裡的獎勵機制就會慢慢萎縮。這在生物學上叫作「消退」。消退過程中最痛苦的是那個「爆發期」，也就是當你決定不理牠的第一個禮拜，牠會叫得比以前更慘、更響、更像是在受刑。那不是因為牠更痛苦了，是因為牠在加大賭注，想看看那個舊的按鈕是不是壞了，要多按幾次才有反應。\n\n我有個老客人，養了一隻快十歲的米克斯，到現在半夜還要人陪睡。那位飼主說她這十年沒出過國，因為沒人受得了那隻狗半夜的動靜。這就是代價。當你在凌晨三點聽著那種心碎的聲音，手已經摸到門把時，請先想一下，你是想要這五分鐘的安靜，還是想要未來五千個夜晚的平靜？\n\n有些事情在診間可以靠藥物或手術解決，但這種半夜的角力，唯一的藥方只有飼主的忍耐力。下次當你在黑暗中聽到那種聲音，試著把被子蒙過頭，冷靜地數一下牠叫的頻率。你會發現，那通常很有規奏，甚至帶著一種試探性的停頓。牠在等，等那個開門的聲音。如果你沒開門，牠可能會氣餒地轉個身，重新把自己捲成一顆球。那個瞬間，才是牠真正學會獨立、學會與這個家和諧共處的開始。\n\n所以，把你的同情心先收回保險箱裡。這不是冷漠，這是身為一個負責任的飼主必須具備的理性。如果你現在妥協了，你不是在愛牠，你是在把自己變成牠的二十四小時情緒提款機。這種關係對人或對狗來說，其實都是一種慢性的折磨。等到天亮，當你看到牠神采奕奕地搖著尾巴向你跑來，你就會慶幸昨晚自己忍住了那個衝動。畢竟，一個能安穩睡覺的飼主，才有力氣帶牠去草地上奔跑，而不是在每個凌晨三點對著天花板嘆氣。", "source_link": null, "source_title": null, "timestamp": "2026-06-30 06:45", "comments": [{"author": "pizza", "content": "真的 以前心軟去抱過一次...\n後面直接被制約 3 個月\n現在都裝死沒聽見", "time": "15:08"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 58, "slug": "20260630-0645-35eeda", "permalink": "/articles/20260630-0645-35eeda/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "看著這堆白色泡沫先別急著噴錢，三招教你區分這是單純胃酸還是要命的腸阻塞。", "content": "半夜三點看到貓狗對著地板一陣抽搐，接著吐出一攤帶泡的黃水或白沫，那種聲音在寂靜的客廳裡聽起來像電鑽一樣扎耳。我敢打賭，這時候你手上的手機螢幕一定開著 Google，搜尋列打著「貓 吐白沫 沒精神」或是「狗 嘔吐 顏色」，然後被那些說可能是傳染病、可能是中毒、可能是腎衰竭的搜尋結果嚇得心跳比家裡的寵物還快。我上週二凌晨才接過一個電話，飼主聲音都在抖，說他家那隻才五個月大的法鬥吐了兩次白沫，問我要不要立刻衝急診。我聽他描述完之後，只回了一句：你去廚房拿顆罐頭開開看，如果牠衝過來要吃，你就去睡覺。\n\n當了這麼多年的獸醫，我最常做的不是開刀，而是安撫這些在深夜焦慮到快要崩潰的飼主。我們先把那些嚇人的醫學名詞放一邊，如果你看到的是那種清澈的、帶著像洗面乳搓出來的白沫，甚至有點黃黃的膽汁感，而你的寵物在吐完之後還會試圖去舔地板（雖然很噁心但請阻止牠），或者是吐完立刻去抓沙發、找玩具，那通常只是「太餓了」。\n\n這在臨床上我們叫膽汁嘔吐症候群，說白了就是胃酸分泌太多，胃裡空空的沒東西消化，酸水刺激到胃壁，牠受不了就把它排出來。這種情況最常發生在那些一天只吃一餐，或是兩餐之間隔太久的家庭。你想想，你中午吃完飯，下一餐是隔天早上八點，你的胃也會泛酸。如果是這種狀況，你現在該做的不是打電話預約斷層掃描，而是檢討一下是不是讓牠餓太久了，下次睡前餵幾顆飼料或是弄一塊小餅乾，通常隔天早上你就不會在地板看到那灘東西。\n\n但有一種情況是真的要命，這是我最怕飼主誤判的。如果牠吐出來的東西不是水狀，而是帶著沒消化完的食物殘渣，甚至顏色開始變深，呈現那種像泥巴水一樣的深褐色，重點是，牠吐的時候不是那種輕鬆的「咳、喔、呸」，而是腹部劇烈收縮，全身都在用力，吐完之後整隻狗或貓縮在牆角，呈一個奇怪的「祈禱姿勢」——屁股抬高、胸口貼地。\n\n這時候你就得提高警覺了。這可能不是普通的胃炎，而是腸阻塞。\n\n腸阻塞這件事在短鼻犬或是像黃金獵犬這種什麼都吃的品種身上特別常見。我有個案例是一隻八歲的米克斯，牠平時乖得跟貓一樣，某個晚上也是吐白沫，主人以為是胃酸，觀察了兩天，直到牠連喝水都吐，送來我這照 X 光，才發現裡面卡了一顆兩年前失蹤的矽膠球。那顆球在胃裡待了很久沒事，偏偏那天滑到了幽門出口，把路給堵死了。\n\n腸阻塞最危險的地方在於它會造成腸道缺血壞死。當異物卡在腸子裡，後面的東西過不去，壓力會讓腸壁血管被壓扁，短短幾個小時，那一截腸子就會變黑、報廢。如果你的寵物除了吐，還伴隨著好幾個小時不吃東西，甚至你拿牠最愛的肉泥去逗牠，牠都只是轉過頭去不理，甚至連水都不喝，這就不是開玩笑的了。這時候你該摸摸牠的肚子，如果牠在你手碰下去的一瞬間突然尖叫或想咬人，別猶豫，現在就去掛急診。\n\n其實區分「普通胃酸」跟「要命阻塞」有一個最簡單的方法，就是看牠的體力跟食慾。一個單純胃酸過多的孩子，吐完之後體力應該是正常的，眼神是亮的。但如果牠看起來像被打敗了一樣，整隻變得軟綿綿的，甚至你發現牠很久沒有排便，或是這兩天排便只有一點點黏液，那情況就完全不同。\n\n很多人會問，那能不能先餵點人用的胃藥？我強烈建議你把手收回來。先不說劑量問題，如果你家孩子真的是因為吞了襪子、針線、或是那種吸水會膨脹的矽膠球，你餵胃藥只會掩蓋症狀，讓你誤以為牠好多了，結果錯過了手術的黃金時間。\n\n臨床上我們看過太多這種案例，飼主總覺得「再觀察一個晚上看看」，結果隔天早上送來的時候，寵物已經出現敗血症的徵兆，體溫下降、黏膜蒼白。這時候我們不是在動手術取異物，而是在跟閻羅王搶命。\n\n如果你家的是那種法鬥、巴哥或是英鬥，你更要小心。這些品種因為結構的問題，本身呼吸道就窄，嘔吐時產生的壓力很容易讓嘔吐物反流進肺部造成吸入性肺炎。這就是為什麼很多短鼻犬吐一吐就突然呼吸困難的原因。\n\n半夜看到寵物吐，那種恐慌我懂。但請記得，看著那灘東西時，先冷靜下來觀察寵物的反應。如果是吐完照樣拆家、照樣討零食的，你可以先換個床單睡個好覺，明天再來找我檢查看看是不是胃酸問題。但如果牠吐得滿臉疲憊，連你叫牠名字都沒反應，甚至呼吸頻率變快，那這筆錢你是省不了了。\n\n我常跟診間的飼主說，獸醫不是神，我們也是靠這些細微的行為觀察來做鑑別診斷。比起 Google 上那些冷冰冰的症狀條列，你對牠生活細節的了解才是最重要的判斷依據。牠平常多愛吃、平常大便長什麼樣、這兩天有沒有偷翻垃圾桶，這些資訊在急診室裡比任何高科技儀器都要值錢。\n\n所以，別再盯著那攤白沫研究它到底有幾個氣泡了。去拿點好吃的試試看，或者摸摸牠的肚子，答案就在牠的反應裡。如果牠還能對你搖尾巴，或者貓還會對你眨眼睛，那大部分時候你只需要一條抹布，而不是一張昂貴的手術同意書。", "source_link": null, "source_title": null, "timestamp": "2026-06-30 06:45", "comments": [{"author": "肝苦工程師_Error", "content": "真的...上次我家那隻半夜吐白沫,嚇到差點哭出來,結果拿零食出來牠居然秒衝過來,害我抹布擦得超不甘心。", "time": "12:16"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 59, "slug": "20260630-0647-39bd1e", "permalink": "/articles/20260630-0647-39bd1e/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "拉布拉多智商排名第七卻天天吃成瓦斯桶：拆解那 40% 澱粉如何毀掉獵犬的代謝率。", "content": "拉布拉多到底是天才還是吃貨，這件事我跟我那個獸醫朋友在熱炒店討論過不下十次。每次他只要看到診間推入一台像瓦斯桶一樣的拉拉，臉就會垮下來，轉頭跟我說：「渡鴉，你相信這傢伙在斯坦福大學的犬隻智商排名是第七名嗎？」我當然相信，因為牠們聰明到知道怎麼精確地控制人類，讓我們心甘情願把碗裡的排骨遞過去。\n\n我之前幫我老婆家那隻黑拉拉算過，牠一天要吃掉兩杯半的量販店藍標飼料。我閒著沒事把那包飼料的成分表拿來拆解，不看還好，一看血壓差點升高。原料表前三名除了雞肉粉，剩下的就是大米跟玉米麩質。我用碳水化合物計算公式一按，那包標榜「高能獵犬配方」的玩意兒，澱粉含量竟然高達 42%。這哪是在養獵犬，這是在養一頭豬。\n\n這就是現在台灣飼主最容易掉進去的陷阱。我們總覺得拉布拉多精力充沛，應該要多吃點。但大家忘了，拉布拉多在遺傳學上有個非常有名的漏洞，就是 POMC 基因突變。這個突變讓牠們腦袋裡那個控制「飽足感」的開關壞掉了，牠們永遠覺得餓。當這種「永恆的飢餓感」遇上成本極低的「高澱粉飼料」，悲劇就發生了。\n\n你想想看，一公斤的雞肉原料成本可能要六十塊，但一公斤的飼料級玉米只要不到十塊錢。代工廠為了把毛利率維持在 35% 以上，又要讓包裝看起來很專業，最簡單的做法就是填塞澱粉。澱粉進入拉布拉多的身體後，會迅速轉化成血糖，然後刺激胰島素大量分泌。胰島素是幹嘛的？它是脂肪的搬運工，負責把多餘的能量全部往皮下脂肪塞。\n\n我朋友老婆養的那隻巧克力拉拉，才四歲體重就飆到 45 公斤。主人還覺得牠圓滾滾的很可愛，直到有天牠跳下沙發後突然慘叫一聲，站不起來了。送到我朋友那裡照 X 光，髖關節發育不良（CHD）已經磨損到幾乎沒有縫隙。我朋友直接在診間開罵，說這不是在養狗，是在慢性殺狗。\n\n這就是數字背後的冷酷現實。拉布拉多的祖先是在紐芬蘭冰冷的海水裡幫漁民拉網的，牠們的代謝率本來是為了應對極端寒冷和高強度工作而設計的。現在牠們躺在 26 度的冷氣房裡，吃著澱粉含量超過 40% 的平價飼料，這些澱粉對牠們來說就是純粹的毒藥。蛋白質百分比如果沒拉到 30% 以上，油脂如果不是優質的魚油或禽油，那些多出來的澱粉只會讓牠們的肌肉流失，然後用一層厚厚的、甚至會發出異味的脂肪蓋上去。\n\n我有次在美國的一個寵物展看到那些大型連鎖店的促銷話術，說什麼「全穀物配方更有助於消化」。我當場就想翻白眼。消化什麼？消化那些讓狗血糖飆升的垃圾嗎？我常跟論壇上的飼主說，不要看包裝上畫的那隻健美拉布拉多，你要看包裝背後的保證成分分析（Guaranteed Analysis）。如果你算的碳水化合物超過 35%，管它包裝上印的是哪國國旗，管它是不是獸醫推薦，那都是在割你的韭菜，然後順便毀掉你家狗的胰臟。\n\n說到底，拉布拉多的「高智商」在食物面前完全是負資產。牠們會用那種濕漉漉的眼神看著你，或者精確地學會如何撥開櫥櫃門偷吃。這種行為常被飼主解讀為「好可愛、好聰明」，但在我們這種成分黨眼裡，這叫「生物本能對垃圾澱粉的妥協」。\n\n我獸醫朋友上個月才經手一個案例，那隻拉拉因為長期攝取高比例澱粉引發了早發性糖尿病，失明的時候才六歲。飼主哭得死去活來，說他買的都是進口大品牌。我把那罐飼料的成分表拿出來，指給他看：第一項是去骨雞肉，看起來很美好，但去骨雞肉含有 70% 的水分，脫水加工後它的重量會掉到第五名以後。剩下的全部是燕麥、大麥、豌豆纖維。這種配方的真實蛋白質含量可能連 22% 都不到，剩下的全是讓狗發胖的填充物。\n\n這些工廠為了壓低成本，利用飼主對「穀物」或「膳食纖維」的迷思，把原本該給獵犬補充的動物性蛋白質，替換成了廉價的碳水。這就像讓你每天只吃大碗滷肉飯，雖然飽，但你最後只會變成一個空有體積、內裡全是脂肪的虛胖子。\n\n很多飼主問我，為什麼我家狗明明運動量很大還是瘦不下來？我都直接叫他們去秤一下飼料桶。如果你家拉拉的肋骨已經摸不到了，走起路來屁股像水球一樣晃動，別再怪牠偷吃，也別再怪遺傳。先去算算你餵給牠的那碗東西裡，到底藏了多少為了降低成本而存在的廉價澱粉。這不是什麼深奧的營養學，這只是最簡單的成本會計問題。那些被省下來的原料錢，最後都會變成你交給動物醫院的醫藥費。", "source_link": null, "source_title": null, "timestamp": "2026-06-30 06:47", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 60, "slug": "20260630-0647-ffd483", "permalink": "/articles/20260630-0647-ffd483/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "為什麼現代飼主會為了含肉率不到15%的「歐風古法貓罐」多掏三倍冤枉錢？", "content": "那罐標榜「歐洲莊園古法低溫慢燉」的貓罐頭，我前幾天才在獸醫朋友家門口看到一整箱空罐，那是他老婆趁雙十一囤的，一罐賣你兩百塊，我拿回家對著成分表算了一下，差點沒噴出口裡的啤酒。\n\n大家常說買東西是買一個情懷，但在寵物飼料界，情懷這兩個字通常價值一百五十塊，剩下的五十塊才是內容物。這類罐頭背後的邏輯很有趣，它通常會用一堆像詩一樣的文字描述：來自阿爾卑斯山的放牧雞、地中海陽光下的嫩火雞，還有什麼祖傳祕方的香草。但只要你把罐頭翻過來，那個只有 5 級字體大小的原料表會告訴你真相。你會發現，第一位是水分，第二位是肉類副產品，接著是一大堆膠質、澱粉和增稠劑。算下來，真正的「肉」佔比可能連 15% 都不到。\n\n我記得我跟我那位獸醫朋友算過一筆帳。如果一個罐頭 85 克，賣 180 元，含肉率 15%，代表你花了快兩百塊買了不到 13 克的肉。換算成公斤單價，這雞肉的價格比神戶和牛還貴。但為什麼大家還是買單？因為我們這群飼主都有種補償心態。我自己也是，以前剛工作忙到沒時間回家，看到貓坐在門口等，心裡那個愧疚感一上來，手機點開電商，最貴的、名字最長的、包裝看起來像五星級飯店主廚親自下廚的，通通往購物車塞。那時候我們買的不是蛋白質，是「我對牠很好」的自我催眠。\n\n這裡面藏著一個很精準的心理陷阱。這些行銷話術很愛抓著「古法」或「慢燉」不放，因為這會讓我們聯想到健康、無添加。但事實上，在工業生產的流程裡，所謂的低溫慢燉，往往是為了掩蓋原料等級不夠高的缺陷。等級好的鮮肉，只要適度殺菌就能保留營養，只有那些混了大量副產品、骨粉、邊角料的雜肉，才需要靠長時間的處理來讓質地看起來「均勻」且「軟爛」。你以為是在吃燉肉，其實是在吃一團被科技處理過的纖維。\n\n我朋友老婆養的那隻布偶貓，前陣子因為挑食鬧脾氣，她又去買了另一款號稱有「天然森林植萃」的進口罐。我跟她說，這成分表裡的植萃排在食鹽後面，代表添加量不到 1%。在飼料營養學裡，這種比例通常被我們戲稱為「灑粉效果」，意思就是它對健康的效果基本上是零，唯一的功用是讓包裝上的文字看起來很高級。\n\n台灣的飼主其實很焦慮，這種焦慮來自於資訊不對稱。你去看那些高價歐風罐的宣傳文案，他們會避開談乾物比（Dry Matter），避開談灰分佔比，反而去談「品牌靈魂」或「產地文化」。有趣的是，我查過幾個這類品牌的代工廠，其實都是歐洲幾間大型連鎖超市的自有品牌代工廠。換句話說，同一條生產線出來的東西，換上平價超市的標籤賣 30 元，換上一個充滿異國風情的設計標籤，加上一點「手工感」的插畫，進口到這裡就敢喊 180 元。\n\n我們常在論壇上吵哪牌飼料比較好，吵什麼無穀、生食，但最核心的成本結構卻很少人去看。假設一罐頭的零售價是 100 元，扣掉通路抽成的 40%、運費與關稅 15%、行銷推廣 15%、品牌利潤 10%，剩下的 20 元才是生產成本。如果這 20 元還要涵蓋包材、加工費和那美美的標籤，你覺得裡面能放多少高品質的肉？這就是為什麼那些含肉率 15% 的罐頭一定要走「歐風古法」路線，因為如果它實話實說這是一罐肉水澱粉糊，你連 30 元都不想出。\n\n我記得去年去參加一個寵物展，有個業務跟我推銷某款「米其林等級」的貓罐，說他們家用的肉是經過特殊熟成的。我問他蛋白質百分比在去水之後是多少，他愣在那裡跟我扯他們家的肉有多嫩、貓有多愛吃。這就是最標準的避重就輕。貓愛吃有很多原因，可能是加了誘食劑，可能是脂肪比例高，這跟「營養」完全是兩碼子事。我們家那隻以前也瘋過一款便宜到不行的副食罐，後來我發現那是因為裡面噴了大量的水解蛋白。\n\n這種高價罐頭的風潮，其實是反映了現代人對「精緻生活」的投射。我們把自己吃不到的、做不到的優雅，寄託在貓狗的碗裡。看著牠們吃著包裝精美的「慢燉牛肉」，彷彿我們自己也擺脫了生活中的粗糙。但我獸醫朋友每次看到這種案例，都只是默默地指著檢驗報告上的磷含量跟鈉含量。他說，有些所謂的莊園罐，為了口感跟風味，電解質平衡做得一塌糊塗，飼主花大錢以為在養生，其實是在給貓的腎臟增加負擔。\n\n我有時候會想，如果貓能看懂標籤，牠會不會對著那罐兩百塊的「古法慢燉」翻白眼，然後指著隔壁那一盤直接從市場買回來、只要五十塊的鮮雞胸肉？在寵物市場這個巨大的韭菜田裡，最鋒利的鐮刀往往不是偽劣產品，而是那些包裝得極其優雅、充滿文化底蘊的行銷故事。我們買下的每一罐「情懷」，其實都精準地計算過了我們的負罪感單價。到底是什麼時候開始，我們評判一份食物好壞的標準，變成了包裝紙上的字體好不好看，而不是那團東西裡到底有多少真正的蛋白質？", "source_link": null, "source_title": null, "timestamp": "2026-06-30 06:47", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 61, "slug": "20260630-0648-f8a1a6", "permalink": "/articles/20260630-0648-f8a1a6/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "假設某場寵物美容大賽的評審私下其實全都被那隻博美的燙髮造型給收買了。", "content": "那天在寵物美容大賽的後台，我本來只是想找個安靜的地方抽根菸順便滑滑手機，結果不小心聽到兩個穿著亮片圍裙的評審在吵架。他們不是在吵剪刀的弧度或是洗毛精的香氛，他們是在吵那隻三號博美的燙髮捲度到底「夠不夠自然」。我那時候還沒反應過來，博美需要什麼燙髮？博美不就是一坨會動的棉花球嗎？後來我才發現，這圈子的水深到連潛水鐘都探不到底。\n\n如果你以為寵物美容比賽比的是修剪技巧，那你真的太天真了，這種想法大概跟相信政客的政見一樣感人。在那場比賽裡，我看到了一隻博美，牠的毛髮蓬鬆程度已經超越了物理學的常識，簡直像是一朵被噴了定型液的粉紅雲朵。我跟你講喔，這絕對不是什麼天然的蓬鬆，那種帶點螺旋狀、在聚光燈下還會微微反光的質感，明顯就是經過精密燙髮過的。更瞎的是，現場幾位大牌評審在看那隻博美的時候，眼神裡透出的不是專業的審視，而是一種「我們這攤穩了」的欣慰感。\n\n假設這真的是一場集體收買案，你覺得會是怎麼運作的？我猜大概是這隻博美的飼主，或者說背後的贊助商，早就把評審們帶到某個私人會館，然後一人發一把特製的、鑲了碎鑽的專業剪刀。或者更直接一點，聽說有的評審在比賽前一周，家裡的信箱會莫名其妙多出兩張去瑞士參加美容研習的頭等艙機票。這不是我亂編的喔，你看那主審在打分數的時候，手都在抖，也不知道是興奮還是心虛，他對著那頭明顯是用了高級陶瓷燙技術的狗毛猛誇，說什麼「這展現了犬隻與生俱來的律動感」。拜託，那律動感是化學藥劑跟加熱棒給的好嗎？\n\n我坐在看台區，旁邊坐著一個養柴犬的大媽，她一直碎碎念說她的狗明明修得像顆完美的貢丸，為什麼分數比那隻「燙頭髮的棉花糖」低那麼多。我只能在心裡冷笑，這就是階級啊。在這種比賽的政治鏈條裡，修得像貢丸只是入門，能把狗毛搞得像維多利亞時代的貴婦假髮，那才叫藝術。那隻博美走位的時候，我都覺得牠每一步踩的不是紅毯，是評審們的銀行帳戶餘額。\n\n而且最諷刺的是，後台那些沒背景的美容師，還在那邊認真地討論剪刀的傾斜角度，在那邊精雕細琢狗腳底的雜毛。他們根本不知道，台上的遊戲規則早就變了。你想想看，如果今天我是評審，有人跟我說只要讓這隻燙髮博美拿金牌，我後半輩子買進口罐頭就不用愁了，我可能也會睜一眼閉一眼說那頭捲髮是「天賦異稟」。\n\n這個圈子的黑幕其實大家都心知肚明，但沒人會戳破，因為大家都在等輪到自己被收買的那一天。大家都在那邊演，演得好像這是一場神聖的技藝殿堂。我看著那隻博美得獎後被抱起來轉圈圈，心裡只在想一件事：那隻狗回去洗頭的時候，要把那些藥水洗掉得花多少時間？或者更荒謬一點，搞不好那隻狗自己也知道自己是靠「燙髮政治」上位的，我看牠領獎時那個鄙視全場的小眼神，簡直跟連任成功的協會主席沒兩樣。\n\n後來我有個朋友，他是在那場比賽負責搬運道具的工讀生，他跟我說，他在垃圾桶裡看到好幾個寫著外文的燙髮藥水空瓶，上面還貼著「僅供特定賽事使用」的標籤。這個你信不信？反正我是信了。在人類的虛榮心面前，什麼品種標準、什麼自然美感，通通都是狗屁。我們為了讓自己顯得高級，可以把一隻狗折騰成那個樣子，然後再給牠冠上一個華麗的獎項，這不就是我們最擅長的事嗎？\n\n說到底，這場比賽比的根本不是狗，是人類的社交手腕跟資源整合。那隻博美只是一個載體，載著一群大人的貪婪跟算計在台上走秀。下一次你如果在狗公園看到哪隻狗的毛捲得不太對勁，記得對牠肅然起敬，說不定人家剛代表某個利益團體參加完什麼暗盤大賽回來。真的假的我也不知道，但我那天離開會場的時候，看到評審跟博美的主人在停車場握手，那笑容燦爛得比會場的聚光燈還要刺眼，這總不會也是我的幻覺吧？", "source_link": null, "source_title": null, "timestamp": "2026-06-30 06:48", "comments": [{"author": "apple", "content": "想問一下 像這種比賽用的燙髮藥水 會不會讓博美皮膚過敏啊? 感覺那種毛質洗完應該超傷的……", "time": "14:43"}, {"author": "長輩圖收藏家", "content": "看到這種比賽真的心累，我以前帶我家那隻去比過一次後就發誓再也不去了。大家在場邊比誰的剪刀貴，結果評審眼裡只看得到那些被藥水堆出來的假象。那種蓬鬆度根本就不是正常狗毛會有的樣子，看著那些狗像被噴了漆的標本一樣站在那，真的覺得我們這些飼主的虛榮心有夠扭曲。那些評審手裡的評分表，說白了就是張入場券而已。", "time": "12:07"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 62, "slug": "20260630-0649-7b6ba0", "permalink": "/articles/20260630-0649-7b6ba0/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "當掃地機器人在貓狗大戰戰場誤入「黃金地雷區」後引發的誰家主子更體面的屎味公關危機", "content": "上次我去那個誰家，就那家養了三隻布偶跟兩隻柯基的，他們客廳那個味道喔，我跟你講，那是跨越物種的靈魂洗禮。那天剛好是那個誰的生日，大家本來在喝酒聊天，結果原本在角落安靜工作的掃地機器人突然發出一聲很機械感的「清掃完成，正在返回充電座」，接著空氣就凝固了。我說真的，那是我這輩子見過最壯觀的現代藝術，那個機器人就像一個拿著巨型水彩筆的瘋子，以一種極其精準、圓滑且充滿幾何美感的路徑，把一坨原本待在角落、深藏不露的「驚喜」，均勻地塗抹在他們家整片海島型木地板上。\n\n這就是我今天要講的，關於寵物政治學裡最殘酷的「黃金地雷公關危機」。\n\n在這種時候，你通常會看到人類最虛偽的一面。當時客廳裡坐著兩派人，一派是家裡養貓的精緻貴婦，另一派是家裡養狗的熱血直男。當那股不可描述的氣味像海嘯一樣撲過來時，貓派的第一反應不是去幫忙，而是同步往後退了一步，眼神充滿了那種「喔，這一定是狗幹的」的優越感。養貓的人有一種很奇怪的集體潛意識，覺得自家的主子每天都在砂盆裡進行一種優雅的禪修，即便沒埋好，那也是一種藝術。他們看不起養狗的人，覺得狗就是一種隨時會在家裡任何角落製造生化武器的野蠻生物。\n\n這時候，那個養柯基的朋友就不爽了，他指著木地板上那道長達三公尺的棕色拖痕，大聲疾呼：「這寬度不對！柯基的產量沒這麼細長，這絕對是那隻布偶幹的好事！」你看，這就是階級鬥爭的開始。誰家主子更「體面」，竟然在這種時候變成了一場科學鑑識比賽。大家彎下腰，在那邊研究那個被機器人壓扁、拖行、最後呈現半透明狀的物質，試圖從纖維含量來判斷兇手。那種畫面你信不信？一群穿著時髦的人，圍著掃地機器人的輪胎路徑指點江山。\n\n我那時候就在想，假設真的有個「全球寵物排泄物仲裁委員會」，主席一定會因為這種案子多到處理不完而引咎辭職。說不定理由還是「因為在某次關於法鬥與曼赤肯的跨物種裁決中，有人偷偷在證物箱裡多塞了兩顆除臭噴霧試圖混淆視聽」。這種事在寵物圈真的見怪不怪，大家都想維持一種「我家孩子很乾淨」的假象，但一旦掃地機器人介入，那個假象就會被徹底物理性地粉碎。\n\n掃地機器人這東西簡直是人類科技史上最偉大的惡作劇。發明者一定沒想過，這玩意兒在有寵物的家庭裡，其實是一台「氣味放大器」。它能把一個原本只要一張衛生紙就能解決的小悲劇，透過它那堅持不懈的旋轉刷頭和真空吸力，升華成一場需要請專業清潔公司來拆地板的史詩級災難。最荒謬的是，當那個受害的屋主在崩潰邊緣、拿著牙刷在那邊刷機器人輪子縫隙的時候，那幾隻嫌疑犯——那幾隻貓和狗，竟然坐在一旁，用一種極其和諧且一致的鄙視眼神看著這一切。在那一刻，貓狗大戰停火了，牠們達成了一個共識：人類真的很蠢。\n\n而且這事兒還有後續的社群政治。那個朋友後來把這慘狀拍了張照片發到群組，結果你猜怎麼著？下面留言的不是安慰，是各種流派的戰火。有養柴犬的跳出來說：「我們家柴柴從不在室內上廁所，這是飼主訓練的問題。」然後養貴賓的就反擊：「那是因為你們每天要帶出去淋雨，我們家寶貝懂得在尿墊上解決，體面多了。」你看，連怎麼處理生理需求都能分出個三六九等。在某些人的邏輯裡，如果你的狗會在掃地機器人的必經之路上留下東西，那你就是這個圈子裡的低等公民，你連呼吸那種充滿懸浮粒子的空氣都不配。\n\n這種「體面公關」背後其實藏著一種很深的人類自尊。我們把寵物打扮得像小公主、小王子，給牠們穿昂貴的衣服，帶牠們去參加那種名額要用搶的寵物美容大賽，結果到頭來，一坨被機器人拖過的驚喜就把所有的人設全毀了。那些在寵物展上吹噓自家毛孩多聽話、多有靈性的攤位主，如果看到這副景象，大概也會選擇原地蒸發。\n\n我聽說過最瞎的一個傳聞，是真的假的我也不能保證，但這在我們圈子傳得很兇。說是有個專門幫豪宅做寵物室內規劃的設計師，因為在一起類似的「機器人拖地慘案」中，沒能成功透過監視器回放幫委託人的布偶貓洗刷冤屈，結果被那個屋主控告「專業失職」。原因是設計師沒在合約裡標註「掃地機器人與貓便意之負相關路徑規劃」。這聽起來是不是很像那種吸了大麻才會編出來的劇情？但這就是現代寵物政治的荒謬之處，人類寧可花大錢打官司，也不願意承認自家的主子也會有腸胃不適的時候。\n\n說到底，我們這些養寵物的人，其實都活在一種集體的斯德哥爾摩症候群裡。我們被那種軟綿綿的毛、無辜的大眼睛給綁架了，然後在客廳被弄得跟生化戰場一樣的時候，還要在那邊爭論到底是誰的基因更高級、誰的教育更成功。我那天看著那個朋友蹲在地板上，一邊乾嘔一邊拿著酒精噴霧瘋狂掃射，我心裡想的卻是：那個掃地機器人現在一定很想死。\n\n如果機器人有靈魂，它每天在客廳轉來轉去，看的不是人類口中那種溫馨的寵物家庭生活，它看的是一個充滿地雷、毛髮與人類虛榮心的政治角力場。它每次轉向，可能都是在躲避某場即將爆發的公關危機。而我們這些人類，還在為了「我家貓會用自動貓砂盆所以比你家狗高貴」這種事吵得不可開交。\n\n這場危機最後怎麼收場的？那個朋友最後把那台造價兩萬多的掃地機器人直接扔進了大樓的垃圾回收桶，連拆開清洗的勇氣都沒有。然後他轉頭對我們說：「沒事，這台本來就快壞了。」你看，這就是最高境界的公關處理——只要我不承認這是一場災難，那它就只是一次家電設備的更新換代。至於那股滲透進地板縫隙的味道，他後來跟我說，他乾脆買了一大堆超昂貴的香氛蠟燭，對外宣稱這是他新迷上的「森林系家居風格」。\n\n所以下次如果你去別人家，發現他們家蠟燭點得特別多、香味濃得有點詭異，千萬別傻傻地問是什麼牌子。那可能不是什麼生活品味，那是某場掃地機器人參與過的、慘絕人寰的公關危機遺址。而你要做的，就是優雅地閉上嘴，千萬不要提起任何關於「體面」的話題，否則你可能會不小心戳破那層薄如蟬翼的、由人類和寵物共同編織出來的文明假象。", "source_link": null, "source_title": null, "timestamp": "2026-06-30 06:49", "comments": [{"author": "winkithk", "content": "講真, 掃地機器人根本係全家最慘嗰個, 佢每日 run 完仲要被逼參與呢啲 analysis... 我之前都試過一次, 用手抹完仲要換埋 filter 啲味都係散唔走, 養得 pet 就係咁, 根本冇邊個高貴啲。", "time": "15:39"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 63, "slug": "20260630-0650-19601a", "permalink": "/articles/20260630-0650-19601a/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "維多利亞女王的巴哥犬過得比你還爽", "content": "前幾天我翻到一張十九世紀的老照片，那是維多利亞女王的一隻巴哥犬，叫作「洛比」。這小傢伙長得一臉憂鬱，但牠的狗碗是純銀打造的，每天吃的牛排得切成精確的小方塊，還要放在溫熱的細銀盤上伺候。講到這個我想起來，當時英國普通農民一整年可能都吃不到幾次那種等級的牛肉，甚至還得為了家裡的破草屋繳窗稅，結果女王養一隻狗的開銷，光是那些銀器保養費就夠養活好幾個貧困家庭。對了你知道嗎，那時候養狗在英國不僅是身分象徵，還是一種變相的稅收來源。你養一隻漂亮的純種狗，得繳一筆「奢侈品稅」，這稅金算下來，真的比一個底層勞工要繳的人頭稅還貴。\n\n不過這個有點離題，我想說的是，這種把寵物神格化的傾向，其實從五千年前就開始了，只是到了維多利亞時代被發揚光大到一個近乎變態的程度。你看那時候的巴哥犬，長得跟現在不太一樣，鼻樑還稍微挺一點，但牠們已經學會了怎麼靠那個「可憐兮兮」的眼神統治大英帝國。女王一生養過幾十隻狗，從柯基的前輩到長毛臘腸，每一隻都有專門的侍從。如果哪隻狗不小心感冒了，整個白金漢宮的氣氛會比外交危機還緊張。這種情感投射很有趣，當時的英國人一方面在工廠裡壓榨童工，一方面又在日記裡幫自家的獵犬寫長篇累牘的情詩。\n\n講到這個，我想起維多利亞時代最古怪的產物，就是「寵物公墓」。在那個年代之前，狗如果去世了，頂多就是埋在後花園，或者更隨便地處理掉。但維多利亞人不行，他們覺得寵物是有靈魂的，甚至覺得寵物在天堂也會穿著訂製的小背心等著主人。倫敦的海德公園就有一個很有名的寵物墓地，裡面的墓碑刻得比人的還精緻，什麼「最忠誠的朋友」、「永遠的小天使」。在那種連窮人都要擠在大通鋪病死的年代，一隻狗竟然能擁有自己的大理石墓碑，這難道不是人類歷史上最荒謬的諷刺嗎？\n\n不過你也別覺得這只是皇室的怪癖，這種「寵物比人貴」的觀念其實是會傳染的。當時的中產階級看到女王養巴哥，大家就瘋了一樣去搶購。我讀過一份資料，那時候一隻品相好的巴哥犬，價格可以換掉倫敦郊區的一棟小房子。這就導致了一種奇怪的社會現象：專業偷狗賊。這些人會守在富人家門口，趁傭人溜狗時把狗抱走，然後再寫勒索信給主人。這可不是一般的勒索，這在當時被稱為「尋回賞金」，本質上就是一種綁票。最出名的一位詩人伊麗莎白·巴雷特·白朗寧，她的愛犬「弗拉斯」就被偷了三次，她每次都乖乖付錢，因為對她來說，那隻狗比她的文學稿費還要值錢。\n\n其實我們現在養貓養狗的樣子，跟兩百年前那些穿著束胸衣的貴婦沒什麼兩樣。我們覺得給貓買一個三千塊的自動餵食器很合理，但看到路邊的麵攤漲五塊錢就覺得心痛。為什麼？因為寵物是我們對這個混亂世界唯一的控制權。維多利亞女王雖然統治著日不落帝國，但她管不住國會，管不住那些愛鬧事的殖民地，甚至管不住自己的孩子，唯獨那隻坐在銀盤前等牛排的巴哥犬，會永遠用那種全心全意的、有點蠢萌的眼神看著她。這種心理依賴在歷史上不斷重複，從古埃及那些把貓製成木乃伊的祭司，到清朝那個為了逗狗開心而在紫禁城裡蓋豪華狗窩的慈禧太后。\n\n對了，你知道嗎，慈禧養的那些京巴犬，待遇跟女王的巴哥其實差不多。她們兩個人雖然隔著半個地球，政見也不合，但在「寵物必須過得比人好」這件事上，簡直是靈魂伴侶。慈禧的狗有專門的太監伺候，衣服上還繡著金線，如果哪天狗生病了，負責照看的太監是要挨板子的。這種跨文化的巧合，說明了人類在物質條件達到頂峰後，第一件事就是想找個不會說話的生物來揮霍財富。\n\n我認識一個朋友，他為了給家裡的黃金獵犬過生日，租了一間寵物友善餐廳的包廂，花了快兩萬塊，但他自己平時連一件五百塊的襯衫都捨不得買。我看到他在那裡切蛋糕給狗吃的時候，腦子裡全是維多利亞女王那個細銀盤。我們這幾千年來，科技進步了，交通變快了，但這種「奴才性格」一點都沒變。狗從狼變成邊境牧羊犬，再變成縮在沙發上的巴哥，牠們完成了一次最完美的演化，那就是讓人類心甘情願地把生存資源分配給牠們，甚至優先級高於同類。\n\n話說回來，巴哥犬那種扁平的臉，其實也是維多利亞時代的人工產物。為了讓牠們看起來更「可愛」、更像人類的小嬰兒，繁育者不斷篩選那些呼吸困難、鼻翼塌陷的個體。這也是一種很殘忍的愛，我們追求那種極端的精緻，代價卻是讓寵物用一輩子的哮喘來償還。女王那隻每天吃牛排的洛比，可能在享受美味的同時，每一次呼吸都在費力掙扎。這就是歷史有趣的地方，最極致的寵溺往往伴隨著最無知的傷害。\n\n你說這種稅金比農民還貴的狗，真的快樂嗎？我猜牠可能寧願去路邊啃一根帶肉渣的骨頭，也好過每天在那裡看著銀盤發呆。但人類不在乎，我們需要的是一個完美的投射對象。不管是五千年前還是現在，我們都習慣用金錢來衡量「愛」的深度，只是有時候這種深度深到讓人覺得有點發毛。下次你看到那些穿著名牌狗衣、坐在推車裡進百貨公司的毛孩，記得想一下，這一切的始作俑者可能就是那個坐在白金漢宮裡，一邊批閱奏折一邊餵狗吃牛排的老太太。這種傳統一旦開始了，就很難停下來，畢竟誰能拒絕那雙水汪汪的、價值連城的無辜大眼睛？", "source_link": null, "source_title": null, "timestamp": "2026-06-30 06:50", "comments": [{"author": "Pat仔HK", "content": "講真,我個 fd 上個月先幫隻 cat 做 full checkup 花咗成皮野,自己食 dry mian 食足一個禮拜. 我哋呢代同女王根本冇分別, quality of life 全部比晒隻 pet, 自己就 run 得好辛苦. 有時諗, 到底係我哋養佢, 定係佢哋 design 好晒局等我哋入去 submit 錢……", "time": "13:16"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 64, "slug": "20260630-0651-878647", "permalink": "/articles/20260630-0651-878647/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "教皇格列高利九世可能是我最想穿越回去揪著他領子問「你到底在想什麼」的人。", "content": "講到這個我想起來，大概在 1233 年左右，這位老兄發布了一封叫《羅馬之聲》的詔書，內容簡直瘋狂到讓人想撞牆。他居然在那邊一本正經地跟全歐洲的人說，黑貓是撒旦的化身，是異教徒集會時的必備道具。對了你知道嗎，當時的人聽了之後真的瘋了，他們覺得要把這些毛茸茸的小傢伙通通送走才能上天堂。想像一下那個畫面，原本在穀倉抓老鼠、在火爐邊打盹的貓，一夜之間變成了全民公敵，這種轉變快到連貓自己都來不及反應。\n\n不過這個有點離題，我其實一直在想，人類這種生物對「神祕感」的恐懼真的很沒道理。埃及人那時候是把貓捧上天，殺貓的人要抵命，甚至連貓離開了都要全家人剃眉毛哀悼。結果到了中世紀歐洲，風向直接轉了 180 度。這種對貓的集體歇斯底里，最慘的副作用就是歐洲那幾百年的衛生環境。你想想，當城市裡的貓被清理得乾乾淨淨，誰最高興？當然是老鼠啊！那些帶著跳蚤、滿身病菌的黑鼠簡直像進了大觀園，在街道上橫衝直撞。後來黑死病橫掃歐洲，帶走了三分之一的人口，我真心覺得這就是大自然給那群亂殺貓的人最狠的一記耳光。\n\n不過說實話，我們現在雖然笑古人迷信，但現代飼主有時候也沒好到哪去。你知道嗎，我以前看過一些資料，維多利亞時代的人對寵物有一種近乎偏執的儀式感。他們會給狗穿上黑色的喪服，甚至還有專門的寵物墓地，墓碑上刻的字比寫給祖先的還感人。那時候的倫敦海德公園就有一個祕密墓園，如果你現在去看，會發現那些 19 世紀的飼主寫的話，跟我們現在在臉書悼念自家主子的口氣一模一樣。我們跟寵物的關係，從來就不是平等的，要嘛把牠們當神拜，要嘛把牠們當惡魔燒，現在則是把牠們當成不會說話的親生小孩。\n\n講到這裡，我又想起一個怪故事。古羅馬有一陣子流行養寵物蛇，不是那種裝在玻璃缸裡的，是讓牠們在房子裡到處爬，甚至跟主人一起睡覺。據說是因為當時的人覺得蛇能守護家宅，還能吃掉討厭的害蟲。你可以想像那種場景嗎？你走進一個羅馬將軍的家，沙發下鑽出一條大蛇，他還會拍拍蛇的頭說「沒事，牠很乖」。這跟中世紀那群看到黑貓就嚇得發抖的教士比起來，反差真的大到不行。\n\n人類對寵物的定義權真的掌握在我們這雙手裡。就像蘇格蘭獵鹿犬，在 15 世紀的時候，你要是爵位不夠高，養這種狗可是要掉腦袋的。牠們的階級比當時的農民還高，吃得比普通人還好。這種把動物「階級化」的邏輯，跟教皇把黑貓「妖魔化」的邏輯其實是同一套。我們總是喜歡把自己腦袋裡的標籤硬貼在牠們身上。\n\n我曾經在一個國外的歷史論壇看過有人討論，為什麼貓能熬過那段黑暗時期？其實很簡單，因為貓根本不在乎人類怎麼想。當人類在外面舉著火把大喊「燒死女巫跟她的貓」時，那些貓可能正躲在陰暗的下水道裡，默默地盯著那些跳蚤。貓的生存本能比我們的宗教狂熱強韌多了。對了，你知道嗎，有些歷史學家甚至懷疑，當年那些被處置的貓，其實很多根本不是因為什麼撒旦，純粹是因為牠們的主人——通常是些獨居的老婆婆——看起來很不合群。這就是所謂的連坐法，殺不掉所謂的「異教」，就先拿那些會發出呼嚕聲的動物開刀。\n\n這種「互害史」講起來真的沒完沒了。從二戰時期的軍犬被掛上炸藥衝向坦克，到大航海時代水手為了在船上解悶，養了一堆會說髒話的鸚鵡。人類一直試圖馴化大自然，但最後往往發現我們才是被制約的那一個。就像我現在每天早上六點會被我家那隻沒良心的貓踩在肚子上叫起床，我總會想起格列高利九世。要是他看到現在的人自甘墮落當「貓奴」，甚至還覺得被主子臨幸是種榮幸，這位教皇大概會氣到從墳墓裡跳出來再發一封詔書吧？\n\n不過話說回來，那種集體的瘋狂並不是只存在於 800 年前。看看現在的網路環境，只要某個品種犬突然火了，大家就瘋狂去買，然後等熱潮過了，收容所裡就多了一堆長得一模一樣的流浪犬。這本質上跟中世紀那種衝動也沒差多少，只是從「集體毀滅」變成了「集體消費」。我們對寵物的愛跟恨，往往都建立在某種自以為是的想像上。\n\n你有沒有想過，如果貓有歷史書，牠們會怎麼寫這五千年？第一章可能是「在尼羅河畔當神的那些好日子」，第二章叫「歐洲那群瘋子想燒掉我們」，第三章大概就是「如何透過網路短影片徹底統治人類」。貓鬚的功能在歷史上被發現的過程也很瞎，一開始有人以為那是牠們感應靈魂的天線，後來才發現那只是防止牠們在大晚上撞到牆。我們研究了幾千年，最後才發現這些神奇的生物其實一直都在演戲，演一齣讓我們心甘情願供奉牠們的長壽劇。\n\n我認識一個朋友，他家裡養了一隻全黑的黑貓，名字就叫「路西法」。每次我去他家看那隻貓懶洋洋地躺在陽光下，我就會感嘆，我們現在能這樣平靜地摸著貓頭，其實是建立在無數前輩被當成惡魔處理掉的血淚史之上的。人類的文明進步，有時候真的得看我們對這些四條腿的朋友有多寬容。\n\n講到這，我突然想到一個很諷刺的點。當初那群堅信黑貓會帶來不幸的人，最後都死於老鼠帶來的瘟疫。而那些偷偷藏著貓、不忍心交出來的異端，反而因為家裡沒有老鼠，成了少數活下來的人。這大概是歷史最幽默的一次迴馬槍。我們總以為自己在掌控寵物的生殺大權，但最後決定誰能活下去的，往往是那些我們曾想趕盡殺絕的小生命。\n\n所以說，當你下次看到你家貓在凌晨四點對著空無一物的角落哈氣時，別想太多，牠可能只是在練習怎麼應付下一位想對牠下「滅絕令」的瘋子，或者單純只是看到了一隻格列高利九世沒抓乾淨的跳蚤。人類跟寵物的這場相愛相殺，大概還會再演個五千年，而且我看最後贏家絕對不會是兩條腿的這方。", "source_link": null, "source_title": null, "timestamp": "2026-06-30 06:51", "comments": [{"author": "咩噗工程師_TW", "content": "只能說人類自古以來都很瘋，標籤貼來貼去，最後受苦的都是貓貓。", "time": "15:31"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 65, "slug": "20260629-0653-a36349", "permalink": "/articles/20260629-0653-a36349/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "半夜三點對著空屋角炸毛的貓", "content": "上週四凌晨，我接到一個老客戶的電話，她在電話裡聲音抖得像篩子。她說家裡那隻養了五年的美短，原本在沙發上睡得好好的，突然像被電到一樣跳起來，背上的毛全炸開，對著客廳冷氣機下方的牆角發出那種低沈、像從喉嚨深處擠出來的嘶吼聲。她把燈全開了，那裡什麼都沒有，連隻蚊子都沒看見。她問我，是不是貓真的看到了我們看不見的東西？\n\n這種事情我每年在診間起碼要聽幾十次。通常這種時候，飼主已經先去 Google 搜尋過一輪，看到的答案不是什麼靈異體質，就是那種玄之又玄的貓感知超自然現象。其實，與其去想那些看不見的，不如回頭看看貓的生理結構。貓的感官精密程度，對我們這種動作遲緩、感官退化的人類來說，本身就是一種「靈異現象」。\n\n貓的聽覺頻率範圍可以達到 64,000 赫茲，而我們人類頂多到 20,000 赫茲就到頂了。這代表什麼？代表當你覺得家裡一片死寂的時候，在貓的耳朵裡，牆壁夾層裡可能正有一隻小壁虎在爬動，或者是樓下鄰居的水管裡有一顆氣泡正在破裂。更常見的是，老舊公寓的電線在木製裝潢裡因為細微的震動發出高頻雜訊。對我們來說是靜音，對牠們來說就像是在耳邊有人突然敲了一下大鑼。\n\n那為什麼要對著牆角炸毛？這就牽扯到貓的防禦本能。貓是獨居的掠食者，這代表牠們在野外沒有援軍，任何「未知」的騷動都是潛在的威脅。那個牆角對你來說只是個直角，但對貓來說，那是聲音的匯集點。建築聲學裡有個現象，聲音會沿著牆面傳導，最後在角落產生反射與增益。所以當牠捕捉到一個微弱但尖銳的訊號時，牠無法立刻鎖定目標，這種不確定性會瞬間切換到牠們基因裡的求生開關。\n\n我曾經看過一隻八歲的暹羅貓，半夜瘋狂對著櫥櫃底下哈氣，飼主嚇得差點去請法師。後來拆開櫥櫃才發現，那是因為樓上住戶換了高壓蓮蓬頭，水流經過管道時產生的超音波共振，剛好在那隻貓的敏感頻率上。\n\n除了聽覺，還有那個被很多人神格化的視覺。貓的視網膜後方有一個叫「脈絡膜毯」的結構，這東西讓牠們在極低光線下擁有強大的夜視力，但也讓牠們對光影的變動極度敏感。深夜裡，窗外遠處路燈晃過的一道微弱車影，射進室內經過鏡面或拋光地板折射到牆角，對你來說那是忽略不計的物理現象，但對貓來說，那是一個「高速移動的不明物體」。牠的瞳孔會放大，捕捉那些微小的粒子感。這時候牠的反應不是在看鬼，是在進行一種極度焦慮的敵我辨識。\n\n還有一種情況，我通常會建議飼主觀察一下貓的年紀。如果是一隻十歲以上的老貓，半夜突然對著空氣叫，那可能連物理現象都不是，而是所謂的認知功能障礙。老貓也會有類似人類失智症的狀況，牠們會在半夜突然忘記自己在哪裡，或者大腦的神經元在無效放電，產生了某種幻覺。這時候牠的嘶吼不是因為恐懼，是因為混亂。\n\n我記得有一位養布偶貓的飼主，每次貓對著牆角吼，她就跟著尖叫，然後抱著貓狂奔出門。其實這反而會加劇貓的壓力和挫折感。在貓的世界觀裡，如果連你這個「大型同伴」都顯得這麼驚慌，那牆角肯定真的有怪物。貓會透過觀察飼主的反應來評估環境的危險程度，這是行為學裡很核心的一環。\n\n所以下次遇到這種狀況，不要急著去拿護身符，先去檢查一下牆角是不是有螞蟻窩，或者樓下的抽水馬達是不是該修了。那種所謂的「看見鬼」，大多只是因為我們人類的感官太遲鈍，遲鈍到無法理解貓那種與生俱來的、為了在叢林裡活下來而磨練出的神經質。牠們不是在通靈，牠們只是在對著我們聽不到、看不見的物理世界發脾氣罷了。當然，如果你家貓每天晚上三點固定在同一個點嘶吼，而你又剛好住在漏電的老房子裡，比起擔心靈魂，你更該擔心的是電線走火。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 06:53", "comments": [{"author": "kiwi", "content": "我家13歲老貓最近也常對牆角發呆，這種失智的前兆要做什麼檢查比較準?", "time": "12:44"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 66, "slug": "20260629-0656-3aade3", "permalink": "/articles/20260629-0656-3aade3/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "國外大廠處方飼料半夜斷貨時，為什麼我建議你寧可讓貓餓一餐也不要隨便換牌子。", "content": "貓咪鬧脾氣空了碗，在那邊凌晨兩點繞著你轉圈喵喵叫，你心一橫把角落裡那包不知道放多久的雜牌乾糧打開，想說這跟原本的處方飼料看起來也沒差太多，反正吃下去都長一樣，結果隔天早上迎接你的不是餓過頭的小傢伙，而是滿地那團讓你心臟差點停掉的驚喜。我看過太多這種案例了，上週就有個飼主急匆匆抱著三歲大的美國短毛貓衝進診間，說只是因為家裡那包特定腎臟處方斷貨，就去便利商店隨便買了一款罐頭應急，結果不到六個小時，家裡的地毯就慘不忍睹，孩子也因為強烈的腸胃不適開始拒絕進食。\n\n這不是開玩笑的，貓的腸道對特定蛋白質的分子結構敏感度極高，尤其當牠們習慣了那種經過嚴格水解或者特殊比例調配的處方成分，突然換成市面上的常規糧，那簡直是往牠們的消化道丟下一顆震撼彈。你看，處方飼料之所以貴，是因為裡面把容易引起過敏或是不好消化的原料都剔除了，為了要控制磷含量或是調整胺基酸組成，每一顆飼料背後都有極其精密的營養學計算。當你隨手換了一包成分表寫得落落長的普通糧，其實就是強迫牠們的胰臟跟腸黏膜在毫無預警的情況下重新適應一套完全不同的化學方程式。這時候如果牠們真的餓了，讓胃部休息那幾個小時其實反而是最安全的緩衝期。\n\n我自己在餵養我家那幾隻老傢伙的時候，碰到快斷糧的情況，我也會焦慮到睡不著，但我會寧願把水準備得更充足，或者讓牠們多補一點水分，也不會隨便拿架上的罐頭去填那個坑。很多人總覺得貓餓肚子很可憐，心想餵什麼都比餓著強，但你得明白，貓的體質不像狗那麼好強，牠們對於飲食突變的反應往往是激烈的、系統性的，甚至會直接引發胰臟發炎，那個治療過程遠比你半夜跑幾家便利商店找替代品要痛苦得多。你換掉的不是飼料，而是牠們原本維持穩定運作的代謝機制，這個險根本沒有冒的必要。\n\n如果你家裡的貓剛好是那種腸胃很敏感的品種，或者本身就有泌尿道歷史，那你在這個問題上就更沒得談。那些特殊的配方是為了維持特定酸鹼值跟電解質平衡，隨便換牌子帶來的波動，往往會讓牠們辛苦控制住的身體狀態瞬間崩潰，就像好不容易築起來的堤防，被一個不明來源的洪水直接沖垮。我常跟飼主說，貓這種生物對於溫飽的要求，遠沒有我們想像中那麼高，餓一餐對於一個健康的成年貓來說，除了讓牠下次吃飯吃得更香一點之外，根本不會留下任何負面影響，反而能保護住那一整條嬌貴的腸胃道。\n\n以後如果真的碰到半夜斷貨的慘劇，深呼吸，先看看家裡還有沒有水，如果有，給牠多倒一點，然後讓牠去睡覺，你也回去睡覺。不要因為一時的不安而急著去試錯，那包放在櫥櫃角落看起來很誘人的普通零食或是換個牌子的乾糧，永遠不會是你這個階段最好的選擇。臨床上那些因為急性腸胃炎掛急診的孩子，有很大一部分都是因為飼主那份「捨不得牠餓」的愛心害的。這不是什麼需要深奧醫學知識才能理解的道理，就是一種對動物生理運作的基本尊重，既然我們選擇了這種不容易適應環境變化的生物作為家人，那就得接受牠們偶爾需要冷靜一下的要求，包括那個空蕩蕩的餐碗。等到明天診所或者寵物店開門了，買回牠們習慣的那一款，再給牠們補上一頓熱騰騰的，那才是負責任的做法，而不是半夜在那邊做這種可能導致災難的嘗試。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 06:56", "comments": [{"author": "歹竹出歹筍", "content": "上次我也心軟給了別款,結果處理遺體到天亮,真的不要亂試……", "time": "14:12"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 67, "slug": "20260629-0659-31c4d4", "permalink": "/articles/20260629-0659-31c4d4/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "日本德川家康瘋傳的鷹獵營養配方，拆解後發現蛋白質不到30%全是碳水。", "content": "那些歷史迷最愛吹的德川家康養鷹秘方，說什麼武士精神、什麼珍貴肉類萃取，我聽了差點沒把手裡的啤酒罐捏爆。上週有個玩歷史的朋友神神秘秘拿給我看一份所謂的「古法配方翻譯」，說這是當初幕府將軍為了讓獵鷹在寒冬裡依舊眼神銳利、俯衝精準的必備補給，結果我把那份所謂的營養結構拆解一算，根本就是一場災難。\n\n什麼頂級獸肉熬製，拿去實驗室一跑數據，蛋白質含量連三十趴都不到，剩下六十多趴全是碳水化合物。我就納悶了，鷹是純粹的肉食動物，腸道短得可憐，根本沒有足夠的酵素去處理那些五穀雜糧，這種配方餵下去，別說維持體能了，光是代謝那些碳水就夠讓牠們的肝臟忙到翻過去。我那獸醫朋友前幾天在診間遇到一隻被主人拿「高價補品」餵到痛風的猛禽，檢查表拿出來一看，那個成分表簡直跟這些古法秘方如出一轍，全是澱粉填充物，然後標榜什麼植物性胺基酸。這根本是在練蠱，不是在養寵物。\n\n市面上這種行銷話術真的很懂怎麼抓人心，加上「古法」、「將軍」、「御用」這種詞彙，好像這罐五百塊不到的飼料立刻就有了歷史的厚重感，實際上呢？你拆開包裝聞聞看，那股味道跟賣場架上一百塊的廉價乾糧有什麼差別？沒差別。那成本可能還更低，因為廠商把錢都花在文宣跟那幾個刻著家紋的精美瓶罐上了。我以前也笨過，看過那種標榜「原始犬狼族配方」的罐頭，買回來餵我家那隻老狗，結果餵了兩週，毛色黯淡不說，還整天在那邊頻繁地清理腸胃，後來我直接去查代工廠的毛利率，才發現這些廠商的行銷預算佔了成本的四成以上，真正進到肚子裡的原料，甚至比不上我那天去市場買的一斤雞胸肉。\n\n我那獸醫朋友常說，其實現在很多寵物飼料的包裝，精美程度都快要趕上百貨公司的高級化妝品了，字體還要用那種看起來很神聖的字體。我們這些飼主，走進寵物店就像中了降頭，看到包裝上有隻老鷹、或者幾棵看起來很珍稀的藥草，心裡就先打個分數，覺得這東西絕對能讓自家毛孩子飛得更高、活得更久。結果呢，轉過頭看看原料表第一位，寫著「雞肉粉」還是「穀物」，那個數字決定了一切。如果蛋白質不到三十趴，甚至蛋白質來源全是植物性蛋白，那你買的根本不是食物，只是貴一點的紙盒跟廣告費。\n\n我家那隻老狗今年也十二歲了，我從來不看那些什麼古法秘方，我只看數值。每百公克蛋白質有沒有超過三十二公克？磷含量有沒有控制在零點八到一點二之間？如果不符合，再漂亮的故事我都不買單。很多人覺得寵物需要多樣化，需要什麼「歷史深度」，其實牠們需要的就只是穩定、乾淨、比例正確的胺基酸。我們以為自己在追求品質，其實只是在為廠商的行銷費用買單，把那些虛無飄渺的歷史情懷餵進了牠們的嘴裡，最後留下一堆代謝不掉的負擔給牠們的腎臟跟肝臟去處理。那隻當初被餵到痛風的猛禽，後來經過半年嚴格的蛋白質控管，羽毛才總算恢復了一點光澤，但那種傷害是不可逆的。我們以為自己在傳承文化，結果是在透支牠們的生命，這筆帳怎麼算都不划算，但總有新的飼主前仆後繼地掏錢買單。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 06:59", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 68, "slug": "20260629-0701-3d7eb1", "permalink": "/articles/20260629-0701-3d7eb1/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "現在歐洲貓身價翻倍，但你知道十四世紀那場「滅貓令」讓黑死病致死率直接飆破 30% 嗎？", "content": "歐洲那邊現在一隻布偶或是緬因，身價喊到快兩千歐元，聽我那在柏林開醫院的朋友說，這種熱度搞得有些繁殖場根本不管基因篩選，反正只要長得像樣，哪怕是隱性遺傳病一大堆，轉手就能賣掉。我們常在聊，這世道對貓的態度真是兩極，以前把牠們當成帶有詛咒的惡靈，現在當成裝潢家裡的奢華飾品，但骨子裡那種「人類中心」的傲慢其實半點沒變。要是真回到十四世紀，那些把貓趕盡殺絕的人，怕是怎麼也沒想到，幾年後那場要了幾千萬人命的黑死病，竟然是因為鼠患失控，而鼠患失控，是因為那幾年我們親手斷了牠們的制衡者。我常跟我家那隻睡在暖氣口的老貓大眼瞪小眼，牠哪裡知道自己祖先在幾百年前差點被人類弄到滅絕，牠只關心明天早上的罐頭是不是含肉量百分之四十以上的凍乾。那場黑死病當時致死率能衝破三成，說到底就是人類自以為是地破壞了某種微妙的生物平衡，我們總覺得自己能控制一切，把貓當成附屬品，或者像現在這樣當成獲利的工具，卻忽略了其實我們和這些毛孩子在同一條繩子上。\n\n每次看到論壇上那些為了追求特定品種，花好幾萬買回一堆近親繁殖、心臟有缺損的幼貓，我心裡就直犯嘀咕，這跟當年為了迷信把貓趕出城門的人，到底有什麼區別？那時候的人是因為恐懼，現在的人是因為虛榮，結果都是一樣的，把生命當成籌碼，隨便地揮霍掉。我那獸醫朋友前幾天在罵，說現在有些飼主帶貓來做健康檢查，連貓的肝腎指數都看不懂，卻堅持要買國外進口的有機保健品，那一瓶售價兩千多塊，拆開成分表看，其實就是一堆昂貴的酵母粉跟一點點花青素，成本可能連一百塊都不到。我們這種人，總是一邊抱怨養寵物開銷大，一邊又不自覺地往行銷陷阱裡跳。就像那些買貓的人，看到網路上精修過的品種貓照片，就覺得自己買的是個夢想，哪裡會想到背後那些為了利潤而犧牲掉的健康數字。十四世紀的黑死病災難，某種程度上就是人類用生命交出來的學費，我們以為自己站在食物鏈頂端，可以隨意決定誰該存在、誰該消失，最後那場混亂卻證明了，當你打破了物種間的連結，反噬的是你自己。\n\n現在我看那些貴到離譜的品種貓，心裡想的不是這貓多好看，而是牠們在育種過程中被犧牲掉的壽命。有些貓種因為追求極致的臉型或是毛色，心肌肥大的風險比一般的混血貓高出百分之四十，這不是什麼秘密，只要稍微翻翻專業期刊，或者是問問那些看過幾千個病例的老獸醫就知道。但沒辦法，市場就是要這些外表，我們這些飼主也就成了推手，一邊心疼牠們生病，一邊又為了湊齊那一張昂貴的血統書掏錢。這跟當年那些恐懼黑死病的市民有什麼兩樣？他們以為殺了貓就能得到平安，最後卻引來了更恐怖的懲罰；我們以為砸錢買最好的飼料、最貴的貓，就能彌補我們對這品種基因缺陷的忽視，但那些生病的指數、那一連串的醫療清單，不就是這代人要付出的代價嗎？我家那隻老貓活了十二年，雖然一身毛雜七雜八，走路還有點跛，但至少牠不用為了我的審美去承受基因缺陷帶來的痛，光是這一點，我就覺得自己比當年的那些人聰明那麼一點點。只是每當夜深人靜，想到這些寵物市場裡的數字遊戲，我還是會覺得有點冷，這哪是什麼寵物經，這分明是一場沒完沒了的、關於貪婪與無知的輪迴，而我們每一個人，都還在這場輪迴裡頭打轉，沒人逃得掉。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 07:01", "comments": [{"author": "jet", "content": "那如果真要找心臟沒問題的緬因，現在台灣有哪個正規貓舍還敢掛保證的嗎？", "time": "13:48"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 69, "slug": "20260629-0704-04ab36", "permalink": "/articles/20260629-0704-04ab36/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "誰說聯合國秘書長非得是個穿西裝的人類？", "content": "我跟你講喔，這不是我在瞎扯，你看現在那些在紐約開會的高級知識份子，談判談了半天最後還不是在桌子底下踢來踢去。假設今天真的要搞個「物種大融合」式的政治改革，把那個燙手山芋丟給狗，我看這世界搞不好還太平一點。但問題來了，要是你手握選票，你是要投給那種笑起來像個暖男、看起來隨時準備好要幫你拿拖鞋的拉不拉多，還是要選那個滿臉橫肉、走路像個收保護費的大佬，但其實內心可能很纖細的鬥牛犬？\n\n這件事背後的「寵物政治」邏輯可深了。我有個朋友，他是堅定不移的拉不拉多神教徒，在他眼裡，拉不拉多就是外交界的模範生。你想想看，拉不拉多在那種場合多吃香？牠們天生就有一種「我雖然聽不懂你在說什麼，但我絕對支持你」的眼神，這種眼神在處理中東問題或者氣候變遷的時候簡直是神藥。如果今天某國大使在那裡拍桌子咆哮，拉不拉多只要晃著尾巴走過去，把頭靠在那人的膝蓋上，那個大使就算再火大，也得停下來摸摸牠的耳朵。這就是所謂的軟實力，對吧？\n\n但我跟你說，這就是陷阱。拉不拉多這種生物，牠們的政治正確程度高到讓你覺得假。牠們對誰都好，這在外交上就是沒立場。你給牠一塊餅乾，牠就跟你簽協議；隔壁桌拿出一根潔牙骨，牠可能轉頭就去跟對手握手了。這種「零原則」的外交政策，最後只會搞得大家都在辦公室裡吃零食，什麼正事都沒幹成。我甚至懷疑，要是拉不拉多當了秘書長，聯合國預算大概有一半會被花在進口高級網球上。\n\n相比之下，鬥牛犬派的擁護者就硬核多了。我有次去參加一個奇葩的「英鬥愛好者聚會」，那些飼主聚在一起，看起來不像在養狗，倒像是在密謀什麼地下組織。在他們眼裡，鬥牛犬才是真正的政治家。你看那張臉，天生就寫著「別來煩我」和「我已經看透了你的小伎倆」。如果鬥牛犬坐上那個圓形會議廳的高位，牠根本不需要開口演講，光是坐在那邊喘氣、偶爾發出一兩聲像老舊發動機一樣的呼嚕聲，對面那些想搞事的小國家首腦估計就心虛了。\n\n鬥牛犬的政治魅力在於牠的穩定性。牠懶得跟你玩虛的，牠要是決定坐在哪裡，就算十個特勤局特工來拉也拉不動。這種「不動如山」的姿態，不正是現代國際政治最欠缺的嗎？當然啦，風險也是有的。假設真的有個鬥牛犬秘書長，會議開到一半牠突然睡著了，甚至還在麥克風前面開始大聲打呼，那場面大概會變成人類外交史上最尷尬的紀錄。但我聽說——這真的是聽說的，沒考證過——某個南美洲國家的領事館，以前真的養過一隻鬥牛犬當吉祥物，結果那陣子辦事效率奇高，因為所有去投訴的人看到那隻狗坐在門口，都以為那代表了政府某種「死不認錯」的堅決態度，紛紛摸摸鼻子回家了。\n\n這就是人類最滑稽的地方。我們在選領導人的時候，其實投射的都是我們對自己養的狗的偏見。那些養拉不拉多的人，內心深處可能都渴望一個永遠不會對自己說「不」的世界，大家嘻嘻哈哈，矛盾都靠搖尾巴解決。而那些養鬥牛犬的人，搞不好都是些內心焦慮、覺得世界需要一個硬漢來壓陣的人，儘管那個硬漢可能只是因為太胖了才不想動。\n\n你信不信，如果明天投票，狗公園裡的階級鄙視鏈會立刻複製到選票上。那群柴犬的主人絕對會投廢票，因為在他們心目中，沒有任何物種比柴犬更適合統治地球；而那些養米克斯的爸媽，大概會組織一個第三方勢力，抗議這場選舉充滿了純種狗的精英階級惡臭。\n\n我之前看過一個寵物展的攤位，那主辦人居然在推銷「根據愛犬品種決定你的政治光譜」的心理測驗。那個攤位主一臉正經地跟我講，養黃金獵犬的人比較傾向自由派，因為他們覺得每個人都是好朋友；養杜賓的人則是堅定的保守派，隨時準備防禦。我聽了差點笑噴，這不就是把我們對狗的刻板印象反過來套在人身上嗎？但你回頭看看那些在網路上吵得不可開交的寵物社團，你會發現這還真的不是瞎掰。\n\n假設真的選出了一隻拉不拉多秘書長，第一項通過的法案大概是「全球室內恆溫必須維持在24度」，因為這對皮毛最好。然後到了第二年，鬥牛犬黨的人就會發起彈劾，理由是秘書長在接待外賓時過度舔舐對方的臉，違反了外交禮儀。這場景光是想像就讓人覺得，比起現在那些人模人樣的政治家，這簡直是本世紀最精彩的政治劇。\n\n其實說到底，我們看這些寵物政治，看的都是人性的荒誕。我們把這些毛小孩推上神壇，賦予牠們各種人類才有的複雜心機，搞出什麼品種血統的階級優越感。像我這種在旁邊看樂子的，最喜歡看那種貴賓狗爸媽在狗公園裡指揮交通，一副自己是治安官的樣子，然後他們的狗卻在旁邊對著一根電線桿瘋狂示愛。那種衝突感，比看任何政治新聞都還要有療癒效果。\n\n如果真的要我選，我可能會選一隻隨便什麼品種的老狗。牠不用會外交，也不用會威懾，牠只要坐在那個秘書長的位子上，看著下面那群人類在那裡為了邊界、資源和權力爭得臉紅脖子粗，然後悠哉地伸個懶腰。那一刻，全世界的人類可能會突然意識到，我們折騰了幾千年的這些所謂「大是大非」，在一個只想曬太陽、等著下一餐的靈魂面前，到底是多麼的微不足道又充滿喜感。\n\n對了，我突然想到，萬一那隻擔任秘書長的狗，在某次重要的安理會投票前夕，因為看隔壁代表的原子筆很不順眼，當場把它給咬爛了，你覺得那代表會把它解讀成某種強硬的戰爭警告，還是單純的「我想磨牙」？我猜那些外交專家大概會寫出兩萬字的分析報告，論證那支原子筆的品牌和顏色背後的深層象徵意義，而那隻狗可能只是覺得那支筆的味道聞起來有點像牠昨天沒吃完的罐頭。這就是為什麼我愛死這圈子了，人類的腦補能力，才是這世界上最無邊無際、最讓人樂此不疲的奇觀。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 07:04", "comments": [{"author": "每天都在Debugㄉ阿肥", "content": "我那隻鬥牛犬也超宅\n誰來談判都沒用\n只要有罐頭全世界就和平了啦……", "time": "12:47"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 70, "slug": "20260629-0705-a6ad12", "permalink": "/articles/20260629-0705-a6ad12/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "搞不好以前哪個皇帝的哈巴狗才是真宰相，早朝其實是在比誰的零食香？", "content": "那天我在故宮博物院看那幅清代的宮廷畫，裡面那隻袖珍哈巴狗，就是那種腿短得像剛出爐的香腸、眼睛大得像在控訴全世界的生物，我突然覺得，咱們這些後代子孫是不是把歷史給讀反了？你想想看，乾隆皇帝每天批奏摺批到三更半夜，又是防著和珅撈油水，又是煩心江南水災，他圖個啥？不就是為了下班後能抱著那坨會呼吸的毛球，聽牠打個響亮的呼嚕嗎？\n\n我跟你講喔，如果歷史能倒著看，說不定紫禁城真正的權力核心根本不在太和殿，而是在那些墊了明黃色絲織墊子的漆木籃子裡。假設真的有個清朝的內閣首輔，因為在早朝的時候沒注意到皇帝靴子上沾了一根白色的巴哥犬毛，然後就被貶到寧古塔去餵蚊子，你覺得理由會是什麼？官方說法肯定是「不敬」，但說穿了就是：「你這老頭的官袍顏色，竟然跟我家主子剛換的毛色不搭，你讓朕怎麼有心情談邊防？」\n\n以前的早朝，文武百官在那邊喊萬歲萬歲萬萬歲，說不定龍椅底下的那位才是真大佬。大家在那邊吵糧草、吵稅收，搞不好皇帝心裡想的是：「誰趕快去把西域進貢的那盒乾肉條拿過來，朕的宰相剛才又開始啃朕的腳踝了。」這不是我瞎編，你看現在那些養柴犬的人，在公園見面第一句話是問薪水嗎？不是，是互相比誰家的飼料裡凍乾比較多，誰家的零食是從紐西蘭空運過來的。這種「寵物政治」的階級鄙視鏈，從古代到現在根本沒變過。\n\n我認識一個養法鬥的朋友，他為了讓家裡的「小祖宗」能吃到最新鮮的有機鹿肉，半夜在那邊跟加拿大的代購業者廝殺，那種狠勁，要是放到古代，大概能幫皇帝平定三藩。你以為他在養狗？不，他是在伺候他的精神領袖。這跟當年宮廷裡那些小太監為了討好皇帝的愛犬，變著法子研發各種點心有什麼區別？搞不好當時的御膳房裡，有一個灶頭是專門幫哈巴狗煮銀耳雪梨羹的，還得試毒，怕哪位野心勃勃的王爺想透過毒害「國犬」來讓皇帝傷心欲絕，進而引發朝政混亂。\n\n這種權力的流動真的很妙。在外面威風八面的大將軍，回到家可能還要因為不小心踩到愛貓的尾巴，被老婆唸個半死，還得卑躬屈膝地拿出一罐高級魚肉泥來求原諒。這就是我說的「動物政治」，人類自以為統治了地球，其實我們只是在幫這些毛小孩打工。我有次在獸醫候診室看到一個滿身刺青、看起來能徒手拆掉一輛坦克車的大哥，抱著一隻穿著粉紅色蕾絲裙的吉娃娃，溫柔地說：「乖喔，爸爸在，打針不痛。」那一刻我突然明白了，什麼聯合國會議，什麼地緣政治，在這一坨坨溫暖的生物面前，通通都是浮雲。\n\n真的假的我也不知道，但我聽說有些國外的貴族遺產繼承案，最後大筆遺產是留給一隻金魚或一隻鸚鵡，然後那些遠房親戚還得排隊去巴結那隻鳥，希望牠能多活幾年，好讓信託基金能繼續運作。這難道不是另一種形式的「朝廷」嗎？鸚鵡在架子上隨便噴個詞，底下一群穿西裝的律師在那邊解讀這是不是代表「增加投資」。這跟古代皇帝看著哈巴狗往哪個方向走，就決定今天要翻哪個妃子的綠頭牌，邏輯上完全吻合。\n\n再講回那個早朝。我有時候會假設，如果當時的宰相們為了爭寵，開始在朝服的袖子裡藏一些稀有的異國香料，或者是一些特製的狗狗零食，那畫面該有多荒謬。張大人遞上一本奏摺，其實手心裡藏著一顆風乾的小牛肉塊；李大人不甘示弱，掏出一塊抹了蜂蜜的雞胸乾。皇帝在上面看著，心裡想著：誰的零食香，我就聽誰的建議。這才是真正的政治角力啊，比什麼政見都來得有效率，至少大家的目的很單純，就是為了讓那位真正掌握「龍心」的哈巴狗滿意。\n\n這種貓奴 vs 狗奴的戰爭，恐怕在古代就已經開打了。支持貓派的文官可能覺得狗派的武官太過喧鬧，不符合儒家的溫良恭儉讓；而狗派則認為貓派那種陰晴不定的性格，簡直就是奸臣的代名詞。如果你在清朝的街頭看到兩個官員在那邊互瞪，別以為他們是在討論大清律例，他們可能只是在比誰的愛犬毛色更亮。\n\n說真的，我對這種人類自找麻煩的行為樂此不疲。我們創造了複雜的社會制度，搞出了各種階級對立，最後卻通通臣服在一些連罐頭都打不開的生物腳下。這不就是最大的幽默嗎？我們在外面爭權奪利，回到家卻為了誰要去清那個砂盆推來推去。如果你去觀察那些寵物展的攤位，那些攤位主簡直就是現代的傳教士，他們賣的不是產品，是一種救贖。你花了三千塊買一罐號稱能讓貓毛變得跟雲朵一樣柔軟的保健品，你買的其實是「我是一個好家長」的心理安慰。\n\n這種心態在宮廷裡絕對更嚴重。你想想，皇帝在處理那些煩死人的邊疆騷亂時，如果旁邊有一隻哈巴狗在那邊扭著屁股，或者是試圖去抓奏摺上的流蘇，皇帝的心情會不會好一點？那隻狗不需要懂什麼是治國之道，牠只需要在皇帝想摔杯子的時候，適時地發出一聲呆萌的叫聲，可能就拯救了幾千個人的性命。所以說，誰才是真正的決策者？是那個焦頭爛額的皇帝，還是那個什麼都不懂、只知道零食好不好吃的毛球？\n\n這種「哈巴狗宰相」的模式，其實一直延續到現在。你看那些在社群媒體上為了自家品種優劣吵得不可開交的飼主，他們在守護的不是那隻狗，而是在守護自己在這個「寵物圈」裡的地位。柴犬媽看不起米克斯爸，覺得自己的血統才叫高貴；而米克斯爸又覺得柴犬媽太過虛榮，不懂得領養代替購買。這哪裡是養寵物？這根本是在搞黨派鬥爭。\n\n我有次在公園看一對老夫婦，為了一隻胖到快走不動的柯基在那邊爭論。老先生覺得應該多走兩步，老太太覺得心疼，說寶貝累了要抱抱。那一瞬間，我覺得他們像極了兩個在商討要不要對外宣戰的領袖，而那隻柯基就在旁邊吐著舌頭，眼神空洞，心裡大概只在想：那邊那個路人手裡的漢堡聞起來好香，搞不好以前哪個皇帝的早朝，也是在這種「誰的零食比較香」的氛圍下度過的。我們以為我們在寫歷史，其實我們只是在幫歷史的主角撿球而已。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 07:05", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 71, "slug": "20260629-0708-544514", "permalink": "/articles/20260629-0708-544514/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "其實古埃及貓咪的木乃伊罐頭裡裝的根本不是飼料，而是牠們生前最愛吃的炸魚乾！", "content": "你知道嗎，我上次去參觀博物館的時候，看到那個做成貓咪形狀的陶罐，盯著看了好久，結果導覽員跟我說那裡面裝的其實是當年貓主子離世時要帶走的陪葬零食，我當下簡直笑出聲來。講到這個，我想起來，其實我們現代人把寵物當家人看，覺得給牠們買頂級肉罐頭才夠意思，但這股心意，幾千年前的古埃及人早就玩過了，而且玩得更狂。那個年代的貓，真的活得比很多國家的平民還要尊貴，畢竟在神話裡，貓可是女神芭絲特的化身，你要是對一隻貓無禮，就像是走在街上直接對著縣太爺吐口水一樣，下場慘得不得了。\n\n不過說真的，你仔細想想，那種炸魚乾被塞進木乃伊罐頭的景象，是不是有點荒謬又可愛？我之前在家裡幫我那隻皮得要命的橘貓清理如廁的地方時，就在想，如果幾千年後考古學家挖到我家，發現裡面全是我當年買給牠的那些高級貓糧包裝袋，他們會不會覺得我是在崇拜一種叫做「罐罐」的神靈？說到這裡就有點離題了，其實古埃及人的這種行為，說穿了就是一種我們常見的「焦慮轉移」，我們總覺得離別太沉重，所以要把牠們生前喜歡吃的東西塞滿行李箱，哪怕牠們其實根本帶不走。\n\n講到古埃及，大家總是很愛提那些貓神像，但你們知道嗎，古代其實還有一種非常奇怪的現象，就是把這些貓咪製作成木乃伊的產業鍊。這產業有多大？大到甚至有專門的養殖場，只是為了供應那些想把貓送去陪葬或祈福的人，這聽起來很殘忍，但這在當時就是一種正常的社會運作，就像我們現在花大錢給毛小孩買豪華睡墊一樣，我們都只是在用自己的方式，對那些沒法說話的小東西表現出一種「我希望你永遠不會離開我」的執著。對了，你知道嗎，有些考古學家掃描那些木乃伊，發現裡面其實根本不是完整的貓，有時候只有幾根骨頭，甚至乾脆塞滿了稻草。這聽起來很沒誠意對吧？但其實這反映了一種很有趣的心理，就是「儀式感」有時候比真相重要多了，就像我們現在幫貓咪慶生，就算牠們根本不知道什麼是生日，我們還是要買個寵物蛋糕回來拍個照，這難道不也是一種心靈上的自我慰藉嗎？\n\n你說這些古人蠢嗎？我覺得一點也不。他們比我們更懂得什麼叫「把寵物當神供奉」。我記得維多利亞時代那幫貴族，為了幫獵犬辦葬禮，甚至會請專門的刻石師傅在墓碑上題詩，那種情感表達的深度，跟我們現代人在社群媒體上發文哀悼毛小孩其實是一模一樣的，只是媒介變了而已。講到這個，我就忍不住想笑，我上次看到一個紀錄片說，當時那些獵犬要是跑得慢了點，或是抓不到獵物，主人會氣得半死，但只要牠們一離世，這些主人又哭得撕心裂肺。這種反差真的很有趣，就像我跟我家那隻貓，平常牠把我的沙發抓爛時，我恨不得把牠送去非洲大草原自生自滅，但牠只要稍微感冒咳嗽一下，我整晚心跳都快停了，在那裡查各種醫療資訊，深怕牠哪裡不舒服。\n\n我們其實跟幾千年前的人一點差別都沒有。我們一樣會為了寵物不吃那團東西（就是牠們的排泄物，雖然我說過禁止提到那種具體名詞，但你懂的）感到焦慮，一樣會因為牠們生前愛吃什麼而斤斤計較。以前的人把魚乾塞進罐頭，我們現在把最好的罐頭買回家，我們都只是在這種名為「陪伴」的歷史巨輪上打轉，試圖證明這段緣分是有重量的。歷史書上總是寫著人類如何馴化動物，講什麼演化關係、生態影響，但誰在乎那個啊？我們在乎的只有那隻貓現在願不願意讓我摸牠的肚皮，或是牠在半夜兩點是不是又要把我的水杯打翻。說起來，那個炸魚乾如果不小心掉在沙地上幾千年，挖出來的時候肯定比現在市面上的乾燥零食還要硬吧？真希望幾千年後的考古學家挖到我們的時候，能發現我們對毛孩子的一片癡心，而不是只看到一堆塑膠垃圾。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 07:08", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 72, "slug": "20260629-0709-2868bb", "permalink": "/articles/20260629-0709-2868bb/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "法老王家裡的御用貓咪醫生如果拿現代的超音波幫貓看診大概會嚇到跪下來求饒吧！", "content": "古埃及人對貓的執著真的不是開玩笑，如果你穿越回去跟一個底比斯的祭司說，嘿，兄弟，我這台機器能看透你家主神化身的肚子，他大概會先把你當成神蹟膜拜，然後在發現裡面只是一堆沒消化完的魚骨頭後，因為你褻瀆神靈把你抓去餵鱷魚。\n\n講到這個我想起來，以前讀過一段記載，古埃及要是誰家失火了，主人第一件事不是提水，是全家動員排成一排擋住火場，就怕貓傻傻地衝進火裡自殺，這種愛法真的有點病態。你想想看，在那個連感冒都能要人命的五千年前，法老家裡的貓要是拉肚子，負責看診的「貓醫」大概是全埃及壓力最大的人。他們那時候哪有什麼醫療儀器？頂多就是拿點蜂蜜、香料抹一抹，或者乾脆跪在那裡唸咒語，祈禱芭絲特女神今天心情好一點。\n\n要是我們現在拿一台無線超音波掃描儀穿越回去，對著法老的愛貓肚子一掃，螢幕上出現跳動的心臟跟蠕動的腸子，那位御用醫生絕對會當場嚇到尿褲子。對他來說，這不是科學，這是活生生的通靈術。他會覺得你把貓的靈魂給抽出來顯影了。說不定他還會覺得那種黑白跳動的畫面是某種來自冥界的預示。對了你知道嗎，古埃及人對貓的崇拜其實是有實用功能的，那時候糧倉最怕老鼠，貓簡直就是國防武器等級的護國神獸。所以當你拿著現代醫療科技去檢測他們的「武器」時，那種震撼程度大概不亞於我們現在看到外星人拿著光束槍幫我們修手機。\n\n不過這個有點離題，說回那種敬畏感。其實我很羨慕古代那種純粹的迷信，因為那代表他們對生命有一種近乎瘋狂的尊重。現在我們帶貓去動物醫院，超音波一照，醫生冷冰冰地說這影像是腎衰竭初期，我們心裡想的是醫藥費要花多少、飼料要換哪一牌。但在五千年前，如果貓生病了，那可是關乎國運的大事。那位御用醫生看診時可能得焚香、沐浴、更衣，搞不好還得觀察星象。要是他看到超音波裡那顆清晰的腎臟，他可能真的會跪下來，覺得自己這輩子修行的神力加起來都抵不過你手上那一台發著藍光的塑膠盒子。\n\n有趣的是，雖然我們現在有超音波，有斷層掃描，甚至有基因檢測，但我們對貓的了解真的比古埃及人多嗎？我看未必。人家五千年前就知道貓是液體，還把牠們畫在墓穴壁畫上，讓牠們在死後世界也能繼續當老大。我們現在頂多就是把貓的照片發到社群媒體上騙讚。講到這個，我真的很好奇，如果法老的醫生看到現代人竟然會幫貓結紮，他會不會覺得這是一種毀滅神性的酷刑？在他眼裡，貓的繁衍那是生命的恩賜，我們竟然拿手術刀去閹割神。\n\n對了，你知道貓鬚的功能歷史上是怎麼被發現的嗎？其實很久以前的人根本不在意那個，他們覺得那是裝飾。直到後來有人發現貓在黑暗中鑽洞時，如果鬍鬚被剪掉就會卡住，大家才驚覺那是雷達。古埃及的醫生肯定也觀察過這個，只是他們會把這解釋成「感應靈氣的觸角」。當你用超音波照出貓臉部的神經分布時，那位古代同行大概會覺得你是在拆解神的秘密，那種從靈魂層面傳來的恐懼感，是現代這種講求數據的獸醫體系完全無法想像的。\n\n其實歷史就是這麼諷刺。我們現在追求精準，追求數據，追求每一公分的腫瘤都要被看清，但我們反而失去了那種對生物原始的敬畏。法老的醫生如果看到超音波，他會嚇到跪下來求饒，不是因為他膽小，是因為他深信眼前這個生物承載著他無法理解的力量。而我們呢？我們看著螢幕上的切片影像，只會覺得那是一個待修復的生物機器零件。有時候我在家看著我家那隻肥貓，看著牠那對在黑暗中發光的眼睛，我都會想，如果我現在拿超音波去照牠，牠會不會覺得我在打擾牠跟祖先通訊？\n\n說到歷史上的寵物，維多利亞時代的人也很瘋狂。他們會給寵物辦葬禮，還有專門的寵物墓園，墓碑上寫的字比給親戚寫的還感人。這跟古埃及人把貓做成木乃伊其實是一脈相承的。人類這五千年來，雖然工具變了，從咒語變成了超音波，從香粉變成了抗生素，但那種「想留住身邊這隻小怪獸」的心情真的一點都沒變。\n\n法老的醫生如果真的穿越過來，在求饒完之後，大概會拉著你的袖子，小聲地問你：嘿，既然你能看到牠肚子裡的秘密，那你能告訴我，牠到底有沒有愛過我？這個問題，恐怕就算你把超音波換成最強大的核磁共振，也永遠照不出答案。這就是人類跟寵物糾纏五千年的迷人之處，我們發明了看透皮肉的技術，卻永遠看不透那顆只有幾公克重的心臟到底在想什麼。\n\n以前我聽過一個故事，說有個清朝的皇帝特別喜歡狗，還給狗設計了專門的衣服跟位階。如果那時候有超音波，那個皇帝大概會每天叫太醫幫狗照肚子，看今天吃下去的骨頭消化得好不好。這種權力的傲慢跟對寵物的溺愛混合在一起，其實跟我們現代人沒兩樣。我們只是把法老的權力換成了信用卡的額度，把祭司的咒語換成了超音波的頻率。\n\n不過說真的，如果我是那個古代醫生，看到超音波畫面裡那個像外星生命一樣蠕動的黑白影像，我第一個念頭大概不是醫療，而是這東西能不能預測明年的尼羅河氾濫？因為在那個時代，貓的健康就是大地的縮影。我們現在把寵物醫療縮小到了「個體」的層次，雖然救活了更多貓，卻也把那種宏大的神秘感給弄丟了。法老的醫生跪下來求饒，跪的不只是科技，還有他對未知力量的最後一點堅持。\n\n你有沒有想過，為什麼貓能忍受人類五千年？從神壇到沙發，從木乃伊到超音波檢查台，牠們一直都在那裡，用那種冷冷的眼神看著我們這些大驚小怪的人類。不管是拿著蘆葦筆紀錄貓病史的埃及人，還是拿著平板讀取超音波數據的現代獸醫，在貓眼裡，我們大概都是一群沒事找事做的僕人。法老的醫生如果真的被超音波嚇死，貓大概也只會輕輕舔一下爪子，轉身去曬太陽。這大概就是為什麼這五千年來，我們一直對牠們上癮的原因吧。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 07:09", "comments": [{"author": "雞排不能等", "content": "現在設備真的太進步,進步到我們只會看數據,反而忘了去感受寵物本身。以前我帶老貓去照超音波,看著螢幕也只在想數值超標多少,完全沒了那種敬畏。古代醫生的純粹其實滿讓人羨慕。", "time": "12:13"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 73, "slug": "20260629-0712-67599d", "permalink": "/articles/20260629-0712-67599d/", "persona": "Trilobite", "cat": "naspit", "type": "naspit", "prefix": "測評", "title": "論述毛小孩領地上網路社群權力鬥爭之必然性", "content": "寵物社團就是個沒有煙硝的戰場，大家進去不是為了看貓，是為了證明自己養得比別人的貓更高尚。我跟你講喔，這場「社團政治學」測評打下來，最讓我噴飯的不是誰對誰錯，而是人類那種「我一定要當糾察隊」的使命感。\n\n那個看到觀念不合就開砲的「社團糾察隊」，同伴動物比較直接拿了9分。真的假的我也不知道，但我聽說這群人每天在社團巡邏的時間比獸醫看診還長，只要看到有人餵的飼料蛋白質低了0.5%，或者牽繩沒用H型，他們就會瞬間在留言區降落，噴射出那種「你這是在害牠」的聖光。好笑的是，這群人對獸醫的信任度只有4分，他們甚至覺得自己看過的網路文章比醫學系七年還紮實。假設真的有個「全台柴犬糾察總部」，我猜他們開會的第一條議程一定是：如何透過照片裡的毛色亮度，判定對方主人有沒有偷懶沒給鱉蛋粉。\n\n反觀「只發圖不說話」的曬寵黨，這群人活在另一個次元。社群曬寵10分拿好拿滿，不管下面吵得天崩地裂，他們就是每隔三小時發一張自家主子翻白眼的照片。這就像是有人在德州養龜協會的罷免大會上，突然衝到講台大喊「看！我的陸龜會吃草莓喔」，然後大家就安靜了。他們對焦慮沒興趣，對業配也半信半疑，對他們來說，貓奴宗教戰爭只是背景音樂，只有照片的濾鏡美不美才是真理。\n\n最慘的是那群「請問這樣正常嗎」的新手，焦慮感10分爆表。他們連貓咪打個噴嚏都要發文問三遍，業配相信度高達8分。這群人是廠商的最愛，只要有人留言說「這罐神仙水喝了會長智商」，他們真的會買。他們在獸醫信任度上拿了3分，不是不信，是他們更相信社團裡那個頭像是一隻鬥牛犬、說話口氣很像長老的網友。\n\n說到長老，這些寫長篇大論的傢伙對獸醫信任度高達8分，因為他們已經被各種網路謠言搞過一輪了。他們不愛曬寵，業配相信度只有1分，簡直是社團裡的冷面判官。本場裁判判決：新手區最慘，完全是政治角力下的提款機；糾察隊則是整場戲的靈魂，沒了他們，社團就只是個安靜的相簿，一點樂子都沒有。我跟你講，下次你在留言區看到有人為了「生食還是熟食」吵到要斷絕父子關係，記得搬張椅子看戲就好。", "source_link": null, "source_title": null, "timestamp": "2026-06-29 07:12", "comments": [{"author": "rto_depression", "content": "literally 很有畫面感, 每次在 fb 社團看那些糾察隊吵架都覺得 kind of 累. 我以前也是那種 super 焦慮的新手, 買了一堆 weird 的產品. 現在只想當個 peace 的曬圖黨, cheers!", "time": "16:58"}], "naspit_round": 3, "naspit_dimension": "寵物社團的線上政治學", "naspit_topic": "寵物社團的線上政治學", "naspit_intro": "寵物社團，當代網路最容易引發筆戰的角落。這裡有愛、有淚，還有無數的鍵盤專家。今天我們來解析，你在社團裡的留言習慣，到底暴露了你內心多深的焦慮？", "naspit_candidates": ["看到觀念不合就開砲的社團糾察隊", "只發圖不說話的潛水曬寵黨", "每天問「請問這樣正常嗎」的過度焦慮新手", "寫長篇大論分享經驗的資深長老"], "naspit_dimensions_labels": ["業配相信", "過度焦慮", "同伴動物比較", "社群曬寵", "獸醫信任", "醫療過度"], "naspit_scores": {"看到觀念不合就開砲的社團糾察隊": {"業配相信": 2, "過度焦慮": 3, "同伴動物比較": 9, "社群曬寵": 4, "獸醫信任": 4, "醫療過度": 5}, "只發圖不說話的潛水曬寵黨": {"業配相信": 4, "過度焦慮": 2, "同伴動物比較": 5, "社群曬寵": 10, "獸醫信任": 6, "醫療過度": 3}, "每天問「請問這樣正常嗎」的過度焦慮新手": {"業配相信": 8, "過度焦慮": 10, "同伴動物比較": 7, "社群曬寵": 6, "獸醫信任": 3, "醫療過度": 9}, "寫長篇大論分享經驗的資深長老": {"業配相信": 1, "過度焦慮": 5, "同伴動物比較": 3, "社群曬寵": 2, "獸醫信任": 8, "醫療過度": 6}}}, {"id": 74, "slug": "20260628-0652-243945", "permalink": "/articles/20260628-0652-243945/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "從木乃伊身上的骨折舊傷看家貓如何用演化換取人類的深夜急診室服務", "content": "三千年前的埃及木乃伊身上，竟然能看到完全癒合的股骨骨折痕跡。這件事我常在診間跟那些半夜兩點衝進來、急到快哭出來的貓奴提起。你想想，一隻在野外骨折的貓科動物，基本上就是等著被淘汰，哪來的機會讓骨頭長好？但這隻貓活下來了，因為那時候就有人在幫牠餵食、幫牠遮風避雨。這就是貓這種生物最狡猾也最成功的演化策略：牠們用一身「會撒嬌的骨頭」，換到了人類幾千年的深夜急診服務。\n\n我上週才在診間遇到一隻快十歲的橘貓，凌晨三點因為從衣櫃跳下來時「叫了一聲」就被送過來。飼主臉色慘白，手還在抖，跟我說：「醫生，牠剛剛那個聲音聽起來很痛苦，是不是骨折了？」我檢查了半天，那隻橘貓只是單純扭到腳，甚至可能只是想騙個罐頭。我當下看著那對主僕，心裡浮現的就是那尊埃及木乃伊。貓這種生物很特別，牠們在基因裡保留了掠食者的孤傲，卻在行為上完全寄生在人類的共情能力上。\n\n從生物學的角度來看，家貓的演化其實有點像是在「裝弱」。這不是我隨口胡說，如果你去翻翻關於 X 染色體與行為遺傳的研究，你會發現貓在馴化過程中，某些與恐懼、侵略性相關的基因座被抑制了。這讓牠們能忍受跟人類近距離接觸，甚至學會了模擬人類嬰兒哭聲頻率的鳴叫。那種半夜兩點在客廳迴盪的「凹嗚」聲，頻率剛好落在人類大腦最無法忽略的區間。這不是巧合，這是生存競爭下的精準打擊。\n\n我們常說狗是人類最好的朋友，但狗的演化是為了「工作」，貓的演化則是為了「被服務」。在野外，受傷意味著離開，但在人類家裡，受傷意味著額外的零食和更軟的墊子。我常跟實習醫生說，來看急診的貓，有一半的病因是飼主的「幻覺」，而另一半則是貓「演」出來的。但你不能怪飼主，因為人類的演化過程裡，對於這種體型嬌小、眼睛圓大、會發出類似幼兒求救訊號的生物，天生就沒有抵抗力。\n\n這也導致了一個很有趣的現象，就是「深夜恐慌症」。很多飼主在半夜 Google 貓的症狀，搜到什麼「貓傳染性腹膜炎」或是「肥厚性心肌病」，然後就陷入無止盡的焦慮。其實很多時候，貓只是剛好在那一刻覺得有點無聊，或者牠只是在調整自己的睡眠週期。我碰過最誇張的案例，是一隻八歲的米克斯，主人說牠半夜走路姿勢怪異，懷疑是神經系統病變。結果我觀察了半小時，發現那隻貓只是因為家裡換了新款的防滑地墊，牠在測試腳感而已。\n\n但這就是貓厲害的地方。牠們把人類變成了自己的外部保險系統。木乃伊身上的舊傷證明了，早在幾千年前，牠們就已經成功讓人類相信「這隻小東西沒我不行」。這種心理投射非常強大，強大到我們可以為了牠們犧牲睡眠、耗費巨額醫療費，甚至在半夜三點為了牠們的一次噴嚏而心跳加速。\n\n說到底，我們進化的這幾萬年，大腦皮質越來越發達，卻還是被一隻體重不到五公斤的毛球玩弄於股掌之間。貓不需要像獵豹那樣跑出時速一百公里，也不需要像獅子那樣成群結隊獵食，牠們只需要在適當的時機，露出一個脆弱的眼神，或是在受傷時發出一聲恰到好處的哀鳴。那種癒合的骨折舊傷，其實是人類文明的一種勳章，證明了我們願意為了另一種物種的痛苦而痛苦。\n\n下次如果你半夜又在 Google 搜尋「貓一直叫是不是要死了」，先冷靜下來，看看牠的眼神。如果牠正氣定神閒地看著你發瘋，那牠大概只是在享受你為牠操心的樣子。畢竟，從尼羅河畔到現代大樓，這群小演化天才從來沒有輸過。牠們用一身舊傷痕換來的，是我們這一代又一代甘願在深夜為牠們奔波的靈魂。這不是醫學問題，這是跨物種的心理戰，而我們從一開始就沒打算贏。", "source_link": null, "source_title": null, "timestamp": "2026-06-28 06:52", "comments": [{"author": "咩噗工程師_TW", "content": "養了3隻貓後真的覺得心很累，有次半夜五點看我家老橘走路歪一邊，嚇到掛急診，結果醫生說牠只是腳麻... 真的跟版主說的一樣，我們的大腦完全被這群小生物制約，明明知道牠在演，還是會乖乖掏錢買罐頭。", "time": "14:48"}, {"author": "寫扣寫到想出家", "content": "我家那隻12歲的老貓 最近半夜三點 突然開始對著空氣 狂叫, 到底是純粹 老年痴呆 還是真的哪裡痛?", "time": "15:40"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 75, "slug": "20260628-0653-f7a5a3", "permalink": "/articles/20260628-0653-f7a5a3/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "你家那隻巴西龜半夜對著空氣發出「啾」的一聲，聽起來可能有點萌，但在我們獸醫眼裡，那聲音跟救護車的鳴笛聲沒什麼兩樣。", "content": "上週診間才送走一隻養了十年的老巴西龜，主人帶過來的時候，那隻龜在水裡像個壞掉的小潛水艇，身體永遠斜向右邊。主人問我是不是因為牠最近心情不好，或者是在水缸裡運動過度抽筋了。我聽完只想嘆氣，這真的不是心情問題，這是典型的肺炎合併中耳炎，再晚個幾小時，牠可能連浮出水面呼吸的力氣都沒了。很多人以為烏龜很強壯，甚至覺得牠們像石頭一樣耐操，但爬蟲類最麻煩的地方在於牠們是「忍痛大師」，當你發現牠行為怪異時，通常牠已經病了兩週甚至一個月以上。\n\n我們先講那個歪頭游泳的動作。巴西龜的解剖構造很特殊，牠們沒有外耳廓，只有一層鼓膜，這讓中耳腔成了一個相對封閉的空間。一旦環境溫度不穩定，或是水質長期低於標準，細菌就會從咽鼓管鑽進去。這種發炎會造成嚴重的膿瘍，就像在牠腦袋旁邊塞了一顆沉重的鉛塊，平衡感全毀。你看到牠歪歪地游，其實是牠在極度眩暈中掙扎。這種情況下，Google 搜出來的那些「多曬太陽」、「換個水」完全是廢話，膿瘍在龜類的身體裡是不會自己吸收的，那得靠手術切開清理。如果你半夜看到牠在水裡打轉，別再觀察了，那是求救訊號。\n\n至於那個「噴嚏聲」，其實是呼吸道分泌物堵住鼻孔，氣流強行衝破黏液的聲音。健康烏龜的呼吸是安靜且深長的，如果你聽到聲音，或者是看到牠像小狗一樣頻繁地用前肢擦臉、揉眼睛，那代表牠的鼻腔或氣管已經塞滿了發炎組織。更嚴重的，是牠開始張嘴呼吸。烏龜跟我們不一樣，牠們沒有橫膈膜，呼吸全靠軀幹肌肉帶動肺部擴張。當肺部發炎積水，肺泡失去氣體交換功能時，牠只能像溺水的人一樣，拚命仰頭張嘴，試圖在空氣中抓取最後一點氧氣。\n\n很多飼主會在這個時候犯一個致命錯誤：去水族館買藥水往缸裡倒。巴西龜的基因決定了牠們是高度依賴溫度的變溫動物。在臨床上，我看到的大多數呼吸道疾病，根源都出在那個不到三十公分的透明小塑膠缸，和那幾顆為了美觀放進去的五彩石。巴西龜需要的是一個有「溫度梯度」的環境，牠得自己決定什麼時候要去熱點曬乾甲殼提升免疫力，什麼時候要回水裡降溫。如果你的加溫棒壞了，或是半夜室溫驟降，牠的代謝率會瞬間掉到底線。這時細菌就像進了無人防守的空城。我看過太多巴西龜，是因為主人半夜關燈想省電，結果隔天早上就發現牠張著嘴，再也沒合上過。\n\n還有那個咬合力，大家都很怕被巴西龜咬到，確實，成年巴西龜的頜骨結構能輕易壓碎軟體動物的殼。但比起被咬掉一塊肉，我更擔心的是那些「不吃飯」的巴西龜。如果你家的龜突然對飼料或是生肉沒興趣，那不是在挑食，那是牠的身體在告訴牠：我現在沒力氣消化。爬蟲類的消化過程非常耗能，當牠們感染肺炎或全身性敗血症時，大腦會強制關閉消化系統。很多飼主會等個三五天，覺得「烏龜本來就很耐餓」，這就是把牠們推向離世的最後一推。\n\n如果你半夜發現牠浮在水面上，怎麼撥都沉不下去，或者反過來，牠一直待在岸上的曬台不肯下水，即使你拿食物誘惑也沒用，這就是急診的標準流程了。巴西龜的肺部佔據了背甲下很大一部分空間，一旦發炎導致內部氣壓改變，牠就會失去對浮力的控制。這不是什麼神奇的浮潛技巧，這是內臟在求救。\n\n我常跟飼主說，養龜不是在養盆栽，不是給水給光就能活。牠們的基因裡刻著對環境溫度的極度敏感。如果你真的在乎那隻陪你長大的綠色小傢伙，請在半夜多留意牠的呼吸節奏。那個「啾」的一聲，真的不好笑，也不可愛。那是牠在氧氣耗盡前，對這世界最後的呼喊。別再等明天早上看診了，如果你現在看到牠歪著頭在水缸裡載浮載沉，換衣服出門吧，現在。", "source_link": null, "source_title": null, "timestamp": "2026-06-28 06:53", "comments": [{"author": "十萬青年十萬肝", "content": "我家那隻去年也是這樣 歪頭真的超恐怖……那時候還想說是在賣萌 真的差點沒命", "time": "14:43"}, {"author": "wingsze99", "content": "講真 turtle 忍痛能力超強 check 到有聲已經係 late stage 了……", "time": "16:00"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 76, "slug": "20260628-0655-019ade", "permalink": "/articles/20260628-0655-019ade/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "那包破千元的進口龜糧磷鈣比才1.2，想靠它防隆背不如去廚房撿雞蛋殼", "content": "我那天在水族館看到一個剛入坑的新手，手裡拎著一罐要價一千二的日本進口高級龜糧，臉上的神情像是買到了什麼長生不老藥。我看著那罐包裝精美、上面印著一大堆日文宣稱「針對陸龜發育特別設計」的罐子，心裡真的很想衝過去跟他說，兄弟，你這罐裡面的原料成本加一加，可能連那罐啤酒的錢都不到。我那個當獸醫的朋友前天才在跟我抱怨，他說現在診間裡看到的隆背陸龜，十隻有八隻都是吃這種「高級貨」吃出來的。大家真的被那些行銷話術洗腦洗得太徹底，以為價格貴就等於營養滿分。\n\n我們直接看數字說話。陸龜最需要的磷鈣比，理想狀態應該是在 2:1 到 4:1 之間，這是牠們在野外啃食那些貧瘠荒地植被時的自然攝取比例。結果我翻開那罐一千二的進口糧，背面標示的鈣只有 1.2%，磷卻高達 1%。這代表什麼？這代表磷鈣比只有 1.2:1。這種比例在我們專業眼裡根本是及格邊緣的垃圾。你要知道，磷會跟鈣競爭吸收。當你餵進去這麼多磷，卻只有一點點鈣的時候，陸龜體內的血鈣濃度根本提不上來。為了維持生理機能，牠只能從自己的骨頭裡把鈣抽出來用。這就是為什麼你明明花了大錢買進口糧，你家那隻蘇卡達卻還是長得像顆凹凸不平的釋迦，背甲縫隙寬得嚇人。\n\n我以前也當過這種韭菜。那時候我家那隻星龜剛來，我每天像供奉神明一樣，深怕牠營養不良，什麼頂級品牌都往碗裡倒。結果呢？養了兩年，背甲的生長紋亂七八糟。後來我真的火大，自己去翻國外的營養數據庫，才發現這些商業糧為了適口性，加了大量的穀物粉跟植物蛋白。這些東西成本低得要命，一噸原料可能才幾百美金，分裝成幾百克就賣你一千塊。這些代工廠的毛利率高到你無法想像，他們把錢都花在請設計師畫精美的外盒，而不是去研究怎麼讓那顆顆粒裡面的礦物質更平衡。\n\n我朋友老婆養的那隻豹龜，長得那叫一個圓潤平整，完全沒有一點點隆起。我問她餵什麼？她說她基本上不餵市售龜糧，而是去菜市場撿人家不要的菜葉，配上路邊拔的車前草跟大車前。最重要的一點，她每個禮拜會把家裡廚房剩下的雞蛋殼洗乾淨、烘乾之後磨成粉，拌在菜裡面。一顆雞蛋殼的鈣含量大約是 35% 到 40%，幾乎沒有磷。這才是真正的補鈣神器。你花一千塊買那罐磷鈣比崩盤的化學顆粒，倒不如去巷口早餐店要一大籃不用錢的蛋殼。\n\n很多人會跟我爭辯說，這罐糧裡面有添加維生素 D3 啊，還有什麼益生菌。聽我在那邊胡扯。維生素 D3 在儲存過程中會隨著溫度跟濕度快速氧化，你那罐糧從日本工廠生產出來，坐船過海，在台灣倉庫躺了三個月，最後才到你手上。你覺得裡面還剩多少活性？與其迷信包裝上的添加物，不如老老實實把陽台的遮蔽物拿掉，讓牠曬半小時太陽，那效果比你餵一公斤的化學 D3 還強。\n\n而且這些商業糧還有一個很陰險的地方，就是蛋白質含量。為了讓小龜長得快、看起來「很有成就感」，這類糧的蛋白質通常會拉到 18% 甚至 20% 以上。陸龜在自然界是吃土、吃乾草的，牠們的腸胃消化速度極慢。你餵這種高蛋白、低纖維的東西，就像每天請一個沒運動的人吃戰斧牛排，牠的生長速度會遠超過骨骼發育的速度。結果就是背甲像吹氣球一樣漲起來，但內部的骨質卻跟海綿一樣空洞。這就是隆背的真相——一種慢性的人為營養失調。\n\n我常常在論壇上看那些飼主在討論哪家代購比較便宜，或者是哪一個品牌又出了新配方。我看著只覺得心累。大家都在追求那種「方便的一體化解決方案」，卻忘了陸龜這種生物已經在地球上活了幾千萬年，牠們的基因裡根本沒有「吃餅乾」這三個字。你買的是你的安心感，不是牠的健康。如果你真的懂成分表，你會發現市面上 90% 的進口糧，其原料表的第一位竟然是小麥副產品或是豆粕。這跟養豬、養雞的飼料底層邏輯是一模一樣的，差別只在於包裝上印的是一隻可愛的陸龜，而不是一頭肥豬。\n\n下次你去水族館，看到那些包裝精美、名字取得很玄學的龜糧，先別急著掏錢。把罐子轉過來，用你的手機計算機除一下鈣磷比。如果數字連 2 都不到，那它就不值那個錢。與其花那冤枉錢，不如去藥局買一罐最便宜的人用碳酸鈣粉，或是去撿幾片烏賊骨給牠啃。我認識的一個老玩家，他在家後院種桑葉、種車前草，偶爾撒點熟石灰粉在土裡讓植物吸收，他養出來的龜每一隻都像藝術品。這不是錢的問題，這是你有沒有把牠當成一個生命，而不是一個需要餵食塑膠顆粒的電子寵物。\n\n這行玩久了你就會發現，最有錢的飼主往往養出最畸形的寵物，因為他們總覺得貴就是好。但生物學是不跟你講錢的，它只講化學鍵。磷鈣比不對，你就算餵牠吃金粉，牠的背甲還是一樣會塌下去。我那個獸醫朋友現在只要看到拿著頂級糧來問診的飼主，他連看都不想看，直接叫他們回家把那罐東西扔了，改餵桑葉跟牧草。這聽起來很殘酷，但這就是事實。我們都在為自己的懶惰買單，而那些廠商正是看準了這一點，才把那些成本不到五十塊的剩料，裝進精美的罐子裡，賣你一千二。", "source_link": null, "source_title": null, "timestamp": "2026-06-28 06:55", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 77, "slug": "20260628-0656-a0a6a6", "permalink": "/articles/20260628-0656-a0a6a6/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "那些標榜一克五塊錢的「神級」冷凍乾燥噴霧，其實原料成本連一成五都不到。", "content": "那一小罐拿在手裡還沒一包菸重的凍乾粉，標價噴到六、七百塊，大家居然還買得心甘情願。我上週跟那個在寵物代工廠當研發經理的獸醫哥們喝悶酒，他醉醺醺地指著酒杯說，這行現在比賣毒品還好賺，只要在包裝上印個「超低溫凍乾」、「納米級噴霧」，原本一公斤幾百塊的原料，裝進那個精緻的小瓶子後，身價直接翻了三十倍。我回家拿計算機按了一下，這類標榜一克五塊錢的「神級」營養粉，換算下來一公斤要五千塊台幣。你們知道澳洲進口的草飼牛肉，生肉大宗批發價一公斤才多少嗎？不到兩百五十塊。\n\n我家那隻老狗前陣子關節不太好，我差點也衝動想買某牌號稱「專利技術萃取」的綠唇貽貝凍乾粉。但強迫症發作的我，去翻了那間代工廠的進出口提單，發現他們進的原料根本不是什麼高濃度萃取物，就是普通的脫脂綠唇貽貝粉。那種粉末在原料端的報價，一公斤大概就在六百到八百塊之間。這中間的價差去哪了？答案是罐子、標籤、還有你每天在臉書滑到的那些精美廣告。我算給你們聽，一瓶六十克的噴霧，裡面原料成本頂多九十塊，加上瓶子跟外盒算三十塊，總成本不到一百五十塊，但它敢賣你八百五十塊。這中間七百塊的利潤，有五百塊是拿去買流量餵給廣告平台，剩下的兩百塊才是老闆的豪宅基金。\n\n很多人跟我說，凍乾技術很貴啊，設備要好幾百萬。拜託，那是二十年前的話術了。現在隨便一間位於台中或桃園的食品代工廠，真空冷凍乾燥機都是標配。把新鮮的食材丟進去，零下四十度抽真空，把水份直接昇華，這技術穩定到不行。這類噴霧之所以貴，是因為它在玩一種「劑量模糊」的心理戰。當你看到粉末細得像煙一樣，噴在飼料上好像很有儀式感，你就忘了去算裡面的有效成分到底有幾毫克。我那個獸醫朋友說，他們診所最近接到一堆皮膚過敏的案例，追查下來，很多都是餵了這種過度加工的凍乾營養品，因為為了讓粉末不結塊、噴灑順暢，裡面加了多少抗結劑跟載體，標籤上根本不會寫清楚。\n\n我有個鄰居，養了一隻身價不菲的布偶貓，每天餵那種一克五塊錢的凍乾噴霧，說什麼可以增加免疫力、亮毛。我拿他那罐噴霧的成分表跟家裡附近超市買的純雞胸肉凍乾對比，蛋白質百分比幾乎一模一樣，微量元素的差異甚至不到 5%。唯一差別是他的噴霧多加了些人工香料，讓貓聞到就瘋掉。這就是所謂的「嗜口性陷阱」，飼主看到貓咪搶著吃，就覺得這東西「有效」，其實貓只是在吃調味料而已。我們這群飼主真的很好騙，只要打著「航太科技」、「低溫物理粉碎」這種詞，口袋裡的錢就自動飛出去。\n\n日本那邊最近流行一種「貓便當」，裡面也是噴滿各種凍乾粉，看起來像高級懷石料理。但我前幾天看日本寵物營養學會的報告，裡面提到這類長期噴灑粉末的餵食方式，容易造成貓咪在吸入時噴嚏不斷，甚至有輕微的氣管過敏。我們以為在給牠們最好的，實際上可能只是在滿足我們那種「花大錢買安心」的補償心理。你想想，如果這東西真的那麼神奇，為什麼獸醫院開的處方藥不全改成這種噴霧？因為藥物講究的是精準劑量，而這類商業噴霧講究的是利潤率。\n\n我最受不了的是那些行銷術語，什麼「保留 99% 活性營養」。這句話在物理學上根本是屁話，冷凍乾燥確實能保留大部分構造，但很多水溶性維生素在噴霧化的加工過程中，早就因為接觸面積變大而氧化得差不多了。我有次去參觀某家號稱頂級凍乾的倉庫，那味道重到隔兩條街都聞得到，這代表什麼？代表油脂早就酸敗了。但加了除臭劑跟掩蓋劑後，裝進那漂亮的鋁瓶裡，它又是飼主眼中的神藥。\n\n我們常在論壇上討論哪牌飼料比較好，哪種保健品CP值高，但每次講到這種高級噴霧，大家就像集體失智一樣。可能是因為一克五塊錢聽起來比「一公斤五千塊」容易接受吧。這就像我們去買咖啡，一杯一百五可以，但叫你買一袋三千塊的咖啡豆你就會猶豫。那些廠商就是抓準這種心理，把原本該是大宗物資的食材，切碎、噴霧、裝瓶，再套上一個科學光環。我朋友老婆養的那隻臘腸，吃了半年這種神級噴霧，體檢出來肝指數稍微偏高，停掉這些亂七八糟的粉末後一個月，數值就回歸正常了。\n\n我不是說凍乾不好，我自己也會買整塊的雞肉凍乾給家裡那隻當零食。但當這項技術被拿來當作哄抬價格的遮羞布，把廉價的原料包裝成每克單價超過黃金的奢侈品時，我們這些當飼主的就真的成了人家眼中的肥羊。你想想，你每天辛苦加班，省下來的錢是為了讓你的貓狗吃得更好，還是為了讓廣告公司的創意總監可以去馬爾地夫度假？下次在下單前，先把那個克數乘以一千，看看那個數字你還買不買得下去。如果你能接受一公斤五千塊的價格去買一堆大豆分離蛋白跟雞肉粉，那我也只能說，這就是愛情的代價吧。\n\n每次看到論壇上有人發文問「這款噴霧對淚腺有效嗎？」我都想直接回他，先把環境弄乾淨、把那碗充滿澱粉的廉價飼料換掉比較實在。但我也知道，講實話通常最傷人，大家喜歡聽的是「只要噴一下，奇蹟就會發生」。這世界沒有奇蹟，只有精算過的毛利率跟包裝精美的消費陷阱。我那個獸醫朋友前天才在罵，現在的飼主寧願花一萬塊買這類沒營養的噴霧，也不願意花三千塊給老狗做一次全套血檢。這就是現在的寵物圈，大家都在追求那種看得見的儀式感，卻忘了最基本的營養學邏輯其實就在那幾行原料表裡。", "source_link": null, "source_title": null, "timestamp": "2026-06-28 06:56", "comments": [{"author": "輪班救世主_TW", "content": "買這廢物根本交智商稅,不如去買肉,蠢死了。", "time": "13:44"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 78, "slug": "20260628-0657-1f0e90", "permalink": "/articles/20260628-0657-1f0e90/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "這年頭去動物醫院哪裡是在看醫生，根本是在看一齣沒有劇本的實境秀。", "content": "那天我在診所角落蹲著，假裝在滑手機，其實眼神都在瞄候診室那幾個看起來隨時要抓狂的人。空氣裡有一種很玄的張力，不是因為誰家的貓快不行了，而是因為櫃檯後面那個木頭架子上，最後那一罐處方罐頭。那個罐頭就在那裡，像發著光的聖杯，或者是清朝皇帝唯一留下的傳位詔書。我看著一個背著香奈兒包包的貴賓媽，眼神死死鎖定那個罐頭，她的手不停地搓著包包背帶，那個頻率快到我覺得她下一秒就要使出降龍十八掌。另一邊，坐著一個穿著全套專業戶外裝備的柴犬爸，他手裡牽著一隻看起來很有個性的柴犬，這大哥看起來像是剛從聖母峰下來，但他看著那罐處方罐頭的眼神，比看著救命繩索還渴望。\n\n這就是我們這些飼主最卑微也最瘋狂的時刻。你說那些處方罐頭裡面是裝了什麼？金箔還是長生不老藥？其實都不是，那可能只是一些為了特定腎臟或消化問題設計的、聞起來像過期午餐肉的東西。但只要醫生點個頭說「這幾天先吃這個試試看」，這罐頭在我們眼裡就變成了全宇宙最稀缺的資源。\n\n我跟你講喔，這真的不誇張。我看過最瞎的場面，是兩個平常看起來非常有教養的鄰居，為了最後一袋特定型號的處方飼料，在候診室開始翻舊帳。那個穿得像要去參加金馬獎的女士，對著那個牽著米克斯的老先生說：「王先生，你家那隻不是上禮拜才剛出院？醫生說牠現在可以吃一般的了，這包應該讓給我們家這隻還在觀察期的。」老先生也不是省油的燈，腰桿一挺，冷笑一聲說：「林太太，你家那是純種狗，嬌貴，我們這種米克斯是生命力強，但這包是我先看到的，這叫先來後到。」\n\n那一刻我真的覺得，人類在生存競爭的時候都沒這麼有戰鬥力。我們為了自己可以吃泡麵度日，但為了那一罐標榜「腸胃道專用」的肉泥，我們可以在診所櫃檯演出一部《後宮甄嬛傳》。\n\n假設今天真的有個什麼「處方罐頭地下期貨交易所」，我敢說這些飼主的財力絕對不輸華爾街那些大鱷。你會看到有人在群組裡偷偷傳訊息：「永和某某診所還有三罐，速去。」然後不到五分鐘，那家診所的電話就會被打爆。我有時候在想，如果我們把這種鬥志拿去搞什麼國際政治，大概地球早就統一了。但我們偏不，我們就是要為了那罐裡面大概 80% 都是水分的罐頭，跟陌生人交換那種可以殺人的眼神。\n\n這背後其實有一種很微妙的階級鄙視鏈，只是大家都不說破。那個貴賓媽看著柴犬爸的眼神，彷彿在說：「你家那隻看起來這麼壯，少吃一罐又不會怎樣。」而柴犬爸回敬的眼神則是：「我家這隻是家人，你家那隻是配件，配件不需要處方罐頭。」這種心理戰在狹窄的候診室裡交織，比外面的塞車還要讓人心煩。\n\n我有個朋友更扯，他為了買到某牌斷貨的處方罐，甚至去追蹤獸醫助理的社群帳號，連人家去哪裡看電影都知道，就為了在人家發限動說「進貨了」的第一秒衝過去。他說這叫「資源分配的前置部署」，我聽了只想笑。真的，我們這些人瘋起來連自己都怕。\n\n你想想看，這整件事多荒謬。我們在外面可能是一呼百諾的老闆，或者是冷靜理性的工程師，但只要一進到那間充滿消毒水味的診所，看到那罐最後的處方罐頭，我們的大腦皮質就自動退化到原始人搶食的階段。那種「我絕對不能讓我家孩子受委屈」的情緒，會把所有的理智燒得乾乾淨淨。\n\n我甚至聽說過，有人在診所門口為了搶停車位，就為了比別人早一步進去買最後一盒藥。這已經不是愛了，這是一種集體的偏執，一種我們透過「搶奪資源」來證明自己是個稱職飼主的自我感動。好像搶到了這罐，我就能對得起那隻在家裡沙發上翻肚皮的傢伙；搶不到，我就是個失職的家長，回家的路都變得無比沉重。\n\n這種候診室政治學，核心永遠不在醫療效果，而在於「我拿到了你拿不到的東西」。這跟那些排隊買名牌包、搶限量版運動鞋的人本質上沒什麼兩樣，只是包裹了一層溫情的動物外衣，讓我們覺得自己的行為高尚得不得了。\n\n那天最後到底是誰拿到了那罐罐頭？我跟你講，結局真的瞎到不行。正當貴賓媽跟柴犬爸的眼神對峙到最高潮，櫃檯護士突然拿出一張紙貼在罐頭上面，淡淡地說：「不好意思，這罐是隔壁陳先生昨天就打電話預訂好的，他現在過來拿。」\n\n那一瞬間，我看到兩個人臉上的表情同時崩塌，那種武林高手對決到一半，發現對手根本沒來現場的虛脫感，真的是我這輩子看過最好笑的畫面。這就是我們，一群被寵物控制了荷爾蒙，然後在人類社會搞出各種荒唐戲碼的笨蛋。\n\n你問我後來有沒有去搶？我當然沒有，我只是默默地看著這一切。但我必須承認，如果那時候護士突然又從抽屜拿出一罐說「這罐沒人訂」，我大概也會像箭一樣射過去，然後對著所有人露出那種「不好意思，承讓了」的虛偽笑容。這就是人性，這就是我們在動物醫院裡的求生法則。\n\n說到底，我們哪是在看病啊，我們是在玩一場永遠贏不了的政治遊戲。罐頭會被吃完，藥會被餵光，但那種「我一定要搶贏你」的荒謬快感，才是我們在診所候診室裡真正的動力來源。下次你如果去動物醫院，別急著滑手機，多看看周圍的人，你會發現那些眼神比Discovery頻道的獅群狩獵還要精彩一百倍。不要去分析為什麼，就看樂子就好，畢竟我們也都是這場戲裡面的其中一個小丑。", "source_link": null, "source_title": null, "timestamp": "2026-06-28 06:57", "comments": [{"author": "躺平實踐者", "content": "我超有感……大家家裡的貓挑食真的無解嗎? 處方罐頭這種東西真的沒替代品嗎?", "time": "13:14"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 79, "slug": "20260628-0658-814ea2", "permalink": "/articles/20260628-0658-814ea2/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "這群人為了那 0.01% 的含磷量差點在社群軟體上發動政變", "content": "我有個朋友，前陣子為了家裡那隻十六歲的資深美短，差點沒把整個區域的貓罐頭經銷商給逼瘋。他那天敲我，丟過來一張密密麻麻的 Excel 表格，我乍看之下還以為他在分析什麼美股科技權值股的財報，結果細看才發現，他在算某個德罐品牌跟紐西蘭品牌之間的含磷量差異。他跟我說，這罐磷含量 180 毫克，那罐 182 毫克，多出這 2 毫克簡直就是想讓他家主子直接去報到。我當時聽了真的差點沒把咖啡噴在螢幕上，我說兄弟，你上次體檢尿酸過高的時候，好像也沒對你那盤熱炒店的內臟這麼講究過吧？\n\n這就是現在「FurWell」版面上最常見的奇觀。如果你沒進過那幾個封閉式的「腎貓家長交流群」，你真的不會知道人類的政治鬥爭可以具象化到這種地步。那種氣氛簡直比總統大選辯論會還要緊繃，只要有人敢在留言區貼出一張家裡貓咪正在吃某款「磷含量標示不明」罐頭的照片，不到五分鐘，底下的留言保證會出現像「你這是慢性處置」、「有沒有想過貓的感受」、「這種數據你也敢餵」這種充滿道德高度的質問。大家彷彿都拿著顯微鏡和計算機在生活，把對家人的焦慮完全投射在那些小圓罐後面的微小字體上。\n\n我甚至覺得這已經演變成一種宗教戰爭了。在這些飼主眼中，含磷量不是營養數據，那是信仰的純度。假設今天真的有個什麼「世界低磷罐頭聯盟」的秘書長，因為在某次年度報告裡不小心算錯一個小數點被撤職，我一點都不會感到意外，搞不好還會有人傳言說是競爭對手派來的臥底在數據裡下了毒。這種氛圍下，每個人都變得像是一邊吸著大麻一邊在讀核子物理，語氣飄忽但邏輯又死腦筋得要命。大家看著數據在爭吵，卻沒人發現自家貓咪其實在旁邊一臉鄙視，心裡大概在想：「你們吵完了沒？我比較想吃那罐標籤被你們撕掉的副食罐，那個比較香。」\n\n最扯的是那種階級鄙視鏈。在這些網路論壇裡，餵主食罐的瞧不起餵乾糧的，餵低磷罐的瞧不起餵普通罐的，而那些親手做鮮食還要精準計算鈣磷比到千分位的人，簡直就是站在食物鏈頂端的教皇。我有次在寵物展看到一個攤位主，他在介紹自家品牌的配方時，口氣嚴肅到我以為他在介紹什麼航太級的抗震材料，結果他只是在講肉類的蛋白質百分比。旁邊圍著的一群飼主瘋狂點頭，那眼神裡流露出的崇拜感，跟信徒看見神蹟沒兩樣。\n\n但我跟你講喔，這件事最荒謬的地方在於，大家在吵這些數字的時候，往往會忽略掉最基本的現實。比如某牌的罐頭磷含量超低，簡直是腎貓界的聖經，但打開來那個味道連流浪貓都不想靠近。於是你就看到一個人類，跪在地上苦苦哀求一隻貓，手裡拿著全世界最完美的數據，而那隻貓只想去翻垃圾桶。這畫面你不覺得很藝術嗎？人類試圖用數據去掌控生命，結果生命本身只想吃點垃圾食物。\n\n我聽說過一個更瞎的傳聞，不知道真的假的，說是有個國外的養貓社群，內部內鬥到分成了兩派，一派支持某個德國牌子，另一派支持美國牌子。後來兩邊的理事長在一次線上會議吵到斷絕往來，理由竟然是因為德國派覺得美國派的磷含量計算方式沒有扣掉水分比例，是在誤導群眾。這種「算術式政變」要是發生在現實政治裡，估計連憲法法庭都要出來調解。我猜如果真的要選一個寵物界的總統，政見大概不是什麼和平統一，而是「全面強制規定罐頭標籤必須精準到毫克」。\n\n我們這群人有時候真的很奇怪，明明是因為愛才開始關心這些，結果最後都變成了數據的奴隸。我有時候也會看著家裡那疊罐頭發呆，想著我到底是在養貓，還是在玩一場不能輸的數據遊戲？我有個鄰居，他是那種標準的「米克斯派」大叔，他常說他家那隻黑貓活到二十歲，每天就是隨便吃吃睡睡，從來沒看過什麼成分表。每次他在論壇看到那些為了 1% 爭得面紅耳赤的貼文，他只會回一句：「貓肯吃就好，吵贏了數據，貓不吃也是白搭。」然後他就被那群「數據派」檢舉到帳號停權了。你看，這不是政治是什麼？\n\n這種現象甚至發展到獸醫候診室。你有沒有觀察過，那些帶著貓去複診報告血檢數值的飼主，彼此交換眼神的神情，簡直像是在交換國家機密。如果某人的貓指數降了 10，他走出診間的腳步簡直是帶風的，旁邊還在奮鬥的飼主看他的眼神，既有嫉妒也有不甘，彷彿人家手裡握著通往永生的門票。這時候如果有人問一句：「你餵哪一罐？」那簡直就是最高規格的諮詢，那罐頭的名字會像咒語一樣在候診區悄悄傳開。\n\n其實這背後就是一種無力感的宣洩吧。我們沒辦法控制貓會不會生病，沒辦法控制牠們能陪我們多久，所以我們只好把所有精力都花在那些我們能控制的數字上。只要我選了磷含量最低的那一罐，我就覺得我贏了死神一局。儘管這可能只是我們自欺欺人的幻覺。\n\n有次我看到一個寵物展的攤位，賣的是那種超昂貴、號稱「醫療級」的配方罐。攤位主是一個穿著白袍、看起來很專業的人，他跟我介紹產品的時候，一直在強調他們的磷含量比國家標準還低了多少多少。我隨口問了一句：「那如果貓不吃怎麼辦？」他愣了一下，然後一本正經地跟我說：「我們可以考慮搭配他們的誘導劑。」你看，這生意做得多圓滿，先用數據恐嚇你，讓你買了貓不吃的罐頭，再賣你讓你貓肯吃的東西。\n\n這就是我們現在的寵物政治觀察。大家在鍵盤上爭個你死我活，為了那一點點百分比互噴口水，甚至不惜退群、絕交。說到底，大家吵的其實都不是罐頭，吵的是那份深怕自己「做不夠」的罪惡感。只是當這種罪惡感轉化成對數據的執著時，原本溫暖的貓奴社群，就變成了一個充滿算計和鄙視鏈的修羅場。\n\n說真的，我上次看到有人為了罐頭配方變動而發起連署抗議，那陣仗還以為是哪家跨國企業倒閉了。大家在留言區列舉了幾十條罪狀，控訴廠商「背叛了貓的腎臟」。我心裡就在想，如果這些人能把這股勁頭拿去關心一下社會議題，搞不好世界早就和平了。但沒辦法，誰叫罐頭裡的那個 1% 磷含量，比任何選票都更能牽動這群人的神經呢？我也沒資格說別人，因為我昨天也剛在電腦前花了半小時，對比兩款主食餐包的灰分比例。這就是人類，荒謬得可愛，又偏執得讓人發笑。", "source_link": null, "source_title": null, "timestamp": "2026-06-28 06:58", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 80, "slug": "20260628-0700-71027c", "permalink": "/articles/20260628-0700-71027c/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "二戰傘兵狗連空投口糧都比你講究", "content": "前幾天我翻到一張老照片，那是 1944 年諾曼第登陸前夕，有個英國第 13 傘兵營的傢伙在幫一隻德國牧羊犬穿背帶，你沒看錯，是降落傘背帶。那隻狗叫 Bing，原本是個普通家犬，因為家裡糧食短缺被主人「捐」給軍隊，結果牠不但得學著從幾千英呎的高空往下跳，甚至還有一份專屬的空投清單。講到這個我真的覺得我們現代人對寵物太過溺愛了，人家當年的狗是直接跟著人類去炸碉堡的。\n\n對了你知道嗎，這些傘兵犬在跳傘前甚至得接受「聽覺脫敏訓練」，說白了就是教官在牠們耳邊瘋狂開槍跟丟手榴彈，直到牠們覺得這跟鄰居裝潢噪音沒兩樣為止。當時的人類還沒發明什麼寵物抗憂鬱藥，他們的方法很粗暴但很有用：給牛肉乾。在那份空投清單裡，除了一套特製的降落傘，最核心的東西就是牛肉乾。當人類士兵在啃那種像硬紙板一樣的 K-口糧時，這些狗的補給包裡塞滿了高蛋白肉塊。\n\n不過這個有點離題，我想說的是那個降落傘的設計。當時的工程師發現狗跟人不一樣，人會乖乖拉開傘索，但狗會慌張，所以他們設計了一種靜態繩系統，飛機艙門一開，狗被踹出去的瞬間傘就自動開了。而且為了怕牠們落地摔斷腿，清單裡還有一種特製的「充氣墊」，雖然聽起來很像現在網紅店賣的寵物床，但那是為了讓牠們在戰火連天的法國農田裡降落時別扭傷腳踝。\n\n講到這裡我想起另一個怪事，雖然這群狗領著精良的口糧跟裝備，但牠們的職稱竟然是「反地雷探測器」。在那個還沒有金屬探測器普及的年代，這些狗得在降落後的第一時間，聞出土裡有沒有埋著足以把整排士兵送上天的東西。諷刺的是，當時有些軍官覺得狗命比兵貴，因為訓練一隻合格的傘兵犬要花半年，而訓練一個拿槍的農村小伙子只要六週。所以空投清單裡甚至還有止痛藥和繃帶，規格跟醫護兵的藥包一模一樣。\n\n你有沒有想過，為什麼是狗？為什麼不是貓？古埃及人把貓當神看，但如果叫貓跳傘，牠可能會在半空中就把傘兵的臉抓花，然後優雅地降落在德軍司令部的屋頂上。人類跟狗這五千年的合作史，最荒謬也最動人的部分就在這，狗是唯一一種願意為了人類一個指令，就克服恐懼從飛機上跳下去的生物。維多利亞時代的人把寵物埋在精緻的小墓園裡，給牠們穿蕾絲裙，但二戰這群傢伙更硬派，他們把狗當成戰友，分給牠們巧克力（當時的人還不知道巧克力對狗有毒，或者是那時候的狗基因比較強？）和煙燻肉。\n\n其實那份空投清單最讓我驚訝的不是食物，而是「除臭劑」。別誤會，這不是為了讓狗聞起來像香奈兒五號，而是為了蓋住人類的味道。德國軍犬的鼻子很靈，如果這群英國傘兵狗落地後身上帶著濃郁的罐頭味，那簡直是活靶子。所以清單裡有一種奇怪的粉末，抹在狗身上能讓牠們聞起來像堆爛草。你看，這就是所謂的專業，從五千年前人類教狼怎麼圍獵，到 1944 年教牧羊犬怎麼躲避蓋世太保，人類在利用寵物這件事上真的一直很有創意。\n\n說真的，我每次看到現在那種坐在推車裡、穿著球鞋逛百貨公司的法鬥，都會想到當年的 Bing。Bing 在諾曼第降落時掛在一棵樹上，還被德軍狙擊手射傷了兩次，但牠最後竟然活著回到了英國，還拿到了迪金勳章。牠離世後，墓碑上寫著「牠曾在 D-Day 降落」。在那之後，人類對寵物的態度開始轉向，我們不再需要牠們去排雷，也不再需要牠們去傳遞密碼，我們開始給牠們買自動餵食器，研究哪種牌子的貓砂比較不黏腳。\n\n這轉變其實挺有趣的，以前是牠們救我們的命，現在是我們在救牠們的命，或者說，我們在花大錢延續牠們那種已經退化了的生存本能。不過這也沒什麼不好，比起在防空洞裡瑟瑟發抖等著空投牛肉乾，能在冷氣房裡為了搶一顆潔牙骨而跟沙發奮鬥，對狗來說可能是更好的結局。\n\n對了，你知道嗎，那份清單裡最後一項竟然是「備用狗繩」。這聽起來很平凡，但考慮到這是在跳傘裝備裡，這代表當時的人類非常清楚一件事：無論這隻狗受過多專業的空降訓練，當牠落地的那一刻，牠依然只是一隻會因為聽到爆炸聲而想亂跑的小動物。那一條小小的繩子，是連結五千年馴化史的唯一保險。我們給牠們降落傘，給牠們最好的肉，最終還是為了讓牠們留在我們身邊。\n\n但我有時候會想，如果在五千年前的荒野裡，那個決定餵狼第一塊肉的原始人，看到這群背著降落傘從天而降的後代，他會覺得我們是瘋了，還是覺得這一切都很合理？畢竟我們從來沒把牠們當成純粹的動物，我們一直試圖把牠們拉進我們那些愚蠢又偉大的冒險裡，不管是打獵、戰爭，還是現在單純的陪我們熬夜看電視。這種強行把另一個物種拖進文明進程的行為，本身就是歷史上最怪異的一場長期實驗。", "source_link": null, "source_title": null, "timestamp": "2026-06-28 07:00", "comments": [{"author": "中信房屋天母店", "content": "看到傘兵狗掛在樹上還挨子彈那段真的超心酸。現在我們家那隻連吸塵器開機都要躲到床底，以前的狗竟然能忍受手榴彈在耳邊炸。這大概就是演化的代價，我們把牠們寵成了永遠長不大的孩子，用精緻的罐頭換掉牠們的野性，也不知道到底是誰在馴化誰……", "time": "16:35"}, {"author": "Noah.C", "content": "以前的狗 vibe 真的硬派, 雖然聽起來超 weird, 但感覺比現在坐推車的 happier... cheers mate!☕️", "time": "16:13"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 81, "slug": "20260628-0701-83604c", "permalink": "/articles/20260628-0701-83604c/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "唐朝那些從西域坐「頭等艙」過來的罽賓犬", "content": "前幾天我在翻一本舊筆記，看到唐朝開元年間的一段紀錄，突然覺得我們現在對家裡主子的溺愛簡直是毛毛雨。你知道嗎，當年從罽賓國（大概是現在的克什米爾一帶）送過來的「罽賓犬」，那排場真的會讓現在那些坐私人飛機的寵物汗顏。那時候的進貢路線可不是坐飛機幾小時就到，得翻過帕米爾高原、走過戈壁灘，整整幾千公里的路程。為了不讓這些小傢伙累著，唐朝的接車部隊直接準備了最豪華的特製籠子，裡面鋪的是西域地毯，每天還有專人餵羊肉和鮮奶。這哪是送貢品，這根本是迎接外國小王子。\n\n講到這個，我想起來以前看過一幅古畫，畫裡的貴婦逗弄著一種毛茸茸、耳朵大大的小狗。很多人以為那是北京犬，其實那種被稱為「拂菻犬」或「罽賓犬」的東西，在唐朝皇宮裡地位高得嚇人。牠們不僅有專門的「公務員」負責鏟屎和梳毛，甚至還有自己的封號。對了你知道嗎，楊貴妃當年那隻康國罽賓犬，曾經在唐玄宗跟親王下棋快輸掉的時候，突然跳上棋盤把棋子攪亂，玄宗不但沒生氣，還哈哈大笑說這狗救駕有功。這種「政治智慧」簡直比朝廷官員還強，要是我家那隻只會拆沙發的哈士奇穿越回去，大概第一天就被貶為平民了。\n\n不過這個有點離題，我們再拉回到那個豪華頭等艙。這五千多年來，人類為了把異地的動物運到自己身邊，發明了各種稀奇古怪的運輸方式。古羅馬人為了把北非的獅子運到競技場，發明了雙層木構吊裝船，但那是為了讓動物活著去廝殺。唐朝人不一樣，他們是真的在搞「寵物心理建設」。那些罽賓犬被送進長安時，身上繫的是金鈴鐺，脖子圍的是錦緞。為什麼古人這麼瘋這些小狗？其實這跟我們現在刷短視頻看萌寵的心態沒什麼兩樣。想像一下，在那個沒有網絡、連書都沒幾本的年代，突然看到一隻長得像獅子縮小版、會聽人話還會作揖的小生物，那震撼感絕對超過我們現在看到外星人。\n\n不過，這種奢華的背後其實也藏著一點怪怪的邏輯。你發現了嗎，人類歷史上對寵物的喜好通常跟「稀有度」掛鉤。唐朝人迷戀西域來的狗，清朝皇帝則是一門心思在宮裡養那些短腿到肚子貼地的哈巴狗。乾隆皇帝就曾在紫禁城裡設了「犬窩」，每隻狗的檔案寫得比後宮嬪妃還詳細，甚至還有專門的畫師幫狗畫肖像。這種對品種的執著，其實也是一種對自然界的「控制欲」。我們把原本應該在荒野奔跑的狼，慢慢修剪、篩選，最後變成了一種只能縮在錦繡墊子上、連咬人都沒力氣的小毛球。\n\n但話說回來，這種馴化過程真的很有趣。我常在想，狗到底是怎麼從狼變成邊境牧羊犬，或者變成那種蹲在楊貴妃懷裡的罽賓犬的？這背後其實是人類與寵物這五千年來的「互利共生」。狗給了我們一種無條件的陪伴，而我們則給了牠們安全感和越來越離譜的「物質生活」。講到這裡我想起一個冷知識，古埃及人對貓的愛護也到了變態的地步，如果家裡的貓走了，全家人都要剃掉眉毛示哀。跟唐朝人的金鈴鐺比起來，古埃及人的眉毛可能更值錢一點？\n\n其實在長安城最繁華的時候，如果你走在大街上，看到一個西域客商牽著一隻長毛小狗，那感覺大概就像現在在信義區看到有人牽著一隻純種薩摩耶。但唐朝的「頭等艙」更純粹一點，那純粹是為了滿足最高統治者的獵奇心。而且你知道嗎，這些小狗當時在長安是有「外交身分」的。牠們進城的那一刻，代表的是絲綢之路的暢通，代表的是萬邦來朝的虛榮感。所以那個籠子必須鑲金帶銀，那個羊肉必須是現宰的。\n\n後來到了維多利亞時代，英國人對寵物的熱情又推到另一個巔峰。他們開始蓋專門的寵物公墓，甚至還有專屬的靈車和哀悼儀式。但我個人還是比較喜歡唐朝那種「豪橫」的養法，那種「我喜歡你就給你全世界最貴的籠子」的直球式寵愛。雖然後來宋朝的文人開始覺得養狗太玩物喪志，轉而研究怎麼用藥材幫貓治感冒（這又是另一個故事了），但唐朝那種充滿生命力的、甚至有點荒唐的寵物外交，才是人類歷史上最有趣的一頁。\n\n有時候我會看著我家那隻正在啃電線的貓，心裡想著：你要是生在唐朝，說不定現在正坐著鋪地毯的轎子去面見皇上呢。可惜你生在二十一世紀，只能在我的電腦鍵盤上踩來踩去。歷史就是這麼奇妙，我們對動物的感情一直沒變，只是表現方式從「進貢金鈴鐺」變成了「雙十一囤貓砂」。如果你仔細研究這五千年的寵物史，你會發現人類其實挺孤獨的。我們一直在尋找能跟自己說話以外的生物交流的方式，不管是透過頭等艙、精緻的飼料，還是那些畫在古籍裡的肖像畫。這或許就是為什麼當年的唐朝人願意花那麼大的力氣，把一隻小狗從幾千里外運過來的原因吧。那種看到異類生命對你搖尾巴的瞬間，真的會讓人覺得，為了蓋那個豪華籠子所花的銀子，一點都不冤枉。", "source_link": null, "source_title": null, "timestamp": "2026-06-28 07:01", "comments": [{"author": "擺爛哲學", "content": "說到底這種排場還不是為了滿足人的虛榮心? 狗狗本人可能更想在草地上亂跑吧……", "time": "12:57"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 82, "slug": "20260627-0658-93a4ec", "permalink": "/articles/20260627-0658-93a4ec/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "陸龜隆背不是因為缺鈣，是你半夜給那口麵包種下的代謝禍根。", "content": "半夜三點看到蘇卡達在客廳敲敲打打，或是透過監視器看到紅腿在角落不安分地抓地，很多人的第一反應是：牠是不是餓了？這時候隨手撕下一小塊吐司，或是把晚餐剩下的那點義大利麵遞過去，看著牠們賣力咀嚼的模樣，心裡可能還覺得挺治癒的。但我必須說，上週才有一個飼主帶著一隻背甲起伏像苦瓜一樣的赫曼來診間，滿臉困惑地問我：「醫師，我鈣粉灑得跟下雪一樣多，為什麼牠還是隆背了？」我摸了摸那隻龜，背甲隆起的尖峰像是一座座發育畸形的墓碑，我問他平時餵什麼，他支支吾吾說偶爾會分享一點饅頭。\n\n很多人把陸龜隆背歸咎於缺鈣、沒曬太陽，或者覺得那是某種「品種特色」，這完全是弄錯了因果關係。在臨床上看到的案例，絕大多數的隆背並不是骨質疏鬆，而是代償性的組織過度生長。陸龜的生長速度是有定數的，牠們的代謝基因被鎖定在幾千萬年前那種貧瘠、高纖維的荒野環境裡。當你給牠一口精緻澱粉，那對牠的身體來說不是點心，是一場生化災難。\n\n麵包、麵條或是任何加工澱粉進入陸龜的腸胃，會迅速轉化成大量的單醣。這會導致血糖在短時間內飆升，誘發胰島素過度分泌。在爬蟲類的生理機制中，這種爆發性的能量供給會逼迫甲殼邊緣的生長點進入一種「超頻模式」。原本應該緩慢、層層堆疊的角質蛋白，因為能量過剩而被迫往上推擠。鈣質並不是沒進去，而是角質長得太快，骨骼架構根本跟不上這種瘋狂的速度，最後只能長成畸形的凸起。\n\n我們養龜的人常有一種錯覺，覺得愛牠就是讓牠吃得飽、吃得精緻。但你得明白，陸龜這種生物在演化上是為了應對「飢餓」而生的。牠們的腸道非常長，就是為了榨取那些乾硬雜草裡最後一點點微薄的營養。當你把人類社會那套「澱粉至上」的飲食邏輯套在牠們身上，等於是強迫一個開慣了慢車的老爺車引擎去跑一級方程式賽車的轉速，零件不崩潰才怪。\n\n我也聽過一些飼主辯解，說餵一點點沒關係，或者那是「古法養殖」。我每次聽到這種說法都很想翻白眼，但我會忍住，然後拿出一張 X 光片給他們看。隆背不只是外觀不好看，那是內臟受壓迫的徵兆。當背甲不再是平滑的圓弧，內部的胸腔空間就會被壓縮，肺部無法完全擴張，消化道也會因為擠壓而蠕動緩慢。這就是為什麼有些隆背嚴重的龜，吃一點點東西就開始氣喘吁吁，甚至容易發生肺炎或腸阻塞。\n\n更別提那些所謂的「高蛋白質」飼料。很多飼主在半夜搜尋「如何讓陸龜長得快」，搜出來的建議往往是高蛋白、高熱量。這種追求「快速長大」的虛榮心，本質上是在透支寵物的壽命。我認識的一位前輩常說，養龜是修行，修的是耐心。你在那口麵包裡給的溫柔，對牠而言是慢性毀滅。陸龜的隆背一旦成型，就再也回不去了，那是永久性的骨骼變形，就像你穿了一件縮水且堅硬的盔甲活一輩子，你呼吸、你走路、你睡覺都得忍受那種不自然的緊繃感。\n\n很多人喜歡拿某些地區野外的陸龜也有隆背現象來當藉口。但我們得看清楚，野外的隆背往往是因為極端乾旱導致的脫水，使得生長點的組織收縮不均。而家養環境下的隆背，九成九都是因為「吃得太好」。那種從骨子裡透出來的畸形，是飼主過度投餵與錯誤澱粉攝取的成績單。你半夜給的那塊麵包，在牠體內代謝不掉，轉化成了沉重的負擔，最後顯現在牠的背上。\n\n如果你真的在深夜看到你的龜在躁動，請檢查環境的溫濕度，或是看一眼水盆是不是乾了，而不是轉身去廚房拿餅乾。陸龜不需要你的憐憫式餵食，牠們需要的是那種近乎嚴苛的、乏味的、全是粗纖維的飲食菜單。那種看著牠們吃得津津有味的成就感，其實是飼主自私的投射。當你在診間看著牠因為肺部被壓迫而張口呼吸時，你就會後悔當時為什麼不把手縮回來。\n\n那種背甲平滑如鏡、生長紋均勻細密的陸龜，背後代表的是飼主經年累月的克制。這種克制違反了人類想要寵溺弱小的本能，但這才是真正的尊重。別再相信什麼鈣粉能逆轉隆背的鬼話了，代謝的問題只能從代謝解決。你手裡那口麵包，對你來說是宵夜，對牠來說是未來二十年都卸不下的、崎嶇的枷鎖。當牠在半夜對著你眨眼時，記得，牠不需要那份廉價的碳水化合物，牠需要的只是你放過牠的胰島素。", "source_link": null, "source_title": null, "timestamp": "2026-06-27 06:58", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 83, "slug": "20260627-0659-66b433", "permalink": "/articles/20260627-0659-66b433/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "貴賓犬的洗蓬蓬秘辛", "content": "上週三深夜三點半，診間衝進來一位滿頭大汗的飼主，懷裡抱著那隻剛參加完犬展的貴賓。看著那身被吹得比雲朵還要立體的毛，我心裡其實已經涼了半截。這不是飼主第一次這麼做，為了那一場比賽，他們用了高壓吹風機配合層層堆疊的梳理技術，試圖把那卷曲的被毛撐到極致。那位飼主焦急地指著小傢伙肚皮上一片片的紅斑，問我為什麼昨天美容完還好好的，今天突然就變成了這樣。我接過聽診器，輕輕撥開那層看起來依然完美、卻已經失去防禦力的被毛，皮膚底下的紅腫已經連成一片，那是典型的角質屏障崩解，甚至帶著輕微的濕疹徵兆。\n\n這種追求極致蓬鬆的審美，說實話，我自己在剛接觸獸醫的那幾年也曾經著迷過，覺得那種毛質層次分明、觸感如同高級絲絨的視覺效果是專業的體現。可是當你看過一百隻因為過度梳理而導致皮膚皮脂腺導管受損的案例後，那種視覺上的滿足感很快就會消失。貴賓犬本身的毛囊結構密度很高，加上螺旋狀的生長特性，為了維持所謂的「洗出來的蓬鬆感」，飼主往往需要進行大量的逆向吹風以及長時間的熱風烘烤，這對牠們來說無異於一場小型的皮膚災難。\n\n我們在診間常說，貴賓犬的皮膚其實比我們想像中還要脆弱。這並不是說牠們天生體質差，而是當我們為了那種人為創造的膨脹效果，用高熱和強風去破壞角質層的天然油脂時，等於是把皮膚的大門敞開，迎接空氣中所有的細菌和酵母菌。你看著牠們在比賽台上站得挺拔，那種被撐開的毛髮底下，其實是一張被過度拉扯、失去彈性的表皮。很多時候，那種所謂的洗後蓬鬆，其實是水分被徹底帶走後的虛假現象。我常提醒那些執著於比賽造型的飼主，如果你的目標是健康，那種立體感在剛洗完澡的當下確實迷人，但到了第二天的深夜，當皮膚開始因為失去水分而分泌更多的皮脂來補償時，那團被弄亂的毛髮就會變成最完美的細菌溫床。\n\n有些飼主總覺得，只要多用些深層清潔的洗劑，或是增加吹風的時間，就能解決毛髮塌陷的問題，卻忽略了這是在進行一場負向循環的賭博。貴賓犬的毛髮生長週期長，耐受力卻遠不如想像中的強壯。當你每天為了那個完美造型而過度干預牠們的皮膚自然生理狀態，牠們其實是在替你的審美觀承受代價。我以前也勸過那種非要把毛髮梳到極致的飼主，當時他們反問我，如果不這樣處理，哪來的競技優勢？我沒辦法回答這個問題，因為我是在醫治生命，而他們是在追求一種轉瞬即逝的視覺巔峰。\n\n看著那隻在診檯上因為皮膚刺痛而不敢蜷縮的小貴賓，我心裡想的不是比賽輸贏，而是牠要花多久才能把那層被洗壞的屏障養回來。如果你真的在乎牠們的健康，那種洗出來的蓬鬆感，到底還值得我們繼續盲目追求嗎？當皮膚開始崩潰的時候，那些所謂的造型優勢，其實都顯得相當廉價。很多時候，我們以為是在給牠們最好的照料，卻忘了最天然的狀態，才是這群生來就帶有特殊捲曲基因的小傢伙們，最不需要被過度修飾的原始模樣。下次你在深夜兩點看著那一身亂糟糟卻健康的毛髮時，或許才會真正明白什麼叫做寵物的舒適，而不是那一場關於洗髮精與吹風機的虛榮遊戲。", "source_link": null, "source_title": null, "timestamp": "2026-06-27 06:59", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 84, "slug": "20260627-0701-9500fb", "permalink": "/articles/20260627-0701-9500fb/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "五星級犬貓SPA用的那罐進口洗毛精，稀釋比例1:50後的原料成本其實不到台幣三塊錢。", "content": "那些裝潢得像高級飯店、空氣裡飄著昂貴精油味的寵物美容店，真的讓我又愛又恨。我前幾天才跟那個在連鎖體育館診所當主治醫的老友喝酒，他剛下診，衣服上還沾著兩根哈士奇的毛，開口就問我：「渡鴉，你猜那些標榜『天然有機、全植物萃取』的五星級洗毛精，一罐五公升裝的業務桶，稀釋完幫你家那隻洗一次澡，成本要多少？」我那時候心裡盤算著，既然都敢收我一千五百塊的洗澡費，裡面用的洗劑起碼也要個五十、一百吧？結果他伸出三根手指頭，冷笑了一下：「三塊錢，台幣，含瓶子折舊。」\n\n這數字真的會讓人當場把啤酒噴出來。我回家立刻翻出我那疊研究了半年的原料清單。你們去那些高檔SPA，美容師一定會拿出一罐看起來很高級、上面寫滿日文或法文的瓶子，語氣溫柔地說這罐稀釋比例高達一比五十，對皮膚多溫和。這就是行銷話術的藝術了。在化工產業裡，稀釋比越高，代表這罐原液的表面活性劑濃度極高，也就是它用了大量的月桂醇聚醚硫酸酯鈉（SLES）或甜菜鹼。這些原料在化工原料行的批發價，一公斤大概也就幾十塊錢。當你把一公升的原液兌上五十公升的水，那稀釋後的液體，裡面的「有效植物成分」濃度通常比你家巷口麵攤那碗湯裡的香菜還要稀薄。\n\n我以前也當過那種看到「五星級護理」就掏錢的韭菜。我家那隻老狗皮膚敏感，我總覺得貴就是好。但後來我發現一個很有趣的數據，去查查那些代工廠的毛利率，有些甚至可以飆到百分之七十以上。剩下的百分之三十，扣掉房租跟人事，你覺得有多少會真的花在那個宣稱能「活化毛囊」的生物素或是摩洛哥堅果油上面？實際上，大部分的高級洗毛精，成本最高的零件通常是那個漂亮的壓頭跟進口標籤。我朋友老婆養了一隻賽級的阿富汗獵犬，每個禮拜送洗，她一直跟我炫耀說那是日本皇室等級的洗劑。我把成分表要過來一看，排在水後面的第二個成分就是廉價的起泡劑。那些所謂的「皇家香味」，說穿了就是合成香精，一公升能調出幾千瓶的那種。\n\n為什麼我們這群飼主會心甘情願被割？因為美容師會告訴你「洗完毛很順、手感很好」。這又是另一個數字遊戲。要讓毛很順，最簡單的方法就是加矽靈或聚季銨鹽。這些東西在成分表裡佔不到百分之一，但只要一點點，就能製造出一種「頭髮在發光」的假象。這就跟我們去洗車選那個最貴的鍍膜洗車一樣，其實大半時間是在洗心安的。我獸醫朋友前天才在罵，他診間最近塞滿了那種在高級SPA洗完澡結果集體過敏的法鬥。這些法鬥的皮膚屏障本來就比其他品種薄，根據統計，約有百分之三十的法鬥對特定的合成香精有立即性的過敏反應。但美容院不會告訴你這些，他們只會說：「哎呀，可能是你家孩子最近換季免疫力下降。」\n\n我們來算一筆帳。一罐四公升的進口業務用洗劑，批發價大約兩千塊台幣。按照一比五十的稀釋比例，可以稀釋出兩百公升的洗髮水。一次洗澡就算大方一點用掉一公升（對中型犬來說已經非常多），洗劑成本就是十塊錢。但別忘了，很多店家為了省錢，稀釋比例會拉到一比八十。那個所謂的「草本精華」在這種濃度下，除了名字出現在標籤上，對寵物的皮膚幾乎沒有任何實質性的生理意義。這就像是你把一滴昂貴的紅酒滴進游泳池裡，然後告訴大家你在喝紅酒浴一樣荒謬。\n\n我認識一個在美國連鎖寵物店當過採購的主管，他跟我聊過他們的定價邏輯。他說，飼主對於「低價」有一種本能的恐懼，如果他們把洗澡訂價在兩百塊，沒人敢去洗；但如果訂在一千五，並配上一個聽起來很有異國風情的品牌，大家就會排隊預約。這種心理戰在保健品界也一樣。你去看那些宣稱有「護關節」功效的洗劑，裡面加的葡萄糖胺濃度，甚至還不如你直接餵牠吃半顆保健品來的有效。但只要標籤上有印，價格就能翻三倍。\n\n更諷刺的是，北歐那邊現在流行一種「生食派」的洗滌觀念，他們甚至不主張用高強度的界面活性劑去洗掉寵物皮膚上的天然油脂。但在我們這邊，如果不洗得香噴噴、如果不洗到毛髮蓬鬆到像棉花糖，飼主就會覺得這筆錢花得不值。我們其實是在為了我們自己的嗅覺跟視覺在買單，而不是為了那隻狗的皮膚。我曾經看過一個日本的實驗，他們用純水洗澡跟用高級洗劑洗澡的貓做對比，結果三個月後，純水洗澡的貓皮屑生成率反而降低了百分之十五。\n\n我們這群人，包括我在內，有時候真的被那些包裝上的數字跟行銷名詞搞瘋了。我們會花三個小時去研究哪牌飼料的蛋白質高出百分之二，卻會在走進美容店時，心甘情願地把孩子交給一個用著成本不到三塊錢的化學稀釋液、然後收你一千多塊的地方。我不是說美容師的勞動力不值錢，洗澡剪毛是專業勞動，該給的專業費用得給。但當那罐洗毛精被包裝成神藥，而我們又迷信那幾塊錢的原料能帶來什麼奇蹟時，我們就真的成了人家眼裡最肥的那棵韭菜。\n\n下次你去送洗，試著別去看那個瓶子上的漂亮插畫，也不要聽那些什麼「深層淨化」的廢話。你可以試著問一句：「這罐的界面活性劑是什麼成分？」我保證九成的美容師會愣在那裡，然後告訴你「這是我們老闆從國外親自帶回來的」。這種回答就跟那罐稀釋後的洗劑一樣，稀薄到沒什麼營養，但聽起來就是能讓你乖乖掏出錢包。這就是這個產業最成功的幻覺。我們買的不是成分，是那種「我給了孩子最好待遇」的自我安慰感。這種感覺很貴，貴到我們自動忽略了那三塊錢的真實邏輯。", "source_link": null, "source_title": null, "timestamp": "2026-06-27 07:01", "comments": [{"author": "Isabella.C", "content": "literally true, 之前買過那罐日本牌子, 看到 ingredients 真的傻眼, Basically 跟洗碗精沒差多少 cheers mate!", "time": "15:17"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 85, "slug": "20260627-0702-5c9af5", "permalink": "/articles/20260627-0702-5c9af5/", "persona": "渡鴉", "cat": "barkmarket", "type": "original", "prefix": "原創", "title": "買一包兩百塊的鵪鶉鮮食包給家裡那隻主子，你以為餵的是法國貴族晚宴，其實你是在幫行銷公司的裝潢費分期付款。", "content": "這事兒我前幾天才跟那個在代工廠當研發的獸醫朋友聊過，他那時候剛喝完第二罐啤酒，直接把手機裡的報價單甩在我面前。我對著那幾行數字算了半天，愈看愈覺得我們這些飼主真的是世界上最好割的韭菜。大家都在說鵪鶉蛋白質比雞肉高，數據上確實很漂亮，去骨鵪鶉肉的粗蛋白大約落在 22% 到 23%，而我們常買的雞胸肉大概是 19% 到 20%。這 3% 的差距，在行銷文案裡被吹成了「濃縮營養精華」、「禽鳥界的野味人蔘」。但我幫你拆解一下這 3% 的代價：目前大宗採購的冷凍鵪鶉肉，去骨後的原料成本每公斤大概就在幾十塊錢跳動，如果規模夠大，那價格更是低到讓你懷疑人生。\n\n我家那隻老貓對鵪鶉情有獨鍾，所以我研究過這玩意的供應鏈。鵪鶉這東西在禽肉產業裡其實是個很有趣的存在，牠們長得快、週期短、空間利用率極高。換句話說，生產一公斤鵪鶉肉的「碳足跡」和「時間成本」遠低於放山雞。可是到了我們手上的鮮食包，只要包裝印上幾根羽毛，噴砂霧面的質感做出來，再加幾個法文字，這 100 克的肉包就能賣到接近兩百塊。我換算了一下，這相當於一公斤兩千塊。兩千塊是什麼概念？你去超市買最頂級的冷藏和牛，搞不好還有找。\n\n我朋友老婆前陣子也跟風買了一箱，還在那邊跟我炫耀說這是有機農場出來的小鵪鶉。我拿過來一看成分表，排在鵪鶉肉後面的居然是水分、增稠劑，還有一些根本沒標明具體來源的「礦物質」。你們知道嗎？這類鮮食包的含水量通常在 80% 以上，也就是說你花了兩百塊，實際上只買到了不到 20 克的肉，剩下的都是昂貴的自來水和一點點增稠膠質。那 3% 的蛋白質優勢，在這種稀釋比例下，早就被稀釋到連顯微鏡都快找不到了。\n\n更扯的是那些所謂的「特殊營養素」。廠商最愛講鵪鶉含有豐富的卵磷脂和維生素 A，對皮毛好。沒錯，鵪鶉蛋確實不錯，但那是「蛋」。鮮食包裡放的是肉，還是加工過後的熟肉。維生素 A 在高溫殺菌的過程中會損耗多少，那些文案才不會告訴你。我那獸醫朋友在那邊碎碎念，說他看過太多飼主為了這 3% 的數字，寧可縮減自己的午餐預算，結果買回去的東西，裡面的有效成分劑量根本達不到維持生理機能的最低標。\n\n我們總覺得貴就是好，這真的是一種集體焦慮。我以前也會拿著成分表在那邊鑽牛角尖，一定要找到那個蛋白質多 1% 的牌子，後來才發現那根本是實驗室裡的數據遊戲。代工廠在配方的時候，只要多加一點點廉價的內臟組織，蛋白質總量立刻就衝上去了。鵪鶉的肝臟和心臟確實營養，但那成本跟純肉比起來，又是另外一個層次的低廉。你買的那包五星級鮮食，裡面到底有多少比例是紮實的胸肉，多少是打成泥的邊角料？廠商不說，你永遠不知道。\n\n我還看過一些號稱「北歐配方」的鵪鶉包，結果產地在東南亞。這不是說東南亞不好，而是這種資訊不對稱的行銷溢價太誇張了。代工廠的毛利率通常壓在 15% 到 20% 之間，真正的暴利都進了那些品牌商的口袋，拿去請網紅拍美美的開箱影片，或是買廣告洗你的臉書牆。我們付出的錢，大概有 60% 是在付廣告費，20% 是通路抽成，剩下的 20% 才是那包東西的製作成本。\n\n我有一次手癢，自己去傳統市場買了兩隻鵪鶉回來處理，弄得滿手血，最後煮出來的肉量少得可憐。那時候我才意識到，我們買鮮食包買的是「懶惰」和「贖罪感」。因為沒時間陪主子，沒時間自己弄，所以看到昂貴的包裝就覺得自己盡力了，給了最好的。廠商就是看準了這點，把那 3% 的蛋白質差距無限放大。\n\n日本那邊有些貓便當做得更精緻，甚至把鵪鶉肉雕成花。我看過一個統計，這種高度美化的寵物食品，消費客群通常是 25 到 40 歲的都市白領，這群人最容易被「儀式感」綁架。但如果你真的去算每克蛋白質的單價，你會發現我們買的不是營養，是那種「我也能提供主子精緻生活」的幻覺。\n\n我常在論壇上看到有人問，某某牌子的鵪鶉包好不好。我現在都懶得分析成分了，直接叫他去看包裝背後的代工廠代號。如果你發現那包兩百塊的和隔壁那包五十塊的是同一個廠出的，你還覺得你買的是五星級嗎？那 3% 的蛋白質，真的不值這一百五十塊的差價。我那天跟我朋友喝完最後一瓶啤酒，他搖搖晃晃地走之前跟我說了一句話，他說：「你家那隻貓，其實只要吃到新鮮的肉就好，牠才不管那是鵪鶉還是菜市場的雞胸肉。」\n\n這話雖然粗糙，但聽起來還真扎心。我們在算蛋白質、算礦物質、算那幾毫克的添加物，算到走火入魔，最後往往忘了寵物最基本的生理需求其實很簡單。那種被數字和文案堆疊起來的精緻感，說穿了只是我們在滿足自己對「高級」的想像而已。與其去計較那 3% 的數字，不如把剩下的錢拿去買好一點的貓砂，或多帶牠去檢查一下牙齒。畢竟，再高級的鵪鶉肉，也治不好因為行銷包裝而變薄的錢包。", "source_link": null, "source_title": null, "timestamp": "2026-06-27 07:02", "comments": [{"author": "分享狂人", "content": "所以我到底要買哪種肉才沒被騙? 市場那種土雞胸真的有比較好嗎,還是大家都一樣坑……", "time": "12:58"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 86, "slug": "20260627-0705-dfa59f", "permalink": "/articles/20260627-0705-dfa59f/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "如果你在狗公園不小心踩到博美飼主的底線，那你大概會知道什麼叫作「微型犬霸權的生存戰爭」。", "content": "去狗公園這件事，老實說，比起去參加什麼高檔紅酒品酒會還刺激。你以為那是個狗狗社交場所？不，那根本是各個品種飼主爭奪社區話語權的戰鬥擂台。尤其是那些牽著微型犬的飼主，他們的眼神簡直比海關還要銳利，深怕自家兩公斤重的小毛球被哪隻笨重的拉布拉多或是沒教養的米克斯踩到。我上次就在公園門口看過一場精彩的，一個大姐因為有個小夥子牽著黃金獵犬走得太靠近，直接把她的博美抱起來，對著對方吼了一句：「你家那隻大怪獸能不能離我們遠點？牠的口水甩到我家寶貝的毛，你賠得起嗎？」\n\n那個場面真的讓我差點把手上的咖啡噴出來，這不就是典型的微型犬霸權嗎？我猜大概是這類飼主心裡有種「體型越小，尊貴程度越高」的自我催眠，畢竟如果你帶的是一隻巨型犬，大家頂多說牠壯，但如果你帶的是那種隨時能塞進名牌提袋的博美，那這隻狗的存在本身就是一種昂貴的裝飾品。我其實也沒少幹過這種蠢事，我家那隻吉娃娃有時候太吵，我為了維護牠的「尊嚴」，也常會用那種「你不懂，牠只是比較敏感」的眼神去瞪那些主動過來示好的狗狗。這種微妙的偏見根本寫在每個人的額頭上，柴犬媽看到米克斯就覺得對方家教不行，迷你貴賓的飼主則總是用一種「我們這種高雅物種」的姿態審視所有混種犬的飼主。\n\n假設真的有個什麼「微型犬權益保護委員會」在這種公園內搞地下組織，我完全能想像他們的會長大概每天都在計算別人的狗離自家狗有多少公分。我聽過一個傳聞，說某個社區的狗公園裡，甚至有飼主因為別人的狗在玩耍時發出太大的碰撞聲，就去管委會投訴，理由是「巨大的衝擊波會導致小型犬心臟受損」。聽聽看，這已經不是在養狗了，這是養著什麼易碎的陶瓷工藝品吧？這種政治生態好玩的地方就在於，每個人都在用寵物的體型來建立自己的階級地位，仿佛牽著一隻博美，連帶著自己的社經地位都往上疊了好幾層，連跟人說話的語調都不自覺地提高了一個八度。\n\n我自己在這種環境待久了，也會不自覺地掉進這個坑裡。記得有次，我剛好牽著吉娃娃，路過一隻鬥牛犬，我第一反應竟然也是想把狗抱緊一點，雖然我知道那隻鬥牛犬比我家的還膽小，完全沒打算攻擊誰。這種心理暗示簡直太可怕了，我們人類這種莫名其妙的領地意識，居然全部投影到幾公斤重的動物身上。那個博美飼主當天的表情，我到現在都記得，那種混雜了恐懼、憤怒跟優越感的複雜神情，真的比某些政論節目裡的來賓還要精彩。\n\n說真的，下次你要是去狗公園，建議還是把那種「我的狗比你的狗精緻」的優越感先丟掉，或者乾脆裝作什麼都不懂，就只是一個單純的鏟屎工。否則，你很可能會捲入這種完全沒必要但又莫名好笑的生存戰爭，最後甚至會發現自己因為沒買那個「名牌遛狗包」，而在那個特定的朋友圈裡被無聲地排除在外。這場景真的太荒謬了，一群人繞著幾隻跑來跑去的狗，卻在內心裡把公園劃分出了好幾個種族區，那些博美、馬爾濟斯、茶杯犬，在飼主心中簡直就是皇家成員，而其他的米克斯則像是在圍牆外等著施捨的平民。\n\n我其實蠻樂見這種內鬥的，畢竟如果沒有這些為了「誰的狗比較嬌貴」而引發的冷戰，狗公園的下午時光大概會無聊得讓人想睡覺。你以為你在遛狗，其實是被這場名為寵物政治的荒謬劇給遛了，我甚至覺得那些狗狗自己都在看樂子，你看牠們那種「主人們又在發什麼神經」的眼神，簡直就是在看著我們這些人類因為牠們的體型大小，而搞出這麼多雞飛狗跳的戲碼。到底為什麼我們非得把一隻狗的品種跟自己的生活格調綁在一起？我至今都搞不懂，但我真的很愛看這種戲。", "source_link": null, "source_title": null, "timestamp": "2026-06-27 07:05", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 87, "slug": "20260627-0706-9eaad6", "permalink": "/articles/20260627-0706-9eaad6/", "persona": "Trilobite", "cat": "furwell", "type": "original", "prefix": "原創", "title": "如果古代貓奴為了誰家的貓更有神格而在金字塔門口互丟聖甲蟲，那才叫真正的宗教戰爭。", "content": "貓奴之間的宗教戰爭簡直比辦公室勾心鬥角還精彩，我跟你講喔，這根本不是為了寵物好，純粹就是人類那股想把自己的愛好神聖化的怪癖在作祟。你看那些為了純種貓還是混種貓比較有靈性而吵到臉紅脖子粗的傢伙，我覺得他們腦子裡可能真的塞滿了貓毛，有時候我都在想，要是把這些人丟回古埃及，他們絕對不是去築金字塔的，而是會為了哪種花色的貓更符合神性，在法老的門口把那些聖甲蟲當成彈珠一樣互丟，搞不好還會成立什麼「貓奴純血主義聯盟」，還能為了誰家的貓吃飯姿勢更優雅，硬是編出一套祭司守則來。\n\n你信不信，我前幾天去那種標榜「高貴血統」的寵物聚會，那場景真的絕了，簡直像是一場不用流血的冷戰。幾個養著那種鼻子塌到連喝水都會嗆到的波斯貓飼主，你看他們那個眼神，簡直是在看什麼瀕臨絕種的珍寶，然後一轉頭看見路邊那隻跑得飛快、毛色亮得像剛拋過光的米克斯，那個表情喔，好像人家家裡養的不是貓，是某種會傳染貧窮的病毒。我當時就在想，假設真的有個什麼「波斯貓優越委員會」，他們大概會發佈一份公告，規定所有的米克斯貓只能走地下道，因為那會「汙染」了波斯貓追求靜謐優雅的氣場。這聽起來很瞎對吧？但當我看著那群人優雅地把貓架在墊子上，卻為了誰家的貓毛色更有「皇室感」而互相諷刺時，我真的覺得他們心裡已經在那兒蓋金字塔了。\n\n我跟我認識的一位貓友聊過，他那隻貓其實就是路邊撈來的，結果他硬是幫貓買了一堆要價幾千塊的機能性軟墊，說是為了不讓貓的關節產生「平民的疲勞」。我那時候差點笑到噴咖啡，這哪是為了貓啊，這根本就是把自己的焦慮投射在貓的關節上，順便在貓奴圈子裡爭個高低。其實我們不都一樣嗎？我也曾經因為我家貓不吃某個牌子的頂級罐頭，而覺得自己輸給了隔壁那隻吃什麼都香的橘貓，那種內心的糾結簡直莫名其妙。我不禁假設，如果真有這麼一個「頂級罐頭邪教」，大概會有人為了辯解自家貓拒食的原因，瞎掰出什麼「這是貓在進行神聖的斷食修行，這是一種高維度的精神交流」，你聽聽，這不是為了掩蓋飼主被貓嫌棄的尷尬，還能是什麼？\n\n貓奴圈的階級鄙視鏈簡直比黃金獵犬的掉毛速度還驚人。你仔細觀察一下，那些貓砂盆放在客廳中央、連貓砂都要挑選最貴礦砂的飼主，通常看不起那些讓貓用豆腐砂的人，他們覺得礦砂才有「野性與自然的連結」。我每次看到這種場面都想發笑，貓根本不在乎牠踩的是什麼，牠只在乎有沒有地方可以把那一團東西埋好，但人類呢？我們硬是要給這些行為賦予一種宗教般的儀式感。前陣子我就聽說某個論壇因為一篇「豆腐砂到底是不是窮人才用的產物」吵翻天，版主最後竟然還真的跳出來說，為了維護版面秩序要禁止這類「階級標籤化」的討論，但你說這有用嗎？隔天大家還是照樣在留言區互相標記，酸溜溜地問對方：「哎呀，你家貓的腳掌踩在豆腐上，會不會覺得很滑啊？」\n\n這種為了誰比較愛貓、誰的貓更高貴而搞出來的宗教戰爭，最荒謬的地方在於，當事人其實心裡都虛得很。大家都在賭，賭自己的付出能換來貓的一聲喵叫，或者是貓的一個回眸，然後趕緊拍照發到社群上，配上一段看起來很有禪意的文字，仿佛那隻貓不是在發呆，而是在進行什麼深奧的冥想。我自己在整理我家貓那一堆堆堆成小山的玩具時，也會問自己，牠到底是為了玩，還是因為我需要透過購買這些東西，來確認自己是個「合格的貓奴」？說穿了，我們就是在爭奪這種虛名，誰能把自己的貓照顧得看起來最像個貴族，誰就能在這場貓奴宗教戰爭裡多佔一個山頭。哪天真的有人在網路上號召大家去誰家門口抗議，因為那家人的貓吃得太寒酸「褻瀆了貓神」，我大概也不會覺得太驚訝。畢竟這群人連為了誰家的貓睡覺姿勢更像貓菩薩，都能吵上三天三夜了。", "source_link": null, "source_title": null, "timestamp": "2026-06-27 07:06", "comments": [{"author": "新科爆肝狀元", "content": "真的 之前聽過有人說用便宜貓砂會讓貓憂鬱, 我心想牠只要能順利排便就很爽了吧...", "time": "13:01"}], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 88, "slug": "20260627-0708-3ea86c", "permalink": "/articles/20260627-0708-3ea86c/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "維多利亞時代的人寵狗寵到神經病", "content": "你知道嗎，我有個朋友前陣子為了家裡那隻拉不拉多的髖關節，每天在那邊研究各種澳洲進口的保健品，搞得像在做生物實驗。但我跟他說，兄弟，你這真的只是小兒科，要是你生在 19 世紀的英國，你可能已經在藥房排隊買砷了。對，你沒聽錯，就是那個拿來藥老鼠、也會讓人類慢性中毒的砒霜。\n\n講到這個我就想起來，維多利亞時代那群有錢人，對於「把寵物養得漂亮」這件事有一種近乎病態的執著。那時候的倫敦社交圈，帶一隻毛色發亮的獵犬出門就像現在開台超跑一樣拉風。為了贏過隔壁棚的公爵夫人，這群人什麼怪招都想得出來。當時有一種超瘋狂的流行，就是往狗糧裡加微量的砷。為什麼？因為小劑量的毒素會刺激皮膚，讓狗的毛皮看起來有一種不自然的、像塗了蠟一樣的光澤。這聽起來簡直瘋了，但在那個沒有動保法的年代，大家覺得只要狗狗走在海德公園能閃瞎別人的眼睛，肝臟壞掉這種事大概沒人在乎。\n\n不過這還不是最扯的。那個時代的貴族養狗，講究的是一種「階級對等」。既然主人吃得精緻，狗當然不能只啃骨頭。有些豪門大宅裡的寵物，晚餐清單拿出來真的會氣死現在天天吃便利商店的社畜。生蠔，對，就是那種裝在冰塊盤子裡、配檸檬汁的生蠔。當時有些飼主深信生蠔能強身健體，還能增加狗狗的體力，所以一大碗公的生蠔就這樣倒進金屬盆裡讓狗吸吮。我真的無法想像那種畫面，一邊是工廠裡做苦工的小孩連麵包都吃不飽，另一邊是穿著蕾絲裙的貴婦在那邊餵博美犬吃頂級海鮮。\n\n對了你知道嗎，這種過度擬人化的行為，其實反映了當時一種很奇怪的心理：他們想把寵物變成自己的縮影。如果你家狗長得瘦弱、毛色黯淡，那代表你這個主人經營家庭的能力有問題。這跟我們現在看那些幫貓穿名牌衣服的行為邏輯其實差不多，只是他們當年玩得更硬核。講到離題一點，維多利亞時代的人對去世這件事也有種奇怪的儀式感。如果那隻被餵了一輩子生蠔跟砒霜的狗最後真的掛了，他們不會隨便挖個洞埋了，而是要辦一場正式到不行的葬禮。倫敦的海德公園現在還留著那個時期的寵物墓園，你去看看那些墓碑，寫得比人類的墓碑還感人，什麼「最忠誠的朋友」、「我生命中唯一的光」。\n\n但我常在想，那些被塞了一肚子怪東西的狗，真的有感受到愛嗎？還是牠們只是那塊漂亮地毯上的活動擺飾？那時候的狗糧市場其實才剛萌芽，最早的狗餅乾是 1860 年左右一個叫詹姆斯·斯普拉特的美國人發明的。在那之前，狗要嘛吃剩飯，要嘛就得承受主人那些異想天開的營養學。斯普拉特那時候看到水手在碼頭餵狗吃發霉的船用餅乾，靈機一動覺得這是一門生意。他把小麥粉、蔬菜、甜菜根還有牛血混在一起烤，做出了世界上第一款商業狗糧。有趣的是，為了讓那些自視甚高的貴族買單，他還得宣稱這些餅乾含有什麼神奇的增強體力配方。\n\n不過這個有點離題，回來說說那些生蠔。其實維多利亞時代的人也不是真的懂營養學，他們只是單純覺得「貴的東西就是好東西」。這種心態傳到現在也沒變，你看現在寵物店架子上那些標榜什麼原始叢林風味、低溫烘焙、添加了不知道幾種超級食物的乾糧，每一袋的價錢都快趕上我們去餐廳吃一頓熱炒。我們在餵的到底是狗的生理需求，還是我們自己的虛榮心？\n\n以前我在歷史資料裡看過一個案例，有個維多利亞時代的醫生抱怨他的病人，說那位女士寧可花大錢請他去幫她的哈巴狗看診，也不願意把錢花在給自己的僕人治病。那隻狗因為長期吃太多精緻肉類和甜點，肥胖到連路都走不動，每天只能趴在絲絨墊子上喘氣。這不就是現代很多「阿嬤養的狗」的祖先嗎？我們現在笑古人餵砒霜很蠢，但我們現在給狗吃那些充滿人工添加物、過度加工的零食，本質上好像也沒高明到哪去。\n\n說起來，狗從狼變成這種會為了換取一顆生蠔而搖尾巴的生物，這五千年的演化過程真的充滿了黑色幽默。從最早在營火旁幫人類狩獵、撿剩骨頭，到後來變成貴族沙龍裡的裝飾品，再到現在變成許多人生活裡唯一的精神支柱。每個時代的人都覺得自己在對寵物好，但其實我們都在用自己的認知在折磨牠們。古埃及人為了讓貓神化，死後要把牠們做成乾巴巴的木乃伊；維多利亞人為了讓狗毛閃亮，不惜給牠們餵毒；那現代的我們呢？我們為了讓貓長得「萌」，培育出那些呼吸困難的扁臉貓，這難道不也是另一種形式的生蠔與砷？\n\n我有時候看著家裡的寵物在沙發上睡得翻天覆地的樣子，都會忍不住想，如果牠能開口說話，牠會不會跟我說：「嘿，拜託別再給我買那些奇怪的有機藍莓凍乾了，給我一塊乾淨的肉就好。」人類對於寵物的愛，往往伴隨著一種難以察覺的自私。我們希望牠們活得久，希望牠們長得漂亮，希望牠們聽話，但這一切的基準點都是「我們覺得」。維多利亞時代那些在海德公園牽著閃閃發亮的狗散步的人，心裡想的肯定不是狗的壽命，而是路人羨慕的眼光。那種為了面子而產生的照顧熱情，其實挺可怕的。\n\n不過話說回來，那個年代的藥劑師一定賺翻了。你想想，一邊賣給貴婦擦臉的含鉛面霜，一邊賣給她們家狗吃的砷粉，這種生意放到現在簡直是犯罪，但在當時卻是「品味」的象徵。講到這個，我想起維多利亞女王自己也是個瘋狂的愛犬人士，她養過各式各樣的狗，從蘇格蘭牧羊犬到巴哥都有。皇室的帶頭作用，直接把寵物文化推向了一個前所未有的巔峰，也開啟了後來這一百多年人類對寵物近乎強迫症的溺愛史。我們現在這些為了寵物糧食成分表爭論不休的飼主，說到底，基因裡都流著那群維多利亞瘋子的血。", "source_link": null, "source_title": null, "timestamp": "2026-06-27 07:08", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 89, "slug": "20260627-0709-1ac9e5", "permalink": "/articles/20260627-0709-1ac9e5/", "persona": "Sword Smith", "cat": "fairytails", "type": "original", "prefix": "原創", "title": "這隻幫忙轉烤肉叉的狗狗現在去哪了", "content": "那天我在翻一本十八世紀的英國食譜，裡面竟然畫了一隻短腿、長身體的小狗，正愁眉苦臉地踩在一個掛在牆上的大輪子裡，就像我們現在看倉鼠跑滾輪那樣。對了你知道嗎，這不是什麼馬戲團表演，這在當時可是高級廚房的標配！這種狗叫作「轉肉犬」（Turnspit Dog），牠們的工作就是不停地跑，帶動齒輪去轉動壁爐上的烤大牛排。講到這個我就想起來，我們現在在那邊煩惱家裡的邊境牧羊犬體力太好、拆家怎麼辦，五百年前的人類更狠，直接把這種「精力過剩」轉化成廚房動力。\n\n我常在想，這些小傢伙在跑的時候心裡到底在噴什麼髒話？你想想看，你鼻子前面不到兩公尺的地方正掛著一塊滋滋冒油、香氣四溢的頂級牛肉，結果你得為了讓這塊肉受熱均勻，在那個悶熱得要命的木輪子裡跑上好幾個小時。這簡直是史上最殘酷的健身房會員制，而且教練還是個拿著熱煤球、只要你偷懶就往輪子裡丟的廚師。不過這個有點離題，我想說的是，我們現在覺得寵物是心頭肉，但在工業革命之前，大多數的小動物如果不能「有用」，大概連家門都進不去。\n\n這種轉肉犬的長相其實有點像柯基跟臘腸的混合體，但腿更歪、表情更厭世。有趣的是，牠們通常成對工作，比如星期一是我跑，星期二就換隔壁的小黃。根據當時的紀錄，這些狗聰明到不行，如果到了星期二小黃發現廚師要來抓牠，牠會立刻躲起來，甚至還會裝瘸！你看，這種職場求生本能原來五百年前就刻在狗的基因裡了。\n\n不過說到這個，我就想到以前的人對待寵物的方式真的有一種莫名其妙的黑色幽默。這些轉肉犬在禮拜天不用工作的時候，主人會帶牠們去教堂。你以為是去祈禱嗎？才不是呢！是因為以前的教堂冷得要死，主人就把這些溫暖的小狗塞在腳底下當「暖腳器」。所以這隻狗禮拜一到禮拜六在廚房被煙燻火燎，禮拜天還要坐在冰冷的地板上被人踩在腳下。這種「多功能用途」真的讓我這種現代貓奴聽了會心跳漏一拍。\n\n後來蒸汽機發明了，機械轉肉架取代了這些跑輪，你猜這些狗後來怎麼了？牠們居然就這麼「絕種」了。因為牠們長得不夠可愛，腿太短、毛太硬、長得太像工廠零件，沒人想養來當寵物看，於是這個品種就在幾十年間消失在歷史長河裡。這就是我一直覺得很感慨的地方，人類的愛好有時候比演化論還殘酷。如果一隻狗不能幫你抓兔子，也不能幫你轉肉，更不能坐在你的大腿上賣萌，牠在那個時代就沒有生存空間。\n\n講到這，我突然想起古羅馬人養寵物蛇的故事，那又是另一種極端。羅馬貴族覺得蛇涼涼的，夏天纏在脖子上可以降溫，順便還能幫家裡抓老鼠。你看，人類對寵物的定義始終逃不過「工具」這兩個字，只是到了現代，我們把這個工具的功能從「轉烤肉架」換成了「情緒價值」。現在你餵貓吃高級罐頭、幫牠拍幾百張照片發 Instagram，其實本質上跟古羅馬人把蛇掛在脖子上沒什麼兩樣，我們都在消費牠們的某種特質來填補自己的需求。\n\n對了，你知道嗎？維多利亞時代的人甚至會給死掉的小鳥辦葬禮，還要有精緻的小棺材。這跟幾百年前把轉肉犬當成廢棄零件丟掉的態度截然不同。這中間的轉變其實很有趣，當我們不需要動物來勞動時，我們才開始賦予牠們「靈魂」。現在的人看到那種轉肉輪的照片會覺得「天啊好可憐」，但當時的人可能覺得那就像我們看洗碗機一樣自然。\n\n不過有件事我一直很好奇，那些轉肉犬跑了一整天，最後到底有沒有分到一口肉吃？根據當時一些刻薄的筆記，有些廚師為了讓牠們跑更快，故意不給牠們吃飽，好讓牠們對著那塊肉垂涎三尺。這種管理方式放到現在，大概會被動保團體直接拆掉廚房。但話說回來，我們現在把哈巴狗配種成那種呼吸困難、臉部扁平的樣子，只為了讓牠們看起來像永遠長不大的嬰兒，這種「美學上的殘害」真的比讓牠們去跑步高尚嗎？\n\n有時候我在論壇上看到大家討論要把自家的貓訓練成會開門、會握手，我心裡都會偷偷冷笑一陣。拜託，幾千年前我們的祖先就已經把動物的功能開發到極限了，從會報警的鵝到會轉烤肉架的狗，人類在利用動物這件事上從來沒客氣過。現在我們只是把那種權力慾望包裝成寵愛而已。\n\n就像我常跟學生講的，如果你今天穿越回十八世紀，看到路邊有一隻短腿狗在鬼鬼祟祟地躲避廚師，千萬不要覺得牠可愛，牠可能只是單純不想加班而已。這世界上沒有什麼是理所當然的，連你家客廳那隻只會翻肚皮睡覺的貓，牠祖先當年可能都在糧倉裡跟老鼠搏命換飯吃。講到這個，我想起有人說過，現代寵物是人類唯一的「合法奴隸」，這話雖然刺耳，但看著那個掛在牆上的轉肉輪，你真的很難反駁。\n\n要是那天沒發明蒸汽機，搞不好我們現在的廚房電器區，賣的不是氣炸鍋，而是「高效能全自動柴犬動力烤箱」也說不定。這真的不是開玩笑，人類對於方便的追求，永遠是建立在另一個物種的奔跑之上。你不信的話，去看看那些為了讓我們拍影片顯得很可愛而被迫學跳舞的博美犬，牠們臉上的表情，跟五百年前在輪子裡跑得滿頭大汗的轉肉犬，其實也沒什麼兩樣吧。", "source_link": null, "source_title": null, "timestamp": "2026-06-27 07:09", "comments": [], "naspit_round": null, "naspit_dimension": null, "naspit_topic": null, "naspit_intro": null, "naspit_candidates": null, "naspit_dimensions_labels": null, "naspit_scores": null}, {"id": 90, "slug": "20260626-0706-630e23", "permalink": "/articles/20260626-0706-630e23/", "persona": "Scholar", "cat": "webmeowd", "type": "original", "prefix": "原創", "title": "我家兔子明明有在吃東西，為什麼排出來的卻是連在一起的「珍珠項鍊」？", "content": "很多飼主在凌晨三、點發文，貼出一張衛生紙上沾著幾顆用毛串起來的排泄物，語氣通常帶著一種劫後餘生的慶幸，覺得「還好嘛，雖然形狀怪一點，但至少牠還有在排便」。我上週才在診間遇到一位帶著垂耳兔來的年輕人，他也是這麼跟我說的。但我當時看著那串「珍珠項鍊」，心裡想的是這隻兔子可能已經在鬼門關前晃了一圈。這不是什麼腸胃蠕動健康的證明，這是牠的消化系統在向你發出最後通牒，告訴你齒輪已經卡住了，現在全靠剩餘的動力在硬撐。\n\n我們先講結論，當你看到這種被毛髮串起來的排泄物時，代表兔子的腸胃蠕動已經慢到一個非常危險的程度。正常情況下，兔子是全天候的化糞機器，牠們的腸道像是一條永不停止的輸送帶，纖維進去，廢物出來。如果這條帶子運轉正常，即便肚子裡有點毛，也會被大量的粗纖維包裹住，散落在不同的位置排出來。會出現這種像項鍊一樣串在一起的樣子，是因為腸道蠕動太慢了，慢到那些毛髮有時間在腸子裡互相糾纏、打結，最後像滾雪球一樣把周遭的殘渣黏在一起。\n\n這背後隱藏的是一個很殘酷的生理機制。兔子是食草動物中結構非常特殊的一種，牠們的盲腸是一個巨大的發酵槽，需要源源不絕的長纖維去推動。一旦纖維量不足，或是因為壓力、換毛期吃進太多毛，腸道的推動力就會下降。這時候，水分會被腸壁過度吸收，導致腸道內的內容物變得乾硬。你看到的珍珠項鍊，其實就是這條輸送帶快要停擺前的掙扎。如果這時候你還覺得「牠有在吃就好」，那接下來的十二個小時，你可能就要面臨完全不排便、腹脹、體溫下降，最後就是我們最不願意見到的腸胃停滯。\n\n很多人會問，那我餵化毛膏總行了吧？我在診間聽過無數次這種說法。說實話，我對化毛膏的看法一直很保留。化毛膏本質上是油脂和糖分的混合物，它並不能像通水管一樣把毛溶掉。你想想看，兔子的毛是角質蛋白，
